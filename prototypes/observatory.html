<title>LifeTracker Observatory</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Hanken+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: an orrery. The constellation sits at the centre; the eight sections orbit it on a ring.
   Inside, a sticky strip of glyphs moves between sections. A deliberate single night-sky look. */
:root {
  --sky: #0A0F1E; --sky-2: #0F1629; --panel: #131B32; --panel-2: #1A2442; --line: #273256; --line-2: #34406A;
  --star: #ECE5D2; --star-2: #AEB5CC; --star-3: #737D9C; --brass: #CFAE62; --brass-2: #8F7740; --warn: #F08A72; --ok: #8FD3A6;
  --violin: #E9B27C; --coding: #84B5F2; --sports: #8FD3A6; --gym: #F2958A; --study: #BCA6F4; --chess: #D8D2BC; --sleep: #929FF7; --screen: #F2A6D0;
  --display: "Marcellus", "Trajan Pro", Georgia, serif;
  --body: "Hanken Grotesk", ui-sans-serif, system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--sky); color: var(--star); font: 16px/1.5 var(--body); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  background-image: radial-gradient(1px 1px at 12% 18%, #fff8 50%, transparent), radial-gradient(1px 1px at 72% 8%, #fff6 50%, transparent), radial-gradient(1px 1px at 88% 42%, #fff5 50%, transparent), radial-gradient(1px 1px at 30% 64%, #fff4 50%, transparent), radial-gradient(1.4px 1.4px at 56% 86%, #fff6 50%, transparent), radial-gradient(1px 1px at 6% 92%, #fff4 50%, transparent), radial-gradient(ellipse at 50% -10%, #1B2550 0%, transparent 60%);
  background-attachment: fixed; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--sky); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
:focus-visible { outline: 1.5px solid var(--brass); outline-offset: 3px; border-radius: 8px; }
h1, h2, h3, p { margin: 0; text-wrap: balance; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.caps { font-family: var(--display); letter-spacing: .14em; text-transform: uppercase; font-size: 12px; color: var(--star-2); }
.dim { color: var(--star-3); } .mid { color: var(--star-2); } .small { font-size: 14px; }

.app { max-width: 560px; margin: 0 auto; min-height: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px calc(110px + env(safe-area-inset-bottom, 0px)); }
.view { animation: zoom .32s cubic-bezier(.2,.8,.2,1); transform-origin: var(--ox, 50%) var(--oy, 30%); }
@keyframes zoom { from { opacity: 0; transform: scale(.94); filter: blur(3px); } }
.view.back { animation: zoomout .3s cubic-bezier(.2,.8,.2,1); }
@keyframes zoomout { from { opacity: 0; transform: scale(1.05); filter: blur(3px); } }

/* home */
.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 40px; }
.top .when { font-family: var(--display); font-size: 15px; letter-spacing: .08em; color: var(--star-2); }
.streak { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 14px; color: var(--star); }
.streak svg { width: 22px; height: 22px; }
.orrery { position: relative; width: min(100%, 380px); aspect-ratio: 1; margin: 6px auto 0; max-width: 100%; }
.orrery > svg.rings { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.rings .r1 { fill: none; stroke: var(--line-2); stroke-width: .5; }
.rings .r2 { fill: none; stroke: var(--line); stroke-width: .5; stroke-dasharray: .6 1.6; }
.rings .tick { stroke: var(--line-2); stroke-width: .4; }
.rings .arc-bg { fill: none; stroke: var(--line); stroke-width: 1.4; }
.rings .arc { fill: none; stroke: var(--brass); stroke-width: 1.4; stroke-linecap: round; }
.rings text { font-family: var(--mono); font-size: 2.6px; fill: var(--star-3); }
.body-btn { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 3px; width: 76px; min-height: 64px; }
.body-btn .orb { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; color: var(--c); background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--c) 30%, var(--panel-2)), var(--panel) 70%); box-shadow: 0 0 0 1px color-mix(in srgb, var(--c) 45%, transparent), 0 0 18px color-mix(in srgb, var(--c) 22%, transparent); transition: transform .2s ease; }
.body-btn:active .orb { transform: scale(.92); }
.body-btn .orb svg { width: 20px; height: 20px; }
.body-btn b { font-family: var(--display); font-size: 12.5px; letter-spacing: .06em; font-weight: 400; line-height: 1; }
.body-btn small { font-family: var(--mono); font-size: 10.5px; color: var(--star-3); line-height: 1; }
.core { position: absolute; left: 50%; top: 48%; width: 38%; transform: translate(-50%, -50%); display: grid; justify-items: center; }
.core svg { width: 100%; height: auto; overflow: visible; }
.core .lv { font-family: var(--display); font-size: 21px; letter-spacing: .06em; margin-top: -10px; line-height: 1.1; }
.core .lvsub { font-family: var(--mono); font-size: 11px; color: var(--star-3); }
.whisper { position: absolute; left: 50%; top: 100%; transform: translate(-50%, 8px); width: 220px; text-align: center; font-family: var(--display); font-size: 14px; color: var(--brass); letter-spacing: .02em; animation: fadein .3s ease; z-index: 4; }
@keyframes fadein { from { opacity: 0; } }
.twinkle { animation: tw 3.2s ease-in-out infinite; }
.twinkle:nth-child(3n) { animation-delay: -1.1s; } .twinkle:nth-child(4n) { animation-delay: -2.3s; }
@keyframes tw { 50% { opacity: .55; } }
.drift { animation: drift 9s ease-in-out infinite; transform-origin: 50% 60%; }
@keyframes drift { 50% { transform: translateY(-1.5%) rotate(-1deg); } }

.ephem { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
.ephem-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.erow { display: grid; grid-template-columns: 74px 10px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 40px; border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); font-size: 15px; }
.erow .t { font-family: var(--mono); font-size: 12.5px; color: var(--star-2); }
.erow .st { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--star-3)); box-shadow: 0 0 8px var(--c, transparent); }
.erow .ti { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.linkcard { border: 1px solid var(--line-2); border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px; background: color-mix(in srgb, var(--panel) 70%, transparent); text-align: left; min-height: 64px; }
.linkcard b { font-family: var(--display); font-size: 16px; font-weight: 400; letter-spacing: .04em; }
.linkcard span { font-size: 13px; color: var(--star-3); }

/* fab */
.fab { position: fixed; z-index: 22; right: max(18px, calc(env(safe-area-inset-right, 0px) + 12px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); width: 62px; height: 62px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #E9CC86, var(--brass) 55%, var(--brass-2)); color: #1B1606; display: grid; place-items: center; box-shadow: 0 0 0 4px color-mix(in srgb, var(--brass) 18%, transparent), 0 10px 26px rgba(0,0,0,.45); }
.fab svg { width: 26px; height: 26px; }
@media (min-width: 900px) { .fab { right: calc(50% - 280px - 80px); } }

/* glyph strip */
.strip { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; margin: -14px calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 10px; padding: 8px max(16px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--sky) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.glyph { flex: none; display: grid; justify-items: center; gap: 2px; min-width: 50px; min-height: 52px; padding: 4px 2px; border-radius: 12px; color: var(--star-3); }
.glyph svg { width: 20px; height: 20px; }
.glyph span { font-family: var(--display); font-size: 10.5px; letter-spacing: .05em; }
.glyph.on { color: var(--c, var(--brass)); background: color-mix(in srgb, var(--c, var(--brass)) 12%, transparent); }
.glyph.sep { margin-left: 6px; border-left: 1px solid var(--line); border-radius: 0 12px 12px 0; padding-left: 8px; }

/* section heads & panels */
.shead { display: grid; gap: 4px; margin: 6px 0 14px; }
.shead .k { font-family: var(--mono); font-size: 11.5px; color: var(--c); letter-spacing: .06em; text-transform: uppercase; }
.shead h1 { font-family: var(--display); font-weight: 400; font-size: 34px; letter-spacing: .03em; line-height: 1.05; }
.shead .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-family: var(--mono); font-size: 12.5px; color: var(--star-2); }
.shead .meta b { color: var(--star); font-weight: 500; }
.panel { background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
.panel.glow { box-shadow: 0 0 0 1px color-mix(in srgb, var(--c) 25%, transparent), 0 20px 50px -30px color-mix(in srgb, var(--c) 60%, transparent); }
.h2 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 28px 2px 10px; }
.h2 h2 { font-family: var(--display); font-weight: 400; font-size: 19px; letter-spacing: .05em; }
.h2 .aside { font-family: var(--mono); font-size: 11.5px; color: var(--star-3); }
.h2 button { font-family: var(--mono); font-size: 12px; color: var(--brass); min-height: 36px; }
.readout { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.readout > div { background: var(--panel); padding: 12px 14px; display: grid; gap: 2px; }
.readout b { font-family: var(--mono); font-weight: 400; font-size: 22px; letter-spacing: -.01em; }
.readout span { font-size: 12.5px; color: var(--star-3); line-height: 1.3; }
.rows .r { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 11px 2px; border-bottom: 1px solid var(--line); min-height: 52px; }
.rows .r small { display: block; font-size: 13px; color: var(--star-3); line-height: 1.35; }
.rows .r .v { font-family: var(--mono); font-size: 14px; text-align: right; }
.rows .r.fresh { animation: shine 1.6s ease; }
@keyframes shine { from { background: color-mix(in srgb, var(--brass) 18%, transparent); } }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 99px; border: 1px solid var(--line-2); font-weight: 600; font-size: 15px; color: var(--star); }
.btn.brass { background: var(--brass); border-color: var(--brass); color: #1B1606; }
.btn.c { background: color-mix(in srgb, var(--c) 85%, #000); border-color: transparent; color: #0A0F1E; background: var(--c); }
.btn.block { width: 100%; }
.btn.sm { min-height: 38px; font-size: 13.5px; padding: 0 14px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; }
.sample { font-family: var(--mono); font-size: 11.5px; color: var(--star-3); display: inline-flex; align-items: baseline; gap: 6px; line-height: 1.4; }
.sample::before { content: "◌"; }
.tagx { font-family: var(--mono); font-size: 11.5px; padding: 3px 8px; border-radius: 99px; border: 1px solid var(--line-2); color: var(--star-2); white-space: nowrap; }
.tagx.c { border-color: color-mix(in srgb, var(--c) 50%, transparent); color: var(--c); }
.tagx.warn { border-color: var(--warn); color: var(--warn); }
.tagx.ok { border-color: var(--ok); color: var(--ok); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 36px; padding: 0 13px; border-radius: 99px; border: 1px solid var(--line-2); font-size: 13.5px; color: var(--star-2); display: inline-flex; align-items: center; gap: 6px; }
.chip.on { background: var(--star); color: var(--sky); border-color: var(--star); }
.chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.thinbar { height: 3px; background: var(--line); border-radius: 3px; overflow: hidden; }
.thinbar i { display: block; height: 100%; background: var(--c, var(--brass)); border-radius: 3px; }

/* charts */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.ch-grid { stroke: var(--line); stroke-width: 1; }
.ch-axis, .ch-lbl { fill: var(--star-3); font: 10px var(--mono); }
.ch-lbl.is-hi { fill: var(--star); }
.ch-bar { fill: color-mix(in srgb, var(--c, var(--brass)) 30%, transparent); }
.ch-bar.is-met { fill: color-mix(in srgb, var(--c, var(--brass)) 62%, transparent); }
.ch-bar.is-hi { fill: var(--c, var(--brass)); }
.ch-target { stroke: var(--brass); stroke-dasharray: 3 4; }
.ch-target-lbl { fill: var(--brass); font: 10px var(--mono); }
.ch-line { fill: none; stroke: var(--c, var(--brass)); stroke-width: 1.8; }
.ch-area { fill: color-mix(in srgb, var(--c, var(--brass)) 12%, transparent); }
.ch-dot { fill: var(--sky); stroke: var(--c, var(--brass)); stroke-width: 1.5; }
.ch-dot.is-end { fill: var(--c, var(--brass)); filter: drop-shadow(0 0 4px var(--c, var(--brass))); }
.dial-wrap { display: grid; grid-template-columns: 150px 1fr; gap: 14px; align-items: center; }
.dial-wrap svg { width: 100%; height: auto; overflow: visible; }
.dial text { font-family: var(--mono); font-size: 7px; fill: var(--star-3); }
.dial .val { font-family: var(--display); font-size: 22px; fill: var(--star); }
.days28 { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 6px; }
.days28 i { aspect-ratio: 1; border-radius: 50%; background: var(--line); justify-self: center; width: 60%; }
.days28 i.l1 { background: color-mix(in srgb, var(--c) 45%, transparent); width: 60%; }
.days28 i.l2 { background: color-mix(in srgb, var(--c) 75%, transparent); width: 80%; }
.days28 i.l3 { background: var(--c); width: 100%; box-shadow: 0 0 8px var(--c); }
.days28 i.now { outline: 1px solid var(--brass); outline-offset: 2px; }

/* gym */
.ex { padding: 14px 0; border-bottom: 1px solid var(--line); }
.ex-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ex-h h3 { font-family: var(--display); font-weight: 400; font-size: 19px; letter-spacing: .03em; }
.setrow { display: grid; grid-template-columns: 22px 1fr 1fr 46px; gap: 8px; align-items: center; min-height: 52px; }
.setrow .n { font-family: var(--mono); color: var(--star-3); font-size: 13px; }
.adj { display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--line-2); border-radius: 12px; height: 44px; }
.adj button { width: 36px; height: 42px; color: var(--star-2); font-size: 18px; }
.adj output { font-family: var(--mono); font-size: 14px; flex: 1; text-align: center; }
.adj output small { color: var(--star-3); font-size: 10.5px; }
.ring-btn { width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; color: transparent; }
.ring-btn svg { width: 20px; height: 20px; }
.ring-btn.on { background: var(--gym); border-color: var(--gym); color: var(--sky); box-shadow: 0 0 14px color-mix(in srgb, var(--gym) 60%, transparent); }
.setrow.done .adj { opacity: .5; }
.week7 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.week7 > div { border: 1px solid var(--line); border-radius: 12px; min-height: 80px; padding: 6px 2px; display: grid; align-content: start; justify-items: center; gap: 3px; text-align: center; font-size: 11px; }
.week7 .d { font-family: var(--mono); color: var(--star-3); font-size: 10.5px; }
.week7 b { font-family: var(--display); font-size: 16px; font-weight: 400; }
.week7 .g { color: var(--gym); font-weight: 600; line-height: 1.1; }
.week7 .g.done { background: var(--gym); color: var(--sky); border-radius: 6px; padding: 1px 3px; }
.week7 .s { color: var(--sports); line-height: 1.1; font-size: 10.5px; }
.week7 .now { border-color: var(--brass); }
.restbar { position: fixed; z-index: 25; left: max(16px, env(safe-area-inset-left, 0px)); right: calc(96px + env(safe-area-inset-right, 0px)); bottom: calc(26px + env(safe-area-inset-bottom, 0px)); max-width: 440px; border-radius: 99px; background: var(--panel-2); border: 1px solid var(--line-2); padding: 6px 6px 6px 16px; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.restbar b { font-family: var(--mono); font-size: 20px; font-weight: 400; color: var(--gym); }
.restbar .grow { flex: 1; font-size: 13px; color: var(--star-2); }
.restbar button { min-height: 40px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line-2); font-size: 13px; }

/* sleep clock */
.clockface .tk { stroke: var(--line-2); stroke-width: .6; }
.clockface text { font-family: var(--mono); font-size: 6.5px; fill: var(--star-3); }
.clockface .arc { fill: none; stroke-linecap: round; }
.clockface .tgt { fill: none; }
.sleep-entry { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tp { border: 1px solid var(--line-2); border-radius: 16px; padding: 12px; display: grid; justify-items: center; gap: 6px; }
.tp .tv { font-family: var(--mono); font-size: 32px; letter-spacing: -.02em; }
.tp .rw { display: flex; gap: 6px; }
.tp button, .sbtn { min-width: 46px; min-height: 40px; border-radius: 99px; border: 1px solid var(--line-2); font-family: var(--mono); font-size: 13px; color: var(--star-2); }
.moonrow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center; }
.moonrow > div { display: grid; justify-items: center; gap: 2px; }
.moonrow svg { width: 28px; height: 28px; }
.moonrow span { font-family: var(--mono); font-size: 10.5px; color: var(--star-3); }
.moonrow b { font-family: var(--mono); font-size: 11.5px; font-weight: 400; }
.switch { width: 46px; height: 28px; border-radius: 99px; border: 1px solid var(--line-2); position: relative; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--star-3); transition: transform .2s, background .2s; }
.switch.on { border-color: var(--brass); }
.switch.on::after { transform: translateX(18px); background: var(--brass); box-shadow: 0 0 10px var(--brass); }

/* road */
.road svg { width: 100%; height: auto; display: block; overflow: visible; }
.road text { font-family: var(--body); font-size: 11.5px; fill: var(--star); }
.road .w { font-family: var(--mono); font-size: 9.5px; fill: var(--star-3); }

/* calendar time grid */
.tg { display: grid; grid-template-columns: 38px repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--panel); }
.tg .colh { padding: 8px 4px; text-align: center; border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.tg .colh b { display: block; font-family: var(--display); font-weight: 400; font-size: 18px; }
.tg .colh span { font-family: var(--mono); font-size: 10.5px; color: var(--star-3); }
.tg .colh.today b { color: var(--brass); }
.tg .allday { border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 4px 3px; display: grid; gap: 3px; align-content: start; min-height: 30px; }
.tg .hours { position: relative; }
.tg .hours span { position: absolute; right: 4px; font-family: var(--mono); font-size: 9.5px; color: var(--star-3); transform: translateY(-50%); }
.tg .col { position: relative; border-left: 1px solid var(--line); background-image: linear-gradient(var(--line) 1px, transparent 1px); background-size: 100% var(--hh); }
.evb { position: absolute; border-radius: 8px; padding: 3px 5px; font-size: 11px; line-height: 1.2; overflow: hidden; text-align: left; background: color-mix(in srgb, var(--c) 22%, var(--panel)); border-left: 2px solid var(--c); color: var(--star); }
.evb.planned { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--c) 14%, var(--panel)) 0 5px, color-mix(in srgb, var(--c) 6%, var(--panel)) 5px 10px); border-left-style: dashed; }
.evb.done { background: color-mix(in srgb, var(--c) 40%, var(--panel)); }
.evb.clash { box-shadow: inset 0 0 0 1.5px var(--warn); }
.evb.cancelled { opacity: .45; text-decoration: line-through; }
.evb b { font-weight: 600; display: block; }
.evb span { font-family: var(--mono); font-size: 9.5px; color: var(--star-2); }

/* ---------- constellation stag ---------- */

const PTS = { nose: [38, 92], muz: [48, 97], eye: [50, 84], ear: [66, 72], poll: [58, 78], throat: [62, 96], wither: [76, 104], back: [110, 102], hip: [140, 104], tail: [152, 96], rump: [146, 118], belly: [108, 132], chest: [78, 126], fk1: [80, 152], ff1: [78, 176], fk2: [92, 152], ff2: [94, 176], hk1: [132, 150], hf1: [128, 176], hk2: [144, 148], hf2: [146, 176],

function sleepClock(nights) {
  // 24h dial, midnight at top; one concentric arc per night (outer = most recent)
  const C = 100, pt = (min, r) => { const a = (min / 1440) * 2 * Math.PI - Math.PI / 2; return [C + Math.cos(a) * r, C + Math.sin(a) * r]; };
  const arcPath = (m1, m2, r) => { let d = m2 - m1; if (d <= 0) d += 1440; const [x1, y1] = pt(m1, r), [x2, y2] = pt(m1 + d, r); return `M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 ${d > 720 ? 1 : 0} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`; };
  let s = '';
  for (let h = 0; h < 24; h++) { const [x1, y1] = pt(h * 60, 92), [x2, y2] = pt(h * 60, h % 6 ? 88 : 84); s += `<line class="tk" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`; if (h % 6 === 0) { const [tx, ty] = pt(h * 60, 76); s += `<text x="${tx}" y="${ty + 2}" text-anchor="middle">${String(h).padStart(2, '0')}</text>`; } }
  const sch = LT.state.sleep.schedule.weekday;
  s += `<path class="tgt" d="${arcPath(D.toMin(sch.bed), D.toMin(sch.wake), 96)}" stroke-width="3" stroke="var(--brass)" opacity=".5"/>`;
  nights.forEach((n, i) => { const r = 68 - i * 6.5; s += `<path class="arc" d="${arcPath(D.toMin(n.bed), D.toMin(n.wake), r)}" stroke="${n.fresh ? 'var(--brass)' : 'var(--sleep)'}" stroke-width="4" opacity="${1 - i * .1}"><title>${F.date(n.date)}: ${n.bed}–${n.wake}</title></path>`; });
  return `<svg class="clockface" viewBox="0 0 200 200" role="img" aria-label="Sleep clock: last ${nights.length} nights as arcs on a 24-hour dial">${s}</svg>`;
}
function moon(frac) { // frac 0..1 = how full (by duration vs 9h)
  const r = 10, k = Math.max(0, Math.min(1, frac)), x = r - 2 * r * k;
  return `<svg viewBox="-12 -12 24 24" aria-hidden="true"><circle r="${r}" fill="var(--line)"/><path d="M0 ${-r} A${r} ${r} 0 0 1 0 ${r} A${Math.abs(x)} ${r} 0 0 ${x > 0 ? 0 : 1} 0 ${-r}" fill="var(--sleep)"/></svg>`;
}

V.calendar = S => {
  const ui = S.ui, start = ui.calSel, days = [0, 1, 2].map(i => D.addDays(start, i));
  const occ = LT.cal.occurrences(start, days[2], { sections: ui.calFilter });
  const H0 = 6, H1 = 22, HH = 34, colH = (H1 - H0) * HH;
  const conf = LT.cal.conflicts(start, D.addDays(start, 13));
  const col = d => {
    const timed = occ.filter(o => o.date === d && o.start && o.end && o.kind !== 'task' && o.kind !== 'log');
    // side-by-side lanes for overlaps
    const lanes = []; timed.forEach(o => { let l = 0; while (lanes[l] && lanes[l].some(x => D.toMin(x.start) < D.toMin(o.end) && D.toMin(o.start) < D.toMin(x.end))) l++; (lanes[l] = lanes[l] || []).push(o); o._lane = l; });
    return timed.map(o => {
      const top = (D.toMin(o.start) / 60 - H0) * HH, h = Math.max(22, (D.toMin(o.end) - D.toMin(o.start)) / 60 * HH - 2);
      const hasOverlap = timed.some(x => x !== o && D.toMin(x.start) < D.toMin(o.end) && D.toMin(o.start) < D.toMin(x.end));
      const n = hasOverlap ? lanes.length : 1, w = 100 / n, left = (hasOverlap ? o._lane : 0) * w;
      return `<button class="evb ${o.status === 'done' ? 'done' : 'planned'} ${o.conflict && !o.cancelled ? 'clash' : ''} ${o.cancelled ? 'cancelled' : ''}" style="${cv(o.section)};top:${top}px;height:${h}px;left:calc(${left}% + 2px);width:calc(${w}% - 4px)" data-a="ev" data-v="${o.id}"><b>${E(o.title)}</b><span>${o.start}${o.status === 'done' ? ' · done' : ''}</span></button>`;
    }).join('');
  };
  return `<div class="view">${strip(S)}
  <header class="shead"><span class="k" style="color:var(--brass)">Shared calendar</span><h1>Almanac</h1></header>
  <div class="chips"><button class="chip ${!ui.calFilter.length ? 'on' : ''}" data-a="calfclear">All</button>${LT.SECTIONS.map(s => `<button class="chip ${ui.calFilter.includes(s.id) ? 'on' : ''}" data-a="calf" data-v="${s.id}" style="${cv(s.id)}"><i></i>${s.name}</button>`).join('')}</div>
  <div class="navrow"><button class="circle-btn" data-a="cald" data-v="${D.addDays(start, -3)}" aria-label="Earlier days">${ic('left')}</button><b>${F.short(days[0])} – ${F.short(days[2])}</b><button class="circle-btn" data-a="cald" data-v="${D.addDays(start, 3)}" aria-label="Later days">${ic('right')}</button></div>
  ${start !== T ? `<button class="linkb" data-a="cald" data-v="${T}">Back to today</button>` : ''}
  ${conf.length ? `<div class="alert">${ic('warn')}<span>${conf.length} overlapping events in the next two weeks (${[...new Set(conf.map(c => F.date(c.date)))].join(', ')}). Nothing is moved for you. Tap one to reschedule.</span></div>` : ''}
  <div class="tg" style="--hh:${HH}px">
    <div></div>${days.map(d => `<div class="colh ${d === T ? 'today' : ''}"><span>${F.day(d)}</span><b>${D.parse(d).getDate()}</b></div>`).join('')}
    <div class="hours" style="border-bottom:1px solid var(--line)"></div>${days.map(d => `<div class="allday">${occ.filter(o => o.date === d && (!o.start || o.kind === 'task' || o.kind === 'log')).map(o => `<span class="pillx ${o.status === 'done' ? 'done' : ''}" style="${cv(o.section || 'brass')}">${o.kind === 'task' ? '◦ ' : o.kind === 'log' ? '✓ ' : ''}${E(o.title)}</span>`).join('')}</div>`).join('')}
    <div class="hours" style="height:${colH}px">${Array.from({ length: H1 - H0 }, (_, i) => `<span style="top:${i * HH}px">${String(H0 + i).padStart(2, '0')}</span>`).join('')}</div>
    ${days.map(d => `<div class="col" style="height:${colH}px">${col(d)}</div>`).join('')}
  </div>
  <p class="note" style="margin-top:8px">Striped = planned · solid = completed · red outline = clash · ✓ = logged without a plan</p>
  <div class="foot"><span class="sample">${E(LT.LABELS.google)}</span><span class="sample">${E(LT.LABELS.school)}</span><button class="linkb" data-a="addev">Add an event</button></div>
  </div>`;
};

  </div><div>
  ${h2('Star catalogue', `<span class="aside">${ach.filter(a => a.unlocked).length} of ${ach.length} named</span>`)}
  <div class="rows catalogue">${ach.map(a => `<div class="r ${a.unlocked ? '' : 'locked'}"><span class="star">${ic('atlas', 'style="width:14px;height:14px"' + (a.unlocked ? ' fill="currentColor"' : ''))}</span><div><b style="font-weight:600">${E(a.title)}</b><small>${E(a.desc)}</small></div><span class="v dim">${a.unlocked ? F.short(a.unlocked) : a.progress + '/' + a.goal}</span></div>`).join('')}</div>
  </div></div>
  ${h2('How XP works here')}
  <div class="panel small mid" style="display:grid;gap:6px"><p>Time gives about 1 XP per 2 minutes, capped per session.</p><p>Logging earns a small flat bonus; weekly targets and milestones earn more.</p><p>Gym XP stops at the planned sets. Sleep XP is for recording and a steady bedtime.</p><p class="dim">${E(LT.LABELS.xp)}.</p></div>
  <div class="foot"><button class="linkb" data-a="reset">Reset prototype data</button></div>
  </div>`;
};

/* ---------- sheets ---------- */
const sheet = (title, inner, c = 'brass', steps = '') => `<div class="scrim" data-a="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${E(title)}" style="${cv(c)}"><div class="sh-h"><h2>${E(title)}</h2><button class="sh-x" data-a="close" aria-label="Close">${ic('close')}</button></div>${steps}${inner}</div>`;
const SH = {};
SH.violin = S => {
  const f = S.sheet, Vn = LT.violin, names = ['Session type', 'Total duration', 'Pieces and scales'];
  const steps = `<div class="sh-steps">${[1, 2, 3].map(i => `<i class="${f.step >= i ? 'on' : ''}"></i>`).join('')}<span>${f.step}/3 · ${names[f.step - 1]}</span></div>`;
  let body, foot;
  if (f.step === 1) {
    const hint = { solo: 'On your own', lesson: 'Thursdays, 16:00', orchestra: 'Thursdays, 17:15', trio: 'Elgar with the trio' };
    body = `<div class="opts">${Vn.TYPES.map(t => `<button class="opt ${f.typeId === t.id ? 'on' : ''}" data-a="vtype" data-v="${t.id}"><b>${t.name}</b><small>${hint[t.id]}</small></button>`).join('')}</div>`;
    foot = `<button class="btn block" data-a="close">Cancel</button>`;
  } else if (f.step === 2) {
    body = (f.timer ? `<div style="text-align:center;display:grid;gap:10px"><b id="vtimer" class="mono" style="font-size:56px;font-weight:400;letter-spacing:-.04em">${S.clock(f.timerSec)}</b><div style="display:flex;gap:8px;justify-content:center"><button class="btn sm ${f.timerRunning ? '' : 'c'}" data-a="vtimer">${f.timerRunning ? 'Pause' : f.timerSec ? 'Resume' : 'Start'}</button><button class="btn sm" data-a="vtimerdone" ${f.timerSec ? '' : 'disabled'}>Use this time</button></div></div>`
      : `<div class="bigmin"><button class="round" data-a="vmin" data-d="-5" aria-label="5 minutes less">−5</button><output>${f.minutes}<small>minutes total</small></output><button class="round" data-a="vmin" data-d="5" aria-label="5 minutes more">+5</button></div><div class="picks" style="justify-content:center">${[15, 20, 30, 45, 60, 90].map(m => `<button class="pk ${f.minutes === m ? 'on' : ''}" data-a="vset" data-v="${m}">${m}</button>`).join('')}</div>`) +
      `<button class="togrow" data-a="vtimermode"><span>Use a start/stop timer</span><span class="switch ${f.timer ? 'on' : ''}"></span></button><p class="note">One total can cover several pieces.</p>`;
    foot = `<button class="btn" data-a="vback">Back</button><button class="btn c block" data-a="vnext">Next</button>`;
  } else {
    const alloc = Object.values(f.split).reduce((a, b) => a + b, 0);
    const pk = kind => Vn.pieces.filter(p => p.kind === kind).map(p => `<button class="pk ${f.items.includes(p.id) ? 'on' : ''}" data-a="vitem" data-v="${p.id}">${E(p.kind === 'piece' ? p.composer + ' · ' + p.title.split(' — ')[0].split(',')[0] : p.title)}</button>`).join('');
    body = `<p class="mid">${f.minutes} minutes of ${Vn.typeName(f.typeId).toLowerCase()}</p><div class="grp"><h4>Pieces</h4><div class="picks">${pk('piece')}</div></div><div class="grp"><h4>Scales</h4><div class="picks">${pk('scale')}</div></div>
      <button class="togrow" data-a="vsplitmode" ${f.items.length > 1 ? '' : 'disabled style="opacity:.45"'}><span>Split time by piece <span class="dim">· optional</span></span><span class="switch ${f.splitOn ? 'on' : ''}"></span></button>
      ${f.splitOn && f.items.length > 1 ? `<div>${f.items.map(id => `<div class="kv"><span>${E(Vn.item(id).kind === 'piece' ? Vn.item(id).composer : Vn.item(id).title)}</span>${stepper('vsplit', (f.split[id] || 0) + ' min', 'minutes', `data-v="${id}"`)}</div>`).join('')}<p class="note ${alloc > f.minutes ? 'warn' : ''}" style="margin-top:8px">${alloc > f.minutes ? `${alloc - f.minutes} min over the total.` : `${alloc} of ${f.minutes} min assigned${alloc < f.minutes ? '; the rest stays unassigned' : ''}.`}</p></div>` : ''}
      ${f.noteOpen ? `<textarea id="vnote" data-in="notes" placeholder="Note (optional)">${E(f.notes)}</textarea>` : `<button class="linkb" data-a="vnote">Add a note</button>`}`;
    foot = `<button class="btn" data-a="vback">Back</button><button class="btn c block" data-a="vsave" ${f.items.length && !(f.splitOn && alloc > f.minutes) ? '' : 'disabled'}>Save ${F.dur(f.minutes)}</button>`;
  }
  return sheet('Log violin', `<div class="sh-b" data-sheet-body>${body}</div><div class="sh-f">${foot}</div>`, 'violin', steps);
};
SH.quick = S => sheet('Record', `<div class="sh-b" data-sheet-body><div class="opts">${[['violin', 'Violin', 'type · minutes · pieces'], ['gym', 'Gym', LT.state.gym.active ? 'resume session' : 'follow the plan'], ['sleep', 'Last night', LT.sleep.lastNightLogged() ? 'recorded' : 'bed and wake'], ['screen', 'Screen time', LT.screen.todayLogged() ? 'recorded' : 'today’s total'], ['sports', 'Sport', 'run · ride · swim · court'], ['study', 'Study', 'subject · minutes'], ['chess', 'Chess', 'puzzles · study'], ['tasks', 'Task', 'add to the ledger']].map(([id, t, s]) => `<button class="opt" data-a="ql" data-v="${id}" style="${cv(id === 'tasks' ? 'brass' : id)}"><span style="color:var(--c)">${ic(id === 'tasks' ? 'tasks' : id, 'style="width:20px;height:20px"')}</span><b>${t}</b><small>${s}</small></button>`).join('')}</div></div>`);
SH.sport = S => {
  const f = S.sheet, K = LT.sports.kinds, end = ['running', 'cycling', 'swimming'].includes(f.sport);
  const metric = end ? (f.sport === 'running' ? F.pace(f.minutes, f.km) : f.sport === 'cycling' ? F.speed(f.minutes, f.km) : F.swim(f.minutes, f.km)) : '';
  return sheet('Log sport', `<div class="sh-b" data-sheet-body><div class="picks">${Object.keys(K).map(k => `<button class="pk ${f.sport === k ? 'on' : ''}" data-a="ssport" data-v="${k}">${K[k].name}</button>`).join('')}</div>
    <div class="kv"><span>Duration</span>${stepper('smin', F.dur(f.minutes), 'duration')}</div>
    ${end ? `<div class="kv"><span>Distance</span>${stepper('skm', f.km.toFixed(f.sport === 'swimming' ? 2 : 1) + ' km', 'distance')}</div><div class="kv"><span>${f.sport === 'cycling' ? 'Speed' : 'Pace'}</span><span class="mono" style="color:var(--sports)">${metric}</span></div>`
      : `<div class="kv"><span>Type</span><span class="picks">${['Training', 'Match'].map(x => `<button class="pk ${f.kind === x ? 'on' : ''}" data-a="skind" data-v="${x}">${x}</button>`).join('')}</span></div>${f.kind === 'Match' ? `<input type="text" id="sscore" data-in="score" placeholder="Score (optional)" value="${E(f.score)}">` : ''}`}
    <textarea id="snotes" data-in="notes" placeholder="${end ? 'Route or notes (optional)' : 'Skill notes (optional)'}">${E(f.notes)}</textarea></div>
    <div class="sh-f"><button class="btn" data-a="close">Cancel</button><button class="btn c block" data-a="ssave">Save</button></div>`, 'sports');
};
SH.study = S => { const f = S.sheet; return sheet('Log study', `<div class="sh-b" data-sheet-body><div class="picks">${LT.study.subjects.map(s => `<button class="pk ${f.subject === s.id ? 'on' : ''}" data-a="stsub" data-v="${s.id}">${s.name}</button>`).join('')}</div><div class="kv"><span>Duration</span>${stepper('stmin', F.dur(f.minutes), 'duration')}</div><input type="text" id="sttopic" data-in="topic" placeholder="Topic covered" value="${E(f.topic)}"></div><div class="sh-f"><button class="btn" data-a="close">Cancel</button><button class="btn c block" data-a="stsave">Save</button></div>`, 'study'); };
SH.chess = S => { const f = S.sheet; return sheet('Log chess', `<div class="sh-b" data-sheet-body><div class="picks">${[['puzzles', 'Puzzles'], ['study', 'Study']].map(([k, l]) => `<button class="pk ${f.kind === k ? 'on' : ''}" data-a="chkind" data-v="${k}">${l}</button>`).join('')}</div><div class="kv"><span>Duration</span>${stepper('chmin', F.dur(f.minutes), 'duration')}</div>${f.kind === 'puzzles' ? `<div class="kv"><span>Solved</span>${stepper('chsolved', f.solved, 'puzzles solved')}</div>` : `<input type="text" id="chtopic" data-in="topic" placeholder="What did you study?" value="${E(f.topic)}">`}<p class="note">Games would come from Chess.com; these are fictional samples.</p></div><div class="sh-f"><button class="btn" data-a="close">Cancel</button><button class="btn c block" data-a="chsave">Save</button></div>`, 'chess'); };
SH.swap = S => { const e = LT.state.gym.active.exercises[S.sheet.ei]; return sheet('Swap exercise', `<div class="sh-b" data-sheet-body><p class="mid">Replace ${E(e.name)} for today.</p><div class="rows">${e.alts.map(a => `<button class="r" data-a="gswapto" data-v="${E(a)}" style="width:100%;text-align:left"><span>${E(a)}</span><span style="color:var(--brass)">${ic('right', 'style="width:16px;height:16px"')}</span></button>`).join('')}</div></div>`, 'gym'); };
SH.finish = S => { const f = S.sheet; return sheet('Check in', `<div class="sh-b" data-sheet-body><p class="note">Optional. Helps plan around sport and recovery.</p>
  <div class="grp"><h4>Effort out of 10</h4><div class="scale5">${[5, 6, 7, 8, 9].map(v => `<button class="${f.effort === v ? 'on' : ''}" data-a="fin" data-f="effort" data-v="${v}">${v}</button>`).join('')}</div></div>
  <div class="grp"><h4>Soreness 0–4</h4><div class="scale5">${[0, 1, 2, 3, 4].map(v => `<button class="${f.soreness === v ? 'on' : ''}" data-a="fin" data-f="soreness" data-v="${v}">${v}</button>`).join('')}</div></div>
  <button class="togrow" data-a="finpain"><span>Any pain? <span class="dim">e.g. shins</span></span><span class="switch ${f.pain ? 'on' : ''}"></span></button>
  ${f.pain ? `<input type="text" id="painnote" data-in="painNote" placeholder="Where, and what made it worse?" value="${E(f.painNote)}">` : ''}</div>
  <div class="sh-f"><button class="btn" data-a="close">Back</button><button class="btn c block" data-a="gdone">Save session</button></div>`, 'gym'); };
SH.ev = S => {
  const f = S.sheet, o = f.occ, s = LT.section(o.section);
  return sheet(o.title, `<div class="sh-b" data-sheet-body><p class="mono small mid">${s ? s.name : 'General'} · ${F.date(o.date)}${o.start ? ' · ' + o.start + '–' + o.end : ''}${o.recurring ? ' · weekly' : ''}</p>
    ${o.conflict && !o.cancelled ? `<div class="alert" style="margin:0">${ic('warn')}<span>Overlaps ${E(o.conflictWith.join(', '))}. You choose what moves.</span></div>` : ''}
    ${o.status === 'done' ? `<p class="note">Completed: ${E(o.logged.title)}</p>` : ''}
    ${o.cancelled ? `<button class="btn block" data-a="evrestore">Restore</button>` : `
    <div class="kv"><span>Date</span>${stepper('evd', F.date(f.date), 'date')}</div>${o.start ? `<div class="kv"><span>Start</span>${stepper('evt', f.start, 'start time')}</div>` : ''}
    ${o.recurring ? `<div class="grp"><h4>Apply to</h4><div class="opts"><button class="opt ${f.scope === 'one' ? 'on' : ''}" data-a="evscope" data-v="one" style="min-height:64px"><b>This event</b><small>${F.date(o.origDate)} only</small></button><button class="opt ${f.scope === 'future' ? 'on' : ''}" data-a="evscope" data-v="future" style="min-height:64px"><b>This and later</b><small>changes the series</small></button></div></div>` : ''}
    <div style="display:flex;gap:8px"><button class="btn" data-a="evcancel" style="color:var(--warn);border-color:var(--warn)">Cancel ${o.recurring && f.scope === 'future' ? 'series' : 'event'}</button><button class="btn c" data-a="evsave" style="flex:1">Save</button></div>`}
    <p class="sample">${E(LT.LABELS.google)}</p></div>`, o.section || 'brass');
};
SH.task = S => { const f = S.sheet; return sheet('New task', `<div class="sh-b" data-sheet-body><input type="text" id="tasktitle" data-in="title" placeholder="What needs doing?" value="${E(f.title)}" aria-label="Task">
  <div class="grp"><h4>Section</h4><div class="picks"><button class="pk ${!f.section ? 'on' : ''}" data-a="tsec" data-v="">None</button>${LT.SECTIONS.map(s => `<button class="pk ${f.section === s.id ? 'on' : ''}" data-a="tsec" data-v="${s.id}" style="${cv(s.id)}">${s.name}</button>`).join('')}</div></div>
  <div class="grp"><h4>Priority</h4><div class="picks">${['high', 'medium', 'low'].map(p => `<button class="pk ${f.priority === p ? 'on' : ''}" data-a="tpri" data-v="${p}">${p}</button>`).join('')}</div></div>
  <div class="grp"><h4>Due</h4><div class="picks">${[['', 'No date'], [T, 'Today'], [D.addDays(T, 1), 'Tomorrow'], [D.addDays(T, 7), 'Next week']].map(([d, l]) => `<button class="pk ${f.due === d ? 'on' : ''}" data-a="tdue" data-v="${d}">${l}</button>`).join('')}</div></div></div>
  <div class="sh-f"><button class="btn" data-a="close">Cancel</button><button class="btn brass block" data-a="tsave">Add task</button></div>`); };
SH.addev = S => { const f = S.sheet; return sheet('Add event', `<div class="sh-b" data-sheet-body><input type="text" id="evtitle" data-in="title" placeholder="Title" value="${E(f.title)}" aria-label="Event title"><div class="picks">${LT.SECTIONS.map(s => `<button class="pk ${f.section === s.id ? 'on' : ''}" data-a="aesec" data-v="${s.id}" style="${cv(s.id)}">${s.name}</button>`).join('')}</div><div class="kv"><span>Date</span>${stepper('aed', F.date(f.date), 'date')}</div><div class="kv"><span>Start</span>${stepper('aet', f.start, 'start time')}</div></div><div class="sh-f"><button class="btn" data-a="close">Cancel</button><button class="btn brass block" data-a="aesave">Add</button></div>`); };

/* ---------- reward ---------- */
function reward(r) {
  const O = LT.overall();
  const evo = r.evolved ? `<div class="const">${stag(r.evolved.to, { still: true, drawAll: true, newStage: r.evolved.to, id: 'rw' })}</div><p class="msg">The ${STAGE[r.evolved.from].toLowerCase()} becomes the ${STAGE[r.evolved.to].toLowerCase()}</p><span class="lvup">Level ${r.overallUp.to}</span><p class="note">New stars, earned over months of steady work.</p>` : '';
  return `<div class="reward" data-reward role="dialog" aria-modal="true" aria-label="Reward"><div class="card">
    ${r.rest ? `<div class="const" style="width:150px">${stag(O.stage, { still: true, id: 'rr' })}</div><p class="msg">A quiet night off</p><p class="note">Rest day recorded. Your streak continues at ${r.streak} days.</p>` : `
    ${evo || `<div class="const" style="width:140px">${stag(O.stage, { still: true, id: 'rw2' })}</div>`}
    ${r.preview ? '<span class="tagx" style="border-color:var(--brass);color:var(--brass)">Preview only</span>' : `<div class="xp">+${r.total} XP</div><ul>${r.lines.map(l => `<li><span>${E(l.reason)}</span><b>+${l.xp}</b></li>`).join('')}</ul>`}`}
    ${r.sectionUps.map(u => `<span class="lvup">${E(u.name)} · Level ${u.to}</span>`).join('')}
    ${r.overallUp && !r.evolved ? `<span class="lvup">Level ${r.overallUp.to}</span>` : ''}
    ${(r.unlocked || []).map(a => `<p class="msg" style="font-size:16px">★ A star is named: ${E(a.title)}</p><p class="note">${E(a.desc)}</p>`).join('')}
    ${r.pain ? '<p class="note warn" style="text-align:left">You noted pain. Consider resting or easing the next session, and talk to a coach or physio if it continues.</p>' : ''}
    ${r.streakUp ? `<p class="note">${r.streak} day streak</p>` : ''}
    <button class="btn brass block" data-a="rclose">Continue</button></div></div>`;
}

const shell = Shell({
  key: 'observatory', views: V, sheets: SH, reward,
  restBar: (left, S) => `<div class="restbar" role="status"><span class="grow">Rest</span><b>${S.clock(left)}</b><button data-a="rest30">+30s</button><button data-a="restskip">Skip</button></div>`,
  pokeLines: () => { const O = LT.overall(), st = LT.streak(); return [`${st.n} days in a row. Rest days count.`, `${O.toNext} XP until level ${O.level + 1}.`, `${LT.violin.weekTotal()} of ${LT.state.violin.target} violin minutes this week.`, 'Lower A at 10:00. Clear skies after.']; },
  actions: {
    orb: (v, el) => { const app = document.getElementById('app'), a = app.getBoundingClientRect(), r = el.getBoundingClientRect(); app.style.setProperty('--ox', (r.left + r.width / 2 - a.left) + 'px'); app.style.setProperty('--oy', (r.top + r.height / 2 - a.top) + 'px'); shell.go(v); },
  },
});
})();
</script>
