<title>LifeTracker Instrument</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a lab instrument. Two rails of hardware keys flank the drone; a command bar at the bottom logs anything.
   Sections are channels (CH01–CH08) with readout panels; the calendar is a week Gantt. Light and dark themes. */
:root {
  --bg: #EEF0EE; --panel: #FAFBFA; --panel-2: #E4E7E4; --ink: #121417; --ink-2: #4B525A; --ink-3: #858C93; --line: #D3D7D3; --grid: #E2E5E2;
  --sig: #FF5A1F; --sig-ink: #FFFFFF; --ok: #1F9D6A; --warn: #E0451B; --led-off: #C9CDC9;
  --violin: #E0791F; --coding: #2B5BF0; --sports: #13A06B; --gym: #E2392E; --study: #7B4DE0; --chess: #5E6670; --sleep: #3A48B8; --screen: #D93E8C;
  --label: "Chakra Petch", "Eurostile", "Bank Gothic", ui-sans-serif, sans-serif;
  --body: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --shadow: 0 1px 0 rgba(255,255,255,.8) inset, 0 1px 2px rgba(0,0,0,.08), 0 3px 0 rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1012; --panel: #16191C; --panel-2: #1F2327; --ink: #E9ECEE; --ink-2: #A3AAB1; --ink-3: #6E767E; --line: #2A2F34; --grid: #1C2024;
  --sig: #FF6A33; --sig-ink: #160A04; --ok: #3DD196; --warn: #FF7A52; --led-off: #33383D;
  --violin: #FF9B45; --coding: #6F92FF; --sports: #3DD196; --gym: #FF6B60; --study: #A88BFF; --chess: #9BA4AE; --sleep: #7E8BFF; --screen: #FF7AB8;
  --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 2px 0 rgba(0,0,0,.4); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1012; --panel: #16191C; --panel-2: #1F2327; --ink: #E9ECEE; --ink-2: #A3AAB1; --ink-3: #6E767E; --line: #2A2F34; --grid: #1C2024;
  --sig: #FF6A33; --sig-ink: #160A04; --ok: #3DD196; --warn: #FF7A52; --led-off: #33383D;
  --violin: #FF9B45; --coding: #6F92FF; --sports: #3DD196; --gym: #FF6B60; --study: #A88BFF; --chess: #9BA4AE; --sleep: #7E8BFF; --screen: #FF7AB8;
  --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 2px 0 rgba(0,0,0,.4); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15.5px/1.45 var(--body); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  background-image: radial-gradient(var(--line) .9px, transparent 1px); background-size: 16px 16px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
:focus-visible { outline: 2px solid var(--sig); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.lab { font-family: var(--label); font-weight: 600; font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.dim { color: var(--ink-3); } .mid { color: var(--ink-2); } .small { font-size: 13.5px; }

.app { max-width: 560px; margin: 0 auto; min-height: 100%; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); padding-block: 10px calc(96px + env(safe-area-inset-bottom, 0px)); }
.view { animation: wipe .2s linear; }
@keyframes wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

/* status bar */
.status { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 36px; font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.status b { color: var(--ink); font-weight: 500; }
.led { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--led-off); }
.led.on { background: var(--c, var(--sig)); box-shadow: 0 0 6px var(--c, var(--sig)); }

/* console */
.console { display: grid; grid-template-columns: 84px minmax(0, 1fr) 84px; gap: 10px; align-items: stretch; margin-top: 6px; }
.rail { display: grid; gap: 8px; align-content: stretch; }
.key { background: var(--panel); border-radius: 10px; box-shadow: var(--shadow), 0 0 0 1px var(--line); padding: 8px 8px 7px; display: grid; gap: 3px; text-align: left; min-height: 76px; align-content: space-between; position: relative; transition: transform .08s; }
.key:active { transform: translateY(2px); }
.key .ch { font-family: var(--mono); font-size: 10px; color: var(--ink-3); display: flex; justify-content: space-between; align-items: center; }
.key b { font-family: var(--label); font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; line-height: 1.05; }
.key .lv { font-family: var(--mono); font-size: 11px; color: var(--ink-2); }
.key .bar { height: 3px; background: var(--panel-2); border-radius: 2px; overflow: hidden; }
.key .bar i { display: block; height: 100%; background: var(--c); }
.rail.right .key { text-align: right; }
.rail.right .key .ch { flex-direction: row-reverse; }
.scope { background: var(--panel); border-radius: 14px; box-shadow: var(--shadow), 0 0 0 1px var(--line); position: relative; overflow: hidden; display: grid; justify-items: center; align-content: center; padding: 10px 6px; min-height: 330px;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 20px 20px; background-position: center; }
.scope .drone { width: 100%; max-width: 190px; }
.scope .drone svg { width: 100%; height: auto; overflow: visible; }
.hover { animation: hover 3s ease-in-out infinite; }
@keyframes hover { 50% { transform: translateY(-4px); } }
.spin { animation: spin 1.2s linear infinite; transform-box: fill-box; transform-origin: center; }
@keyframes spin { to { transform: rotate(360deg); } }
.blink { animation: blink 4s infinite; transform-box: fill-box; transform-origin: center; }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
.scope .name { font-family: var(--label); font-weight: 600; letter-spacing: .14em; font-size: 11px; color: var(--ink-3); text-transform: uppercase; }
.scope .lvl { font-family: var(--label); font-weight: 700; font-size: 30px; letter-spacing: .02em; line-height: 1; }
.seg { display: grid; grid-template-columns: repeat(20, 1fr); gap: 2px; width: 90%; margin-top: 6px; }
.seg i { height: 8px; background: var(--panel-2); border-radius: 1px; }
.seg i.on { background: var(--sig); }
.scope .xp { font-family: var(--mono); font-size: 11px; color: var(--ink-2); margin-top: 4px; }
.readout-tip { position: absolute; left: 8px; right: 8px; top: 8px; background: var(--ink); color: var(--bg); font-family: var(--mono); font-size: 12px; padding: 6px 8px; border-radius: 6px; animation: wipe .18s linear; z-index: 3; }
.today { margin-top: 12px; background: var(--panel); border-radius: 14px; box-shadow: var(--shadow), 0 0 0 1px var(--line); padding: 12px 14px; }
.today-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.today-h button { font-family: var(--label); font-size: 11.5px; letter-spacing: .08em; color: var(--sig); min-height: 32px; text-transform: uppercase; }
.trow { display: grid; grid-template-columns: 62px 8px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 38px; border-top: 1px solid var(--line); font-size: 14.5px; }
.trow:first-of-type { border-top: 0; }
.trow .t { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.trow .x { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ck { width: 32px; height: 32px; border-radius: 8px; box-shadow: inset 0 0 0 1.5px var(--line); display: grid; place-items: center; }
.ck::after { content: ""; width: 12px; height: 12px; border-radius: 3px; background: transparent; }
.ck.on::after { background: var(--sig); box-shadow: 0 0 6px var(--sig); }

/* command bar */
.cmd { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 8px max(12px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-right, 0px)); background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); }
.cmd .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: 58px minmax(0, 1fr) 58px 58px; gap: 8px; }
.cmd button { min-height: 52px; border-radius: 12px; background: var(--panel); box-shadow: var(--shadow), 0 0 0 1px var(--line); font-family: var(--label); font-weight: 600; font-size: 11px; letter-spacing: .08em; display: grid; place-items: center; text-transform: uppercase; color: var(--ink-2); }
.cmd button.on { color: var(--sig); box-shadow: var(--shadow), 0 0 0 1.5px var(--sig); }
.cmd .prompt { background: var(--ink); color: var(--bg); justify-items: start; padding: 0 14px; font-family: var(--mono); font-size: 14px; letter-spacing: 0; text-transform: none; display: flex; align-items: center; gap: 8px; }
.cmd .prompt span { color: var(--sig); }
.cmd .prompt i { width: 8px; height: 16px; background: var(--sig); animation: caret 1s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }

/* channel pages */
.chbar { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin: 0 0 12px; padding: 2px; }
.chbar::-webkit-scrollbar { display: none; }
.chbar button { flex: none; min-width: 56px; min-height: 44px; border-radius: 8px; background: var(--panel); box-shadow: 0 0 0 1px var(--line); display: grid; justify-items: center; align-content: center; gap: 1px; font-family: var(--mono); font-size: 10px; color: var(--ink-3); }
.chbar button b { font-family: var(--label); font-size: 11px; letter-spacing: .06em; color: var(--ink-2); text-transform: uppercase; }
.chbar button.on { background: var(--c, var(--ink)); color: #fff; box-shadow: none; }
.chbar button.on b { color: #fff; }
.chhead { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: end; margin-bottom: 12px; }
.chhead .k { font-family: var(--mono); font-size: 12px; color: var(--c); }
.chhead h1 { font-family: var(--label); font-weight: 700; font-size: 32px; letter-spacing: .02em; text-transform: uppercase; line-height: 1; }
.chhead .lvbox { text-align: right; font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.chhead .lvbox b { display: block; font-family: var(--label); font-size: 24px; color: var(--ink); }
.chhead .seg { grid-column: 1 / -1; width: 100%; }
.chhead .seg i.on { background: var(--c); }
.pnl { background: var(--panel); border-radius: 14px; box-shadow: var(--shadow), 0 0 0 1px var(--line); padding: 14px; }
.pnl-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 22px 2px 8px; }
.pnl-h h2 { font-family: var(--label); font-weight: 700; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; display: flex; gap: 8px; align-items: center; }
.pnl-h h2::before { content: ""; width: 4px; height: 14px; background: var(--c, var(--sig)); }
.pnl-h .aside { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
.pnl-h button { font-family: var(--label); font-size: 11.5px; letter-spacing: .08em; color: var(--sig); min-height: 36px; text-transform: uppercase; }
.meters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.meter { background: var(--panel); border-radius: 12px; box-shadow: 0 0 0 1px var(--line); padding: 10px 12px; display: grid; gap: 2px; }
.meter .v { font-family: var(--mono); font-size: 22px; letter-spacing: -.02em; }
.meter .l { font-family: var(--label); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); line-height: 1.3; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { font-family: var(--label); font-weight: 600; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 9px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl td.n { font-family: var(--mono); text-align: right; white-space: nowrap; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl small { display: block; color: var(--ink-3); font-size: 12.5px; }
.tbl tr.fresh td { animation: flash 1.4s ease; }
@keyframes flash { from { background: color-mix(in srgb, var(--sig) 18%, transparent); } }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 16px; border-radius: 12px; background: var(--panel); box-shadow: var(--shadow), 0 0 0 1px var(--line); font-family: var(--label); font-weight: 700; font-size: 13.5px; letter-spacing: .08em; text-transform: uppercase; }
.btn.sig { background: var(--sig); color: var(--sig-ink); box-shadow: 0 3px 0 color-mix(in srgb, var(--sig) 60%, #000); }
.btn.sig:active { transform: translateY(2px); box-shadow: 0 1px 0 color-mix(in srgb, var(--sig) 60%, #000); }
.btn.block { width: 100%; }
.btn.sm { min-height: 38px; font-size: 11.5px; padding: 0 12px; border-radius: 9px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.sample { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); display: inline-flex; gap: 6px; align-items: baseline; line-height: 1.4; }
.sample::before { content: "[sim]"; color: var(--sig); }
.chip-row { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: none; }
.chip-row::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 36px; padding: 0 12px; border-radius: 8px; box-shadow: 0 0 0 1px var(--line); background: var(--panel); font-family: var(--label); font-weight: 600; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.chip.on { background: var(--ink); color: var(--bg); box-shadow: none; }
.chip .led { width: 7px; height: 7px; background: var(--c); }
.tagm { font-family: var(--mono); font-size: 11px; padding: 2px 7px; border-radius: 5px; box-shadow: inset 0 0 0 1px var(--line); white-space: nowrap; color: var(--ink-2); }
.tagm.c { box-shadow: inset 0 0 0 1px var(--c); color: var(--c); }
.tagm.warn { box-shadow: inset 0 0 0 1px var(--warn); color: var(--warn); }
.tagm.ok { box-shadow: inset 0 0 0 1px var(--ok); color: var(--ok); }

/* charts (scope style) */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.ch-grid { stroke: var(--grid); stroke-width: 1; }
.ch-axis, .ch-lbl { fill: var(--ink-3); font: 10px var(--mono); }
.ch-lbl.is-hi { fill: var(--ink); }
.ch-bar { fill: color-mix(in srgb, var(--c, var(--sig)) 30%, var(--panel)); }
.ch-bar.is-met { fill: color-mix(in srgb, var(--c, var(--sig)) 65%, var(--panel)); }
.ch-bar.is-hi { fill: var(--c, var(--sig)); }
.ch-target { stroke: var(--sig); stroke-dasharray: 2 3; stroke-width: 1.2; }
.ch-target-lbl { fill: var(--sig); font: 10px var(--mono); }
.ch-line { fill: none; stroke: var(--c, var(--sig)); stroke-width: 2; }
.ch-area { fill: color-mix(in srgb, var(--c, var(--sig)) 10%, transparent); }
.ch-dot { fill: var(--panel); stroke: var(--c, var(--sig)); stroke-width: 1.5; }
.ch-dot.is-end { fill: var(--c, var(--sig)); }
.matrix { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 3px; }
.matrix i { aspect-ratio: 1; border-radius: 3px; background: var(--panel-2); }
.matrix i.l1 { background: color-mix(in srgb, var(--c) 35%, var(--panel-2)); }
.matrix i.l2 { background: color-mix(in srgb, var(--c) 70%, var(--panel-2)); }
.matrix i.l3 { background: var(--c); box-shadow: 0 0 5px color-mix(in srgb, var(--c) 60%, transparent); }
.matrix i.now { outline: 1.5px solid var(--ink); outline-offset: 1px; }

/* gym */
.ex { padding: 12px 0; border-bottom: 1px solid var(--line); }
.ex:last-child { border-bottom: 0; }
.ex-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
.ex-h b { font-family: var(--label); font-weight: 700; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; }
.setrow { display: grid; grid-template-columns: 26px 1fr 1fr 48px; gap: 6px; align-items: center; min-height: 50px; }
.setrow .n { font-family: var(--mono); font-size: 12px; color: var(--ink-3); }
.adj { display: flex; align-items: center; justify-content: space-between; height: 44px; border-radius: 9px; box-shadow: inset 0 0 0 1px var(--line); }
.adj button { width: 34px; height: 42px; font-size: 18px; color: var(--ink-2); }
.adj output { font-family: var(--mono); font-size: 14px; flex: 1; text-align: center; }
.adj output small { font-size: 10px; color: var(--ink-3); }
.ledbtn { width: 48px; height: 44px; border-radius: 9px; background: var(--panel); box-shadow: var(--shadow), 0 0 0 1px var(--line); display: grid; place-items: center; }
.ledbtn i { width: 14px; height: 14px; border-radius: 50%; background: var(--led-off); }
.ledbtn.on i { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.setrow.done .adj { opacity: .5; }
.wk { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.wk > div { background: var(--panel); border-radius: 9px; box-shadow: 0 0 0 1px var(--line); min-height: 76px; padding: 5px 2px; display: grid; align-content: start; justify-items: center; gap: 3px; font-family: var(--mono); font-size: 10px; text-align: center; }
.wk b { font-family: var(--label); font-size: 15px; }
.wk .g { background: color-mix(in srgb, var(--gym) 16%, transparent); color: var(--gym); border-radius: 4px; padding: 1px 3px; line-height: 1.15; }
.wk .g.done { background: var(--gym); color: #fff; }
.wk .s { color: var(--sports); line-height: 1.15; }
.wk .now { box-shadow: 0 0 0 1.5px var(--sig); }
.restbar { position: fixed; z-index: 25; left: max(14px, env(safe-area-inset-left, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); max-width: 532px; margin: 0 auto; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 8px 8px 8px 14px; display: grid; grid-template-columns: auto 1fr auto auto; gap: 10px; align-items: center; }
.restbar b { font-family: var(--mono); font-size: 20px; font-weight: 500; color: var(--sig); }
.restbar .tr { height: 4px; background: color-mix(in srgb, var(--bg) 20%, transparent); border-radius: 2px; overflow: hidden; }
.restbar .tr i { display: block; height: 100%; background: var(--sig); }
.restbar button { min-height: 38px; padding: 0 10px; border-radius: 8px; background: color-mix(in srgb, var(--bg) 14%, transparent); font-family: var(--label); font-size: 11px; letter-spacing: .06em; color: var(--bg); text-transform: uppercase; }

/* sleep */
.nightpanel { background: #0C1030; color: #E6E9FF; border-radius: 14px; padding: 14px; display: grid; gap: 12px; position: relative; overflow: hidden; background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px); background-size: 20px 20px; }
.nightpanel .lab, .nightpanel .dim { color: #9AA3D8; }
.nightpanel .btn { background: rgba(255,255,255,.08); color: #E6E9FF; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
.nightpanel .btn.sig { background: #E6E9FF; color: #0C1030; box-shadow: none; }
.nightpanel .sample { color: #9AA3D8; }
.tpick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tpick > div { border-radius: 10px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.16); padding: 10px; display: grid; justify-items: center; gap: 6px; }
.tpick .tv { font-family: var(--mono); font-size: 34px; letter-spacing: -.03em; }
.tpick .r { display: flex; gap: 6px; }
.tpick button, .nbtn { min-width: 46px; min-height: 40px; border-radius: 8px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); font-family: var(--mono); font-size: 12.5px; color: #E6E9FF; }
.gantt-n text { font-family: var(--mono); font-size: 9.5px; fill: var(--ink-3); }
.gantt-n .d { fill: var(--ink); font-size: 10.5px; }
.sw { width: 46px; height: 26px; border-radius: 6px; box-shadow: inset 0 0 0 1.5px var(--line); position: relative; flex: none; }
.sw::after { content: ""; position: absolute; top: 4px; left: 4px; width: 18px; height: 18px; border-radius: 4px; background: var(--led-off); transition: transform .15s; }
.sw.on::after { transform: translateX(20px); background: var(--sig); box-shadow: 0 0 6px var(--sig); }

/* road */
.road { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; align-items: end; }
.road > div { display: grid; gap: 4px; justify-items: center; text-align: center; }
.road .bar { width: 100%; border-radius: 4px; background: var(--panel-2); }
.road .done .bar { background: var(--coding); }
.road .current .bar { background: repeating-linear-gradient(135deg, var(--sig) 0 4px, color-mix(in srgb, var(--sig) 40%, transparent) 4px 8px); }
.road .goal .bar { background: transparent; box-shadow: inset 0 0 0 1.5px var(--sig); }
.road span { font-family: var(--mono); font-size: 9.5px; color: var(--ink-2); line-height: 1.2; min-height: 34px; }

/* calendar gantt */
.gantt { background: var(--panel); border-radius: 14px; box-shadow: 0 0 0 1px var(--line); overflow: hidden; }
.g-axis { display: grid; grid-template-columns: 54px 1fr; border-bottom: 1px solid var(--line); }
.g-axis .hrs { position: relative; height: 22px; }
.g-axis .hrs span { position: absolute; top: 4px; transform: translateX(-50%); font-family: var(--mono); font-size: 9.5px; color: var(--ink-3); }
.g-row { display: grid; grid-template-columns: 54px 1fr; border-bottom: 1px solid var(--line); min-height: 58px; }
.g-row:last-child { border-bottom: 0; }
.g-row .dl { padding: 6px 6px; font-family: var(--mono); font-size: 11px; color: var(--ink-2); border-right: 1px solid var(--line); display: grid; align-content: start; }
.g-row .dl b { font-family: var(--label); font-size: 16px; color: var(--ink); }
.g-row.today .dl { background: color-mix(in srgb, var(--sig) 10%, transparent); }
.g-row.today .dl b { color: var(--sig); }
.g-row.sel { box-shadow: inset 3px 0 0 var(--sig); }
.g-track { position: relative; background-image: linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: calc(100% / 8) 100%; }
.gb { position: absolute; height: 18px; border-radius: 4px; background: var(--c); opacity: .9; }
.gb.planned { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); background-image: repeating-linear-gradient(135deg, color-mix(in srgb, var(--c) 25%, transparent) 0 3px, transparent 3px 6px); }
.gb.clash { box-shadow: 0 0 0 1.5px var(--warn), inset 0 0 0 1.5px var(--c); }
.gb.cancelled { opacity: .3; }
.gtick { position: absolute; bottom: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.agenda .ar { display: grid; grid-template-columns: 52px 4px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 52px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
.agenda .ar:last-child { border-bottom: 0; }
.agenda .tm { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.agenda .st { align-self: stretch; margin: 8px 0; border-radius: 2px; background: var(--c); }
.agenda .ar.planned .st { background: repeating-linear-gradient(var(--c) 0 3px, transparent 3px 6px); }
.agenda .ti small { display: block; font-size: 12px; color: var(--ink-3); font-family: var(--mono); }
.agenda .ar.cancelled .ti { text-decoration: line-through; color: var(--ink-3); }
.warnbox { border-radius: 12px; box-shadow: inset 0 0 0 1.5px var(--warn); background: color-mix(in srgb, var(--warn) 8%, transparent); padding: 10px 12px; font-size: 14px; margin: 8px 0 10px; display: grid; grid-template-columns: auto 1fr; gap: 10px; }
.warnbox b { font-family: var(--mono); color: var(--warn); font-weight: 500; }

/* tasks table */
.tk { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 6px; align-items: center; min-height: 54px; border-bottom: 1px solid var(--line); }
.tk:last-child { border-bottom: 0; }
.tk.done .tt { text-decoration: line-through; color: var(--ink-3); }
.tk small { display: block; font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
.tk .p { font-family: var(--mono); font-size: 11px; }
.tk .p.high { color: var(--warn); }

/* progress */
.stg { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.stg > div { background: var(--panel); border-radius: 10px; box-shadow: 0 0 0 1px var(--line); padding: 6px 4px; display: grid; justify-items: center; text-align: center; gap: 2px; }
.stg svg { width: 100%; height: auto; }
.stg .future svg { opacity: .25; filter: grayscale(1); }
.stg b { font-family: var(--label); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.stg small { font-family: var(--mono); font-size: 9.5px; color: var(--ink-3); line-height: 1.2; }
.stg .cur { box-shadow: 0 0 0 1.5px var(--sig); }
.lvrow { display: grid; grid-template-columns: 48px minmax(0, 1fr) 54px; gap: 10px; align-items: center; min-height: 50px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
.lvrow:last-child { border-bottom: 0; }
.lvrow .c { font-family: var(--mono); font-size: 11px; color: var(--c); }
.lvrow .seg { width: 100%; grid-template-columns: repeat(20, 1fr); margin-top: 4px; }
.lvrow .seg i { height: 5px; }
.lvrow .seg i.on { background: var(--c); }
.lvrow .v { font-family: var(--mono); text-align: right; font-size: 13px; }
.achs .ar2 { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 48px; border-bottom: 1px solid var(--line); }
.achs .ar2:last-child { border-bottom: 0; }
.achs small { display: block; color: var(--ink-3); font-size: 12.5px; }

/* palette / sheets */
.scrim { position: fixed; inset: 0; z-index: 40; background: color-mix(in srgb, var(--ink) 35%, transparent); animation: fd .15s ease; }
@keyframes fd { from { opacity: 0; } }
.sheet { position: fixed; z-index: 41; left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); max-width: 560px; margin: 0 auto; max-height: calc(100% - 30px); display: flex; flex-direction: column; background: var(--panel); border-radius: 18px; box-shadow: 0 0 0 1px var(--line), 0 24px 60px rgba(0,0,0,.3); animation: up .2s cubic-bezier(.2,.8,.2,1); }
@keyframes up { from { transform: translateY(24px); opacity: 0; } }
.sh-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 10px 4px 16px; }
.sh-h h2 { font-family: var(--label); font-weight: 700; font-size: 17px; letter-spacing: .06em; text-transform: uppercase; }
.sh-x { width: 44px; height: 44px; border-radius: 10px; font-family: var(--mono); font-size: 13px; color: var(--ink-2); }
.sh-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px 16px 8px; }
.sh-steps div { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); border-top: 3px solid var(--line); padding-top: 4px; }
.sh-steps div.on { border-color: var(--c, var(--sig)); color: var(--ink); }
.sh-b { overflow-y: auto; padding: 4px 16px 14px; display: grid; gap: 12px; align-content: start; }
.sh-f { display: flex; gap: 8px; padding: 10px 16px 14px; border-top: 1px solid var(--line); }
.palette-in { display: flex; align-items: center; gap: 8px; border-radius: 10px; background: var(--ink); color: var(--bg); padding: 0 12px; min-height: 48px; font-family: var(--mono); }
.palette-in span { color: var(--sig); }
.palette-in input[type=text] { flex: 1; border: 0; box-shadow: none; border-radius: 0; background: transparent; color: var(--bg); min-height: 46px; font-family: var(--mono); font-size: 16px; padding: 0; }
.palette-in input::placeholder { color: color-mix(in srgb, var(--bg) 50%, transparent); }
.cmdlist button { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; min-height: 50px; border-bottom: 1px solid var(--line); text-align: left; }
.cmdlist button:last-child { border-bottom: 0; }
.cmdlist .code { font-family: var(--mono); font-size: 11px; color: var(--c); }
.cmdlist small { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opt { min-height: 76px; border-radius: 12px; background: var(--panel); box-shadow: var(--shadow), 0 0 0 1px var(--line); padding: 10px 12px; display: grid; align-content: space-between; text-align: left; }
.opt b { font-family: var(--label); font-weight: 700; font-size: 14.5px; letter-spacing: .04em; text-transform: uppercase; }
.opt small { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.opt.on { box-shadow: 0 0 0 2px var(--c, var(--sig)); }
.dial { display: grid; grid-template-columns: 54px 1fr 54px; gap: 8px; align-items: center; }
.dial output { text-align: center; font-family: var(--mono); font-size: 56px; letter-spacing: -.05em; line-height: 1; }
.dial output small { display: block; font-family: var(--label); font-size: 10.5px; letter-spacing: .14em; color: var(--ink-3); text-transform: uppercase; margin-top: 4px; }
.sq { width: 54px; height: 54px; border-radius: 12px; background: var(--panel); box-shadow: var(--shadow), 0 0 0 1px var(--line); font-family: var(--mono); font-size: 14px; }
.picks { display: flex; flex-wrap: wrap; gap: 6px; }
.pk { min-height: 40px; padding: 6px 11px; border-radius: 9px; box-shadow: inset 0 0 0 1px var(--line); font-size: 14px; text-align: left; }
.pk.on { box-shadow: inset 0 0 0 2px var(--c, var(--sig)); background: color-mix(in srgb, var(--c, var(--sig)) 10%, transparent); }
.grp .lab { display: block; margin-bottom: 6px; }
.tg { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 46px; width: 100%; text-align: left; }
.kv { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 50px; border-bottom: 1px solid var(--line); }
.stepper { display: inline-flex; align-items: center; border-radius: 9px; box-shadow: inset 0 0 0 1px var(--line); }
.stepper button { width: 40px; height: 40px; font-size: 17px; color: var(--ink-2); }
.stepper output { min-width: 74px; text-align: center; font-family: var(--mono); font-size: 13px; }
input[type=text], textarea { width: 100%; min-height: 46px; border-radius: 10px; border: 0; box-shadow: inset 0 0 0 1px var(--line); background: var(--bg); padding: 10px 12px; font-size: 16px; }
textarea { min-height: 76px; resize: vertical; }
.n5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.n5 button { min-height: 46px; border-radius: 9px; box-shadow: inset 0 0 0 1px var(--line); font-family: var(--mono); }
.n5 button.on { background: var(--sig); color: var(--sig-ink); box-shadow: none; }
.nt { font-size: 13px; color: var(--ink-3); }
.nt.warn { color: var(--warn); }

/* reward */
.reward { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 20px max(16px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); animation: fd .15s ease; }
.reward .box { width: min(360px, 100%); background: var(--panel); border-radius: 18px; box-shadow: 0 0 0 1px var(--line), 0 24px 60px rgba(0,0,0,.25); padding: 18px; display: grid; gap: 10px; text-align: center; animation: up .22s ease; }
.reward .xp { font-family: var(--mono); font-size: 46px; letter-spacing: -.04em; color: var(--sig); line-height: 1; }
.reward .xp small { font-family: var(--label); font-size: 14px; letter-spacing: .14em; }
.reward ul { list-style: none; padding: 0; margin: 0; text-align: left; }
.reward li { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; border-top: 1px solid var(--line); padding: 6px 0; }
.reward li b { font-family: var(--mono); font-weight: 500; }
.reward .up { font-family: var(--label); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 13px; padding: 8px; border-radius: 8px; background: var(--ink); color: var(--bg); }
.reward .up em { font-style: normal; color: var(--sig); }
.upgrade { width: 170px; margin: 0 auto; position: relative; }
.upgrade svg { width: 100%; height: auto; overflow: visible; }
.upgrade .scan { position: absolute; left: -6%; right: -6%; height: 3px; background: var(--sig); box-shadow: 0 0 10px var(--sig); top: 0; animation: scan 1.4s ease-in-out 2; opacity: .9; }
@keyframes scan { 50% { top: 100%; } }
.upgrade .old { position: absolute; inset: 0; animation: fdout .8s ease 1.2s forwards; }
.upgrade .new { opacity: 0; animation: fdin .6s ease 1.4s forwards; }
@keyframes fdout { to { opacity: 0; } } @keyframes fdin { to { opacity: 1; } }
.toast { position: fixed; z-index: 70; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 9px; font-family: var(--mono); font-size: 13px; max-width: calc(100% - 32px); animation: up .15s ease; }
.foot { margin-top: 24px; display: grid; gap: 6px; }
.lnk { font-family: var(--label); font-size: 12px; letter-spacing: .08em; color: var(--sig); text-transform: uppercase; min-height: 40px; justify-self: start; }

@media (min-width: 900px) {
  .app { max-width: 1040px; }
  .homegrid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 20px; align-items: start; }
  .homegrid .today { margin-top: 6px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 22px; align-items: start; }
  .console { grid-template-columns: 110px minmax(0, 1fr) 110px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
  .upgrade .old { opacity: 0; } .upgrade .new { opacity: 1; } .upgrade .scan { display: none; }
}

<div class="app" id="app"></div>
<div id="layer"></div>
<nav class="cmd" id="nav" aria-label="Commands"></nav>

<script src="core.js"></script>
<script src="shell.js"></script>
<script>
(() => {
'use strict';
const E = LT.esc, F = LT.fmt, D = LT.date, T = LT.TODAY;
const cv = id => `--c: var(--${id || 'sig'})`;
const CODE = id => 'CH' + String(LT.SECTIONS.findIndex(s => s.id === id) + 1).padStart(2, '0');
const short = id => ({ screen: 'Screen', coding: 'Coding' })[id] || LT.section(id).name;

/* ---------- drone ---------- */
const STAGE = ['Core', 'Ring', 'Rotor', 'Array', 'Halo'];
function drone(stage, o = {}) {
  const still = o.still;
  const ring = stage >= 1 ? `<ellipse cx="100" cy="104" rx="62" ry="16" fill="none" stroke="var(--ink)" stroke-width="3"/><ellipse cx="100" cy="104" rx="62" ry="16" fill="none" stroke="var(--sig)" stroke-width="3" stroke-dasharray="14 180" ${still ? '' : 'class="spin"'} style="transform-origin:100px 104px"/>` : '';
  const arms = stage >= 2 ? [[-1, 34], [1, 166]].map(([s, x]) => `<path d="M${100 + s * 34} 96 L${x} 78" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/><g transform="translate(${x} 74)"><ellipse rx="22" ry="4" fill="var(--ink-3)" opacity=".5" ${still ? '' : 'class="spin"'} /><circle r="5" fill="var(--ink)"/></g>`).join('') : '';
  const antenna = stage >= 3 ? `<path d="M100 58 L100 34" stroke="var(--ink)" stroke-width="3"/><circle cx="100" cy="30" r="5" fill="var(--sig)"/><rect x="58" y="118" width="18" height="30" rx="3" fill="var(--panel-2)" stroke="var(--ink)" stroke-width="2.5"/><rect x="124" y="118" width="18" height="30" rx="3" fill="var(--panel-2)" stroke="var(--ink)" stroke-width="2.5"/><path d="M61 126 h12 M61 134 h12 M61 142 h12 M127 126 h12 M127 134 h12 M127 142 h12" stroke="var(--coding)" stroke-width="2"/>` : '';
  const halo = stage >= 4 ? `<circle cx="100" cy="100" r="86" fill="none" stroke="var(--sig)" stroke-width="1.5" stroke-dasharray="3 6" ${still ? '' : 'class="spin"'} style="transform-origin:100px 100px;animation-duration:12s"/><path d="M100 22 l4 8 9 1 -7 6 2 9 -8 -5 -8 5 2 -9 -7 -6 9 -1z" fill="var(--sig)"/>` : '';
  const r = [30, 34, 36, 38, 40][stage];
  const body = `<circle cx="100" cy="96" r="${r}" fill="var(--panel)" stroke="var(--ink)" stroke-width="3.5"/><path d="M${100 - r * .7} ${96 - r * .45} A${r} ${r} 0 0 1 ${100 + r * .7} ${96 - r * .45}" fill="none" stroke="var(--ink-3)" stroke-width="2" opacity=".5"/>
    <rect x="${100 - r * .62}" y="86" width="${r * 1.24}" height="20" rx="10" fill="var(--ink)"/>
    <g ${still ? '' : 'class="blink"'}><rect x="${o.happy ? 84 : 86}" y="${o.happy ? 92 : 91}" width="${o.happy ? 32 : 28}" height="${o.happy ? 6 : 10}" rx="${o.happy ? 3 : 5}" fill="var(--sig)"/></g>`;
  const shadow = `<ellipse cx="100" cy="182" rx="${30 + stage * 4}" ry="5" fill="var(--ink)" opacity=".12"/>`;
  return `<svg viewBox="0 0 200 200" role="img" aria-label="${STAGE[stage]} drone, your character">${halo}${shadow}<g class="${still ? '' : 'hover'}">${arms}${antenna}${ring}${body}</g></svg>`;
}

/* ---------- helpers ---------- */
const seg = (pct, n = 20) => `<span class="seg" aria-hidden="true">${Array.from({ length: n }, (_, i) => `<i class="${i < Math.round(pct * n) ? 'on' : ''}"></i>`).join('')}</span>`;
const stepper = (act, val, label, extra = '') => `<span class="stepper" role="group" aria-label="${label}"><button data-a="${act}" data-d="-1" ${extra} aria-label="Decrease ${label}">−</button><output>${val}</output><button data-a="${act}" data-d="1" ${extra} aria-label="Increase ${label}">+</button></span>`;
const ph = (t, aside = '') => `<div class="pnl-h"><h2>${t}</h2>${aside}</div>`;
function chbar(S) {
  return `<nav class="chbar" aria-label="Channels"><button data-a="home" style="--c:var(--ink)"><b>Home</b>00</button>${LT.SECTIONS.map(s => `<button class="${S.ui.view === s.id ? 'on' : ''}" style="${cv(s.id)}" data-a="go" data-v="${s.id}" ${S.ui.view === s.id ? 'aria-current="page"' : ''}><b>${short(s.id).slice(0, 6)}</b>${CODE(s.id)}</button>`).join('')}</nav>`;
}
function chhead(id, sub) {
  const s = LT.section(id), L = LT.level(id), st = LT.sectionStreak(id);
  return `<header class="chhead" style="${cv(id)}"><div><span class="k">${CODE(id)} · ${sub}</span><h1>${s.full}</h1>${st.n ? `<span class="mono small mid">${st.n} ${st.label}</span>` : ''}</div><div class="lvbox">LVL<b>${String(L.level).padStart(2, '0')}</b>${L.into}/${L.need} XP</div>${seg(L.pct)}</header>`;
}
function tk(t) {
  const s = LT.section(t.section);
  return `<div class="tk ${t.done ? 'done' : ''}" style="${cv(t.section)}"><button class="ck ${t.done ? 'on' : ''}" data-a="task" data-v="${t.id}" aria-label="${t.done ? 'Mark not done' : 'Complete'}: ${E(t.title)}" style="width:44px;height:44px"></button><div><span class="tt">${E(t.title)}</span><small>${s ? CODE(t.section) + ' ' + s.name.toUpperCase() : 'GENERAL'}${t.due ? ` · <span style="${LT.tasks.overdue(t) ? 'color:var(--warn)' : ''}">${F.rel(t.due).toUpperCase()}</span>` : ''}</small></div><span class="p ${t.priority}">${t.priority === 'high' ? 'P1' : t.priority === 'medium' ? 'P2' : 'P3'}</span></div>`;
}
const related = id => { const t = LT.tasks.list({ section: id, status: 'open' }); return t.length ? ph('Tasks', `<button data-a="go" data-v="tasks" data-sec="${id}">All →</button>`) + `<div class="pnl" style="padding:2px 12px">${t.map(tk).join('')}</div>` : ''; };

/* ---------- views ---------- */
const V = {};
V.home = S => {
  const O = LT.overall(), st = LT.streak(), td = LT.today(), ui = S.ui;
  const key = s => { const L = LT.level(s.id), k = LT.sectionStreak(s.id); return `<button class="key" style="${cv(s.id)}" data-a="open" data-v="${s.id}" aria-label="${s.full}, level ${L.level}"><span class="ch"><span>${CODE(s.id)}</span><span class="led ${k.n ? 'on' : ''}"></span></span><b>${short(s.id)}</b><span class="lv">LV ${String(L.level).padStart(2, '0')}${k.n ? ' · ' + k.n + (k.unit === 'wk' ? 'W' : k.unit === 'days' ? 'D' : 'N') : ''}</span><span class="bar"><i style="width:${(L.pct * 100).toFixed(0)}%"></i></span></button>`; };
  return `<div class="view">
  <div class="status"><span>${F.date(T).toUpperCase()} · <b>${LT.date.DAYS_LONG[D.dow(T)].toUpperCase()}</b></span><span><span class="led on"></span> STREAK <b>${String(st.n).padStart(3, '0')}</b></span></div>
  <div class="homegrid"><div>
  <div class="console">
    <div class="rail">${LT.SECTIONS.slice(0, 4).map(key).join('')}</div>
    <button class="scope" data-a="poke" aria-label="Ping your drone">
      ${ui.bubble ? `<span class="readout-tip">&gt; ${E(ui.bubble)}</span>` : ''}
      <span class="drone">${drone(O.stage)}</span>
      <span class="name">${STAGE[O.stage]} · form ${O.stage + 1}/5</span>
      <span class="lvl">LV ${O.level}</span>
      ${seg(O.pct)}
      <span class="xp">${F.num(O.into)}/${F.num(O.need)} XP · ${O.nextStage ? 'upgrade @ LV ' + O.nextStage.level : 'max form'}</span>
    </button>
    <div class="rail right">${LT.SECTIONS.slice(4).map(key).join('')}</div>
  </div>
  </div><div>
  <section class="today" aria-label="Today">

function nightGantt(nights) {
  const W = 330, rh = 22, top = 16, l = 42, r = 40, start = 21 * 60, span = 13 * 60, iw = W - l - r;
  const x = m => { const v = m < 720 ? m + 1440 : m; return l + (v - start) / span * iw; };
  let s = '';
  for (let h = 21; h <= 34; h++) { const xx = x((h % 24) * 60); s += `<line x1="${xx}" x2="${xx}" y1="12" y2="${top + nights.length * rh}" stroke="var(--grid)"/>`; if ((h - 21) % 3 === 0) s += `<text x="${xx}" y="9" text-anchor="middle">${String(h % 24).padStart(2, '0')}</text>`; }
  nights.forEach((n, i) => {
    const y = top + i * rh, tg = LT.sleep.targetFor(n.date), inW = Math.abs(LT.sleep.delta(n)) <= 30;
    s += `<rect x="${x(D.toMin(tg.bed))}" y="${y + 3}" width="${x(D.toMin(tg.wake)) - x(D.toMin(tg.bed))}" height="${rh - 6}" rx="3" fill="none" stroke="var(--ink-3)" stroke-dasharray="2 2"/>`;
    s += `<rect x="${x(D.toMin(n.bed))}" y="${y + 6}" width="${x(D.toMin(n.wake)) - x(D.toMin(n.bed))}" height="${rh - 12}" rx="2" fill="${n.fresh ? 'var(--sig)' : 'var(--sleep)'}" opacity="${inW ? 1 : .45}"><title>${F.date(n.date)} ${n.bed}–${n.wake}</title></rect>`;
    s += `<text class="d" x="0" y="${y + rh / 2 + 3.5}">${F.day(n.date).toUpperCase()} ${D.parse(n.date).getDate()}</text><text class="d" x="${W}" y="${y + rh / 2 + 3.5}" text-anchor="end">${F.hm(LT.sleep.duration(n)).replace(' ', '')}</text>`;
  });
  return `<svg class="gantt-n" viewBox="0 0 ${W} ${top + nights.length * rh + 2}" style="width:100%;height:auto;display:block" role="img" aria-label="Sleep timeline, last ${nights.length} nights">${s}</svg>`;
}

V.calendar = S => {
  const ui = S.ui, mon = D.addDays(D.weekStart(T), ui.calWeek * 7), days = [0, 1, 2, 3, 4, 5, 6].map(i => D.addDays(mon, i));
  const occ = LT.cal.occurrences(mon, days[6], { sections: ui.calFilter });
  const conf = LT.cal.conflicts(mon, days[6]);
  const H0 = 6, H1 = 22, pos = t => ((D.toMin(t) / 60 - H0) / (H1 - H0) * 100);
  if (!days.includes(ui.calSel)) ui.calSel = days.includes(T) ? T : mon;
  const selList = occ.filter(o => o.date === ui.calSel);
  return `<div class="view">
  <header class="chhead" style="--c:var(--sig)"><div><span class="k">SYS · shared calendar</span><h1>Calendar</h1></div><div class="lvbox">WEEK<b>${F.short(mon)}</b></div></header>
  <div class="chip-row"><button class="chip ${!ui.calFilter.length ? 'on' : ''}" data-a="calfclear">All</button>${LT.SECTIONS.map(s => `<button class="chip ${ui.calFilter.includes(s.id) ? 'on' : ''}" data-a="calf" data-v="${s.id}" style="${cv(s.id)}"><span class="led on"></span>${short(s.id)}</button>`).join('')}</div>
  <div style="display:flex;gap:6px;margin-bottom:8px"><button class="btn sm" data-a="calw" data-d="-1">← Prev</button><button class="btn sm" data-a="today">Today</button><button class="btn sm" data-a="calw" data-d="1">Next →</button></div>
  ${conf.length ? `<div class="warnbox"><b>!CLASH</b><span>${[...new Set(conf.map(c => F.date(c.date)))].join(', ')}: ${E(conf[0].title)} overlaps ${E(conf[0].conflictWith.join(', '))}. Nothing moves automatically.</span></div>` : ''}
  <div class="gantt" role="grid" aria-label="Week timeline 06:00 to 22:00">
    <div class="g-axis"><span></span><div class="hrs">${[6, 8, 10, 12, 14, 16, 18, 20, 22].map(h => `<span style="left:${(h - H0) / (H1 - H0) * 100}%">${String(h).padStart(2, '0')}</span>`).join('')}</div></div>
    ${days.map(d => { const list = occ.filter(o => o.date === d); const timed = list.filter(o => o.start && o.end && o.kind !== 'task' && o.kind !== 'log'); const untimed = list.filter(o => !(o.start && o.end) || o.kind === 'task' || o.kind === 'log');
      return `<button class="g-row ${d === T ? 'today' : ''} ${d === ui.calSel ? 'sel' : ''}" data-a="cald" data-v="${d}" style="width:100%;text-align:left" aria-label="${F.long(d)}, ${list.length} items"><span class="dl">${F.day(d).toUpperCase()}<b>${D.parse(d).getDate()}</b></span><span class="g-track">${timed.map((o, i) => `<span class="gb ${o.status === 'done' ? '' : 'planned'} ${o.conflict && !o.cancelled ? 'clash' : ''} ${o.cancelled ? 'cancelled' : ''}" style="${cv(o.section)};left:${Math.max(0, pos(o.start))}%;width:${Math.max(2, pos(o.end) - pos(o.start))}%;top:${6 + (i % 2) * 20}px" title="${E(o.title)} ${o.start}–${o.end}"></span>`).join('')}${untimed.slice(0, 8).map((o, i) => `<span class="gtick" style="${cv(o.section || 'ink-3')};left:${2 + i * 3.4}%"></span>`).join('')}</span></button>`; }).join('')}
  </div>
  <p class="nt" style="margin-top:6px">Solid = completed · hatched = planned · red outline = clash · dots = tasks and unplanned logs</p>
  ${ph(F.long(ui.calSel))}
  <div class="pnl agenda" style="padding:2px 12px">${selList.length ? selList.map(o => { const tap = o.kind !== 'log' && o.kind !== 'task'; const tag = o.cancelled ? 'CANCELLED' : o.conflict ? 'CLASH' : o.status === 'done' ? 'DONE' : o.status === 'unlogged' ? 'NOT LOGGED' : o.kind === 'task' ? 'TASK' : o.kind === 'exam' ? 'EXAM' : o.kind === 'performance' ? 'CONCERT' : o.kind === 'competition' ? 'MATCH' : 'PLANNED';
    return `<${tap ? 'button' : 'div'} class="ar ${o.status === 'done' ? 'done' : 'planned'} ${o.cancelled ? 'cancelled' : ''}" style="${cv(o.section || 'ink-3')}" ${tap ? `data-a="ev" data-v="${o.id}"` : ''}><span class="tm">${o.start || '——'}</span><span class="st"></span><span class="ti">${E(o.title)}<small>${o.section ? CODE(o.section) : 'GEN'}${o.recurring ? ' · WEEKLY' : ''}${o.changed ? ' · MOVED' : ''}${o.note ? ' · ' + E(o.note).toUpperCase() : ''}</small></span><span class="tagm ${o.conflict && !o.cancelled ? 'warn' : o.status === 'done' ? 'ok' : ''}">${tag}</span></${tap ? 'button' : 'div'}>`; }).join('') : '<p class="nt" style="padding:12px 0">No events.</p>'}</div>
  <div class="foot"><span class="sample">${E(LT.LABELS.google)}</span><span class="sample">${E(LT.LABELS.school)}</span><button class="lnk" data-a="addev">+ Add event</button></div>
  </div>`;
};

/* ---------- command bar ---------- */

/* ---------- sheets ---------- */
const sh = (title, inner, c, steps = '') => `<div class="scrim" data-a="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${E(title)}" style="${cv(c)}"><div class="sh-h"><h2>${E(title)}</h2><button class="sh-x" data-a="close" aria-label="Close">ESC</button></div>${steps}${inner}</div>`;
const SH = {};
const CMDS = [['violin', 'violin', 'type · min · pieces'], ['gym', 'gym', 'run the plan'], ['sleep', 'sleep', 'bed · wake'], ['screen', 'screen', 'daily total'], ['sports', 'sport', 'run · ride · swim · court'], ['study', 'study', 'subject · min'], ['chess', 'chess', 'puzzles · study'], ['tasks', 'task', 'new task'], ['you', 'progress', 'levels · drone']];
SH.quick = S => {
  const q = (S.sheet.q || '').toLowerCase().trim();
  const list = CMDS.filter(([, c, d]) => !q || c.includes(q.split(' ')[0]) || d.includes(q));
  return sh('Command', `<div class="sh-b" data-sheet-body><label class="palette-in"><span>›</span><input type="text" id="palq" data-in="q" placeholder="type: violin, gym, sleep…" value="${E(S.sheet.q || '')}" autocomplete="off" aria-label="Filter commands"></label>
    <div class="cmdlist" id="cmdlist">${list.map(([id, c, d]) => `<button data-a="${id === 'you' ? 'go' : 'ql'}" data-v="${id}" style="${cv(id === 'tasks' || id === 'you' ? 'sig' : id)}"><span class="code">${id === 'tasks' || id === 'you' ? 'SYS' : CODE(id)}</span><span>log ${c}<br><small>${d}</small></span><span class="mono dim">↵</span></button>`).join('') || '<p class="nt">No matching command.</p>'}</div></div>`, 'sig');
};
SH.violin = S => {
  const f = S.sheet, Vn = LT.violin;
  const steps = `<div class="sh-steps">${['01 TYPE', '02 DURATION', '03 PIECES'].map((s, i) => `<div class="${f.step >= i + 1 ? 'on' : ''}">${s}</div>`).join('')}</div>`;
  let body, foot;
  if (f.step === 1) {
    const hint = { solo: 'solo', lesson: 'thu 16:00', orchestra: 'thu 17:15', trio: 'elgar trio' };
    body = `<div class="opts">${Vn.TYPES.map(t => `<button class="opt ${f.typeId === t.id ? 'on' : ''}" data-a="vtype" data-v="${t.id}"><b>${t.name}</b><small>${hint[t.id]}</small></button>`).join('')}</div>`;
    foot = `<button class="btn block" data-a="close">Cancel</button>`;
  } else if (f.step === 2) {
    body = (f.timer ? `<div style="text-align:center;display:grid;gap:8px"><b id="vtimer" class="mono" style="font-size:56px;font-weight:400;letter-spacing:-.05em">${S.clock(f.timerSec)}</b><div style="display:flex;gap:8px;justify-content:center"><button class="btn sm ${f.timerRunning ? '' : 'sig'}" data-a="vtimer">${f.timerRunning ? 'Pause' : f.timerSec ? 'Resume' : 'Start'}</button><button class="btn sm" data-a="vtimerdone" ${f.timerSec ? '' : 'disabled'}>Use time</button></div></div>`
      : `<div class="dial"><button class="sq" data-a="vmin" data-d="-5" aria-label="5 minutes less">−5</button><output>${f.minutes}<small>min total</small></output><button class="sq" data-a="vmin" data-d="5" aria-label="5 minutes more">+5</button></div><div class="picks" style="justify-content:center">${[15, 20, 30, 45, 60, 90].map(m => `<button class="pk mono ${f.minutes === m ? 'on' : ''}" data-a="vset" data-v="${m}">${m}</button>`).join('')}</div>`) +
      `<button class="tg" data-a="vtimermode"><span>Start/stop timer</span><span class="sw ${f.timer ? 'on' : ''}"></span></button><p class="nt">One total can cover several pieces.</p>`;
    foot = `<button class="btn" data-a="vback">Back</button><button class="btn sig block" data-a="vnext">Next</button>`;
  } else {
    const alloc = Object.values(f.split).reduce((a, b) => a + b, 0);
    const pk = kind => Vn.pieces.filter(p => p.kind === kind).map(p => `<button class="pk ${f.items.includes(p.id) ? 'on' : ''}" data-a="vitem" data-v="${p.id}">${E(p.kind === 'piece' ? p.composer + ' · ' + p.title.split(' — ')[0].split(',')[0] : p.title)}</button>`).join('');
    body = `<p class="mono small mid">${f.minutes} MIN · ${Vn.typeName(f.typeId).toUpperCase()}</p><div class="grp"><span class="lab">Pieces</span><div class="picks">${pk('piece')}</div></div><div class="grp"><span class="lab">Scales</span><div class="picks">${pk('scale')}</div></div>
      <button class="tg" data-a="vsplitmode" ${f.items.length > 1 ? '' : 'disabled style="opacity:.45"'}><span>Split time by piece <span class="mono small dim">OPTIONAL</span></span><span class="sw ${f.splitOn ? 'on' : ''}"></span></button>
      ${f.splitOn && f.items.length > 1 ? `<div>${f.items.map(id => `<div class="kv"><span>${E(Vn.item(id).kind === 'piece' ? Vn.item(id).composer : Vn.item(id).title)}</span>${stepper('vsplit', (f.split[id] || 0) + ' min', 'minutes', `data-v="${id}"`)}</div>`).join('')}<p class="nt ${alloc > f.minutes ? 'warn' : ''}" style="margin-top:6px">${alloc > f.minutes ? `Over by ${alloc - f.minutes} min.` : `${alloc}/${f.minutes} min assigned${alloc < f.minutes ? ' · rest unassigned' : ''}.`}</p></div>` : ''}
      ${f.noteOpen ? `<textarea id="vnote" data-in="notes" placeholder="Note (optional)">${E(f.notes)}</textarea>` : `<button class="lnk" data-a="vnote">+ Note</button>`}`;
    foot = `<button class="btn" data-a="vback">Back</button><button class="btn sig block" data-a="vsave" ${f.items.length && !(f.splitOn && alloc > f.minutes) ? '' : 'disabled'}>Save ${f.minutes} min</button>`;
  }
  return sh(CODE('violin') + ' · log violin', `<div class="sh-b" data-sheet-body>${body}</div><div class="sh-f">${foot}</div>`, 'violin', steps);
};
SH.sport = S => {
  const f = S.sheet, K = LT.sports.kinds, end = ['running', 'cycling', 'swimming'].includes(f.sport);
  const metric = end ? (f.sport === 'running' ? F.pace(f.minutes, f.km) : f.sport === 'cycling' ? F.speed(f.minutes, f.km) : F.swim(f.minutes, f.km)) : '';
  return sh(CODE('sports') + ' · log sport', `<div class="sh-b" data-sheet-body><div class="picks">${Object.keys(K).map(k => `<button class="pk ${f.sport === k ? 'on' : ''}" data-a="ssport" data-v="${k}">${K[k].name}</button>`).join('')}</div>
    <div class="kv"><span>Duration</span>${stepper('smin', F.dur(f.minutes), 'duration')}</div>
    ${end ? `<div class="kv"><span>Distance</span>${stepper('skm', f.km.toFixed(f.sport === 'swimming' ? 2 : 1) + ' km', 'distance')}</div><div class="kv"><span>${f.sport === 'cycling' ? 'Speed' : 'Pace'} (calc)</span><span class="mono" style="color:var(--sports)">${metric}</span></div>`
      : `<div class="kv"><span>Type</span><span class="picks">${['Training', 'Match'].map(x => `<button class="pk ${f.kind === x ? 'on' : ''}" data-a="skind" data-v="${x}">${x}</button>`).join('')}</span></div>${f.kind === 'Match' ? `<input type="text" id="sscore" data-in="score" placeholder="Score (optional)" value="${E(f.score)}">` : ''}`}
    <textarea id="snotes" data-in="notes" placeholder="${end ? 'Route / notes (optional)' : 'Skill notes (optional)'}">${E(f.notes)}</textarea></div>
    <div class="sh-f"><button class="btn" data-a="close">Cancel</button><button class="btn sig block" data-a="ssave">Save</button></div>`, 'sports');
};
SH.study = S => { const f = S.sheet; return sh(CODE('study') + ' · log study', `<div class="sh-b" data-sheet-body><div class="picks">${LT.study.subjects.map(s => `<button class="pk ${f.subject === s.id ? 'on' : ''}" data-a="stsub" data-v="${s.id}">${s.name}</button>`).join('')}</div><div class="kv"><span>Duration</span>${stepper('stmin', F.dur(f.minutes), 'duration')}</div><input type="text" id="sttopic" data-in="topic" placeholder="Topic" value="${E(f.topic)}"></div><div class="sh-f"><button class="btn" data-a="close">Cancel</button><button class="btn sig block" data-a="stsave">Save</button></div>`, 'study'); };
SH.chess = S => { const f = S.sheet; return sh(CODE('chess') + ' · log chess', `<div class="sh-b" data-sheet-body><div class="picks">${[['puzzles', 'Puzzles'], ['study', 'Study']].map(([k, l]) => `<button class="pk ${f.kind === k ? 'on' : ''}" data-a="chkind" data-v="${k}">${l}</button>`).join('')}</div><div class="kv"><span>Duration</span>${stepper('chmin', F.dur(f.minutes), 'duration')}</div>${f.kind === 'puzzles' ? `<div class="kv"><span>Solved</span>${stepper('chsolved', f.solved, 'solved')}</div>` : `<input type="text" id="chtopic" data-in="topic" placeholder="Topic" value="${E(f.topic)}">`}<p class="nt">Games would sync from Chess.com; these are fictional samples.</p></div><div class="sh-f"><button class="btn" data-a="close">Cancel</button><button class="btn sig block" data-a="chsave">Save</button></div>`, 'chess'); };
SH.swap = S => { const e = LT.state.gym.active.exercises[S.sheet.ei]; return sh('Swap exercise', `<div class="sh-b" data-sheet-body><p class="mono small mid">REPLACE ${E(e.name).toUpperCase()} · TODAY ONLY</p><div class="cmdlist">${e.alts.map(a => `<button data-a="gswapto" data-v="${E(a)}" style="--c:var(--gym)"><span class="code">ALT</span><span>${E(a)}</span><span class="mono dim">↵</span></button>`).join('')}</div></div>`, 'gym'); };
SH.finish = S => { const f = S.sheet; return sh('Check-in', `<div class="sh-b" data-sheet-body><p class="nt">Optional. Feeds planning around sport and recovery.</p>
  <div class="grp"><span class="lab">Effort (RPE /10)</span><div class="n5">${[5, 6, 7, 8, 9].map(v => `<button class="${f.effort === v ? 'on' : ''}" data-a="fin" data-f="effort" data-v="${v}">${v}</button>`).join('')}</div></div>
  <div class="grp"><span class="lab">Soreness 0–4</span><div class="n5">${[0, 1, 2, 3, 4].map(v => `<button class="${f.soreness === v ? 'on' : ''}" data-a="fin" data-f="soreness" data-v="${v}">${v}</button>`).join('')}</div></div>
  <button class="tg" data-a="finpain"><span>Pain? <span class="mono small dim">E.G. SHINS</span></span><span class="sw ${f.pain ? 'on' : ''}"></span></button>
  ${f.pain ? `<input type="text" id="painnote" data-in="painNote" placeholder="Where? What made it worse?" value="${E(f.painNote)}">` : ''}</div>
  <div class="sh-f"><button class="btn" data-a="close">Back</button><button class="btn sig block" data-a="gdone">Save session</button></div>`, 'gym'); };
SH.ev = S => {
  const f = S.sheet, o = f.occ, s = LT.section(o.section);
  return sh(o.title, `<div class="sh-b" data-sheet-body><p class="mono small mid">${s ? CODE(o.section) + ' ' + s.name.toUpperCase() : 'GENERAL'} · ${F.date(o.date).toUpperCase()}${o.start ? ' · ' + o.start + '–' + o.end : ''}${o.recurring ? ' · WEEKLY' : ''}</p>
    ${o.conflict && !o.cancelled ? `<div class="warnbox" style="margin:0"><b>!CLASH</b><span>Overlaps ${E(o.conflictWith.join(', '))}. You decide what moves.</span></div>` : ''}
    ${o.status === 'done' ? `<p class="nt">Completed: ${E(o.logged.title)}</p>` : ''}
    ${o.cancelled ? `<button class="btn block" data-a="evrestore">Restore</button>` : `
    <div class="kv"><span>Date</span>${stepper('evd', F.date(f.date), 'date')}</div>${o.start ? `<div class="kv"><span>Start</span>${stepper('evt', f.start, 'start time')}</div>` : ''}
    ${o.recurring ? `<div class="grp"><span class="lab">Scope</span><div class="opts"><button class="opt ${f.scope === 'one' ? 'on' : ''}" data-a="evscope" data-v="one" style="min-height:62px"><b>This one</b><small>${F.date(o.origDate)}</small></button><button class="opt ${f.scope === 'future' ? 'on' : ''}" data-a="evscope" data-v="future" style="min-height:62px"><b>This + later</b><small>edits series</small></button></div></div>` : ''}
    <div style="display:flex;gap:8px"><button class="btn" data-a="evcancel" style="color:var(--warn)">Cancel ${o.recurring && f.scope === 'future' ? 'series' : 'event'}</button><button class="btn sig" data-a="evsave" style="flex:1">Save</button></div>`}
    <p class="sample">${E(LT.LABELS.google)}</p></div>`, o.section || 'sig');
};
SH.task = S => { const f = S.sheet; return sh('New task', `<div class="sh-b" data-sheet-body><input type="text" id="tasktitle" data-in="title" placeholder="Task" value="${E(f.title)}" aria-label="Task">
  <div class="grp"><span class="lab">Channel</span><div class="picks"><button class="pk ${!f.section ? 'on' : ''}" data-a="tsec" data-v="">None</button>${LT.SECTIONS.map(s => `<button class="pk ${f.section === s.id ? 'on' : ''}" data-a="tsec" data-v="${s.id}" style="${cv(s.id)}">${short(s.id)}</button>`).join('')}</div></div>
  <div class="grp"><span class="lab">Priority</span><div class="picks">${[['high', 'P1 High'], ['medium', 'P2 Medium'], ['low', 'P3 Low']].map(([p, l]) => `<button class="pk ${f.priority === p ? 'on' : ''}" data-a="tpri" data-v="${p}">${l}</button>`).join('')}</div></div>
  <div class="grp"><span class="lab">Due</span><div class="picks">${[['', 'None'], [T, 'Today'], [D.addDays(T, 1), 'Tomorrow'], [D.addDays(T, 7), '+7 days']].map(([d, l]) => `<button class="pk ${f.due === d ? 'on' : ''}" data-a="tdue" data-v="${d}">${l}</button>`).join('')}</div></div></div>
  <div class="sh-f"><button class="btn" data-a="close">Cancel</button><button class="btn sig block" data-a="tsave">Add</button></div>`, 'sig'); };
SH.addev = S => { const f = S.sheet; return sh('Add event', `<div class="sh-b" data-sheet-body><input type="text" id="evtitle" data-in="title" placeholder="Title" value="${E(f.title)}" aria-label="Event title"><div class="picks">${LT.SECTIONS.map(s => `<button class="pk ${f.section === s.id ? 'on' : ''}" data-a="aesec" data-v="${s.id}" style="${cv(s.id)}">${short(s.id)}</button>`).join('')}</div><div class="kv"><span>Date</span>${stepper('aed', F.date(f.date), 'date')}</div><div class="kv"><span>Start</span>${stepper('aet', f.start, 'start time')}</div></div><div class="sh-f"><button class="btn" data-a="close">Cancel</button><button class="btn sig block" data-a="aesave">Add</button></div>`, 'sig'); };

/* ---------- reward ---------- */
function reward(r) {
  const O = LT.overall();
  const evo = r.evolved ? `<div class="upgrade"><span class="scan"></span><div class="old">${drone(r.evolved.from, { still: true })}</div><div class="new">${drone(r.evolved.to, { still: true, happy: true })}</div></div><div class="up">Upgrade complete · <em>${STAGE[r.evolved.from]} → ${STAGE[r.evolved.to]}</em></div><p class="nt">Level ${r.overallUp.to}. New hardware, earned over months.</p>` : '';
  return `<div class="reward" data-reward role="dialog" aria-modal="true" aria-label="Reward"><div class="box">
    ${r.rest ? `<div style="width:110px;margin:0 auto">${drone(O.stage, { still: true, happy: true })}</div><div class="up">Rest day logged</div><p class="nt">Streak held at ${r.streak} days. Recovery is part of the system.</p>` : `
    ${evo || `<div style="width:96px;margin:0 auto">${drone(O.stage, { still: true, happy: true })}</div>`}
    ${r.preview ? '<span class="tagm c" style="justify-self:center;--c:var(--sig)">PREVIEW ONLY</span>' : `<div class="xp">+${r.total}<small> XP</small></div><ul>${r.lines.map(l => `<li><span>${E(l.reason)}</span><b>+${l.xp}</b></li>`).join('')}</ul>`}`}
    ${r.sectionUps.map(u => `<div class="up">${CODE(u.section)} ${E(u.name)} · <em>LV ${String(u.from).padStart(2, '0')} → ${String(u.to).padStart(2, '0')}</em></div>`).join('')}
    ${r.overallUp && !r.evolved ? `<div class="up">Level up · <em>LV ${r.overallUp.to}</em></div>` : ''}
    ${(r.unlocked || []).map(a => `<div class="up" style="background:var(--panel-2);color:var(--ink)">Achievement · <em>${E(a.title)}</em></div><p class="nt">${E(a.desc)}</p>`).join('')}
    ${r.pain ? '<p class="nt warn" style="text-align:left">Pain noted. Consider resting or easing the next session; talk to a coach or physio if it keeps happening.</p>' : ''}
    ${r.streakUp ? `<p class="mono small mid">STREAK ${String(r.streak).padStart(3, '0')}</p>` : ''}
    <button class="btn sig block" data-a="rclose">OK</button></div></div>`;
}

const shell = Shell({
  key: 'instrument', navId: 'nav', views: V, sheets: SH, reward, nav,
  restBar: (left, S) => `<div class="restbar" role="status"><span class="mono small">REST</span><span class="tr"><i style="width:${(left / (S.rest.total || 90) * 100).toFixed(0)}%"></i></span><b>${S.clock(left)}</b><span style="display:flex;gap:4px"><button data-a="rest30">+30s</button><button data-a="restskip">Skip</button></span></div>`,
  pokeLines: () => { const O = LT.overall(), st = LT.streak(); return [`streak=${st.n}d · rest days count`, `xp_to_next=${O.toNext}`, `violin_week=${LT.violin.weekTotal()}/${LT.state.violin.target} min`, 'next: gym lower_a @ 10:00']; },
  afterSheet: S => { if (S.sheet && S.sheet.type === 'quick' && !S.sheet.focused) { S.sheet.focused = true; } },
  actions: {
    // live-filter the command palette while typing
  },
});
document.addEventListener('input', e => {
  if (e.target.id !== 'palq' || !shell.sheet) return;
  const list = document.getElementById('cmdlist'); if (!list) return;
  const q = e.target.value.toLowerCase().trim();
  list.querySelectorAll('button').forEach((b, i) => { const [, c, d] = CMDS[CMDS.findIndex(x => x[0] === b.dataset.v)]; b.hidden = !!q && !(c.includes(q.split(' ')[0]) || d.includes(q)); });
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.target.id !== 'palq') return;
  const first = [...document.querySelectorAll('#cmdlist button')].find(b => !b.hidden); if (first) { e.preventDefault(); first.click(); }
});
})();
</script>
