<title>LifeTracker Pinboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@400;500;600;700&family=Special+Elite&display=swap">
<style>
/* Layout: a corkboard. A polaroid of the paper fox is pinned in the middle with eight section notes around it.
   Folder tabs along the top switch between Board, Planner, To-do and Scrapbook. A single committed tactile look. */
:root {
  --cork: #C29A6E; --cork-2: #B08559; --card: #FBFAF5; --kraft: #D8BC93; --ink: #2B2622; --ink-2: #5A524A; --ink-3: #887E73; --red: #C3392B; --navy: #233256; --gold: #C99A2E;
  --violin: #F7C38E; --coding: #BCD6F2; --sports: #BFE3CB; --gym: #F4BCC6; --study: #D9C9F1; --chess: #DCDAD2; --sleep: #2E3C66; --screen: #F5E27C; --brass: #F5E27C;
  --violin-d: #B7651E; --coding-d: #2F6AA8; --sports-d: #2F7D4D; --gym-d: #B03A55; --study-d: #6A4BB0; --chess-d: #5C5A50; --sleep-d: #2E3C66; --screen-d: #8E7A14;
  --hand: "Shantell Sans", "Comic Neue", "Segoe Print", ui-rounded, sans-serif;
  --type: "Special Elite", "Courier New", ui-monospace, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; color: var(--ink); font: 16px/1.45 var(--hand); -webkit-tap-highlight-color: transparent;
  background-color: var(--cork); background-image: radial-gradient(rgba(70,40,15,.35) .8px, transparent 1.2px), radial-gradient(rgba(255,240,215,.25) .8px, transparent 1.2px); background-size: 7px 7px, 11px 11px; background-position: 0 0, 3px 5px; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
:focus-visible { outline: 3px dashed var(--navy); outline-offset: 3px; }
h1, h2, h3, p { margin: 0; text-wrap: balance; }
.type { font-family: var(--type); letter-spacing: .02em; }
.tnum { font-variant-numeric: tabular-nums; }
.dim { color: var(--ink-3); } .mid { color: var(--ink-2); } .small { font-size: 14px; }

.app { max-width: 560px; margin: 0 auto; min-height: 100%; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(110px + env(safe-area-inset-bottom, 0px)); }
.view { animation: pin .3s cubic-bezier(.3,1.35,.5,1); transform-origin: 50% 0; }
@keyframes pin { from { opacity: 0; transform: translateY(-14px) rotate(-1.2deg) scale(.98); } }

/* folder tabs */
.folders { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 18; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 8px 0 0; margin: 0 0 14px; background: linear-gradient(var(--cork-2), var(--cork-2)) bottom / 100% 6px no-repeat; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--cork); }
.folder { min-height: 46px; border-radius: 12px 12px 0 0; background: var(--kraft); font-family: var(--type); font-size: 14px; display: grid; place-items: center; box-shadow: inset 0 -6px 0 rgba(0,0,0,.08); color: var(--ink-2); }
.folder.on { background: var(--card); color: var(--ink); box-shadow: 0 -2px 6px rgba(0,0,0,.12); }

/* pieces of paper */
.card { background: var(--card); border-radius: 2px; box-shadow: 0 1px 1px rgba(0,0,0,.18), 0 6px 14px -6px rgba(60,35,10,.45); padding: 14px; position: relative; }
.note { background: var(--n, var(--screen)); border-radius: 1px; box-shadow: 0 1px 1px rgba(0,0,0,.15), 0 10px 14px -10px rgba(60,35,10,.6); padding: 12px; position: relative; }
.note::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: linear-gradient(to top, rgba(0,0,0,.06), transparent); }
.kraft { background: var(--kraft); }
.tape { position: absolute; top: -10px; left: 50%; width: 74px; height: 22px; transform: translateX(-50%) rotate(-3deg); background: repeating-linear-gradient(90deg, rgba(255,255,255,.55) 0 6px, rgba(255,255,255,.35) 6px 12px); box-shadow: 0 1px 2px rgba(0,0,0,.12); opacity: .9; }
.tape.c { background: repeating-linear-gradient(45deg, color-mix(in srgb, var(--c, var(--coding)) 85%, #fff) 0 6px, color-mix(in srgb, var(--c, var(--coding)) 60%, #fff) 6px 12px); }
.pinhead { position: absolute; top: -6px; left: 50%; width: 16px; height: 16px; border-radius: 50%; transform: translateX(-50%); background: radial-gradient(circle at 35% 30%, #fff8, transparent 40%), var(--p, var(--red)); box-shadow: 1px 3px 3px rgba(0,0,0,.35); z-index: 2; }
.r1 { transform: rotate(-1.6deg); } .r2 { transform: rotate(1.2deg); } .r3 { transform: rotate(-.7deg); } .r4 { transform: rotate(2deg); }

/* board */
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: auto auto auto; gap: 14px 10px; }
.snote { --n: var(--c); min-height: 88px; padding: 12px 8px 8px; text-align: left; display: grid; align-content: space-between; gap: 2px; transition: transform .2s cubic-bezier(.3,1.5,.5,1); }
.snote:active { transform: scale(.94) rotate(0); }
.snote b { font-weight: 700; font-size: 15px; line-height: 1.05; }
.snote small { font-family: var(--type); font-size: 11.5px; color: var(--ink-2); }
.snote.dark { color: #F4F1E8; } .snote.dark small { color: #C9CFE6; }
.polaroid { grid-column: 2 / span 2; grid-row: 2 / span 2; background: var(--card); padding: 10px 10px 8px; box-shadow: 0 2px 2px rgba(0,0,0,.15), 0 14px 24px -12px rgba(60,35,10,.7); transform: rotate(-1.5deg); position: relative; display: grid; gap: 4px; align-content: start; }
.polaroid .photo { background: linear-gradient(160deg, #E9EEF1, #CFDDE3); aspect-ratio: 1; display: grid; place-items: center; overflow: hidden; position: relative; }
.polaroid .photo svg { width: 96%; height: auto; overflow: visible; }
.polaroid .cap { font-size: 14px; text-align: center; line-height: 1.2; }
.wobble { animation: wob 4s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes wob { 50% { transform: rotate(1.5deg); } }
.polaroid.jig .wobble { animation: jig .5s ease; }
@keyframes jig { 30% { transform: rotate(-6deg) translateY(-4px); } 60% { transform: rotate(5deg); } }
.speech { position: absolute; z-index: 6; left: 50%; top: -6px; transform: translate(-50%, -100%) rotate(1deg); width: 200px; background: var(--card); padding: 8px 10px; border-radius: 14px; box-shadow: 0 6px 14px rgba(0,0,0,.25); font-size: 14px; line-height: 1.3; text-align: center; animation: pin .25s ease; }
.lvl-strip { margin-top: 18px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 12px 14px; }
.lvl-strip .lv { font-family: var(--type); font-size: 13px; line-height: 1.1; }
.lvl-strip .lv b { display: block; font-family: var(--hand); font-size: 28px; font-weight: 700; }
.ruler { height: 18px; border: 1.5px solid var(--ink); border-radius: 3px; position: relative; overflow: hidden; background: repeating-linear-gradient(90deg, transparent 0 9px, rgba(0,0,0,.25) 9px 10px); }
.ruler i { position: absolute; inset: 0 auto 0 0; background: var(--gold); opacity: .85; }
.streak-badge { width: 64px; height: 64px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; text-align: center; line-height: 1; box-shadow: 0 0 0 3px #fff, 0 0 0 4px var(--red), 0 4px 8px rgba(0,0,0,.3); transform: rotate(8deg); }
.streak-badge b { font-size: 22px; display: block; }
.streak-badge span { font-family: var(--type); font-size: 9.5px; }
.notepad { margin-top: 18px; background: var(--card); padding: 18px 14px 10px; box-shadow: 0 1px 1px rgba(0,0,0,.15), 0 10px 18px -10px rgba(60,35,10,.6); position: relative;
  background-image: linear-gradient(to bottom, transparent 35px, #D8E4F0 36px); background-size: 100% 36px; background-position: 0 22px; }
.notepad::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 10px; background: radial-gradient(circle at 8px 0, var(--cork) 5px, transparent 5.5px) 0 0 / 22px 10px repeat-x; }
.np-h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 2px; }
.np-h b { font-family: var(--type); font-size: 15px; }
.np-h button { font-family: var(--type); font-size: 13px; color: var(--red); min-height: 36px; text-decoration: underline; }
.np-row { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 8px; align-items: center; min-height: 36px; font-size: 15px; }
.np-row .t { font-family: var(--type); font-size: 12.5px; color: var(--ink-2); }
.np-row .ti { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--c-d, var(--ink-3)); margin-right: 6px; }

/* stamp button */
.stampbtn { position: fixed; z-index: 22; right: max(16px, calc(env(safe-area-inset-right, 0px) + 10px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: 70px; height: 70px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #E2574A, var(--red) 60%, #8E2318); color: #fff; display: grid; place-items: center; text-align: center; font-family: var(--type); font-size: 12px; line-height: 1.05; box-shadow: 0 6px 0 #7A1E14, 0 12px 20px rgba(0,0,0,.35); transform: rotate(-6deg); }
.stampbtn:active { transform: rotate(-6deg) translateY(5px); box-shadow: 0 1px 0 #7A1E14, 0 4px 8px rgba(0,0,0,.35); }
.stampbtn b { display: block; font-family: var(--hand); font-size: 30px; line-height: .8; }
@media (min-width: 900px) { .stampbtn { right: calc(50% - 280px - 90px); } }

/* section pages */
.sec-top { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
.back { min-height: 44px; padding: 0 12px; background: var(--kraft); font-family: var(--type); font-size: 14px; box-shadow: 0 2px 4px rgba(0,0,0,.2); transform: rotate(-2deg); display: inline-flex; align-items: center; }
.jump { display: flex; gap: 6px; overflow-x: auto; padding: 6px 2px; scrollbar-width: none; flex: 1; }
.jump::-webkit-scrollbar { display: none; }
.jump button { flex: none; width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff9, transparent 45%), var(--c-d); box-shadow: 1px 3px 3px rgba(0,0,0,.3); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.jump button.on { box-shadow: 0 0 0 3px var(--card), 1px 3px 3px rgba(0,0,0,.3); }
.title-card { padding: 16px 16px 14px; margin-bottom: 18px; }
.title-card .k { font-family: var(--type); font-size: 13px; color: var(--ink-2); }
.title-card h1 { font-size: 34px; font-weight: 700; line-height: 1.05; letter-spacing: -.01em; }
.title-card .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.sticker { display: inline-flex; align-items: center; gap: 4px; font-family: var(--type); font-size: 12px; padding: 4px 9px; border-radius: 99px; background: var(--c, var(--screen)); box-shadow: 0 1px 2px rgba(0,0,0,.25); white-space: nowrap; }
.sticker.ink { background: var(--ink); color: var(--card); }
.sticker.red { background: var(--red); color: #fff; }
.label { display: inline-block; font-family: var(--type); font-size: 14px; background: var(--card); padding: 4px 10px; box-shadow: 0 1px 2px rgba(0,0,0,.25); transform: rotate(-1.5deg); margin: 22px 0 10px; }
.label + .aside { font-family: var(--type); font-size: 12px; color: #F4EBDD; margin-left: 8px; }
.lrow { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
.lrow .linkish { font-family: var(--type); font-size: 13px; color: #FFF6E6; text-decoration: underline; min-height: 40px; display: inline-flex; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 8px; background: var(--ink); color: var(--card); font-weight: 600; font-size: 16px; box-shadow: 0 3px 0 rgba(0,0,0,.35); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
.btn.c { background: var(--c-d, var(--ink)); }
.btn.paper { background: var(--card); color: var(--ink); box-shadow: 0 2px 0 rgba(0,0,0,.2), inset 0 0 0 1.5px var(--ink); }
.btn.red { background: var(--red); }
.btn.block { width: 100%; }
.btn.sm { min-height: 38px; font-size: 14px; padding: 0 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.sample { font-family: var(--type); font-size: 11.5px; color: var(--ink-3); display: inline-flex; gap: 6px; align-items: baseline; line-height: 1.35; }
.sample::before { content: "✎"; }
.on-cork { color: #FFF6E6; } .on-cork.sample { color: #F4E6CF; }
.lines .ln { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1.5px dashed rgba(43,38,34,.2); min-height: 48px; }
.lines .ln:last-child { border-bottom: 0; }
.lines .ln small { display: block; font-size: 13px; color: var(--ink-3); line-height: 1.3; }
.lines .ln .v { font-family: var(--type); font-size: 14px; text-align: right; }
.lines .ln.fresh { animation: hl 1.6s ease; }
@keyframes hl { from { background: color-mix(in srgb, var(--screen) 80%, transparent); } }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fact { padding: 10px 12px; }
.fact b { display: block; font-size: 24px; font-weight: 700; line-height: 1.1; }
.fact span { font-size: 13px; color: var(--ink-2); line-height: 1.25; display: block; }
.big { font-size: 46px; font-weight: 700; line-height: .95; letter-spacing: -.02em; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 38px; padding: 0 12px; background: var(--card); border-radius: 4px; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.25); display: inline-flex; align-items: center; gap: 6px; }
.chip.on { background: var(--ink); color: var(--card); }
.chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--c-d); }

/* paper-strip charts */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.ch-grid { stroke: rgba(43,38,34,.12); }
.ch-axis, .ch-lbl { fill: var(--ink-3); font: 10.5px var(--type); }
.ch-lbl.is-hi { fill: var(--ink); }
.ch-bar { fill: color-mix(in srgb, var(--c, var(--screen)) 75%, #fff); stroke: rgba(43,38,34,.35); stroke-width: .8; }
.ch-bar.is-met { fill: var(--c, var(--screen)); }
.ch-bar.is-hi { fill: var(--c-d, var(--ink)); }
.ch-target { stroke: var(--red); stroke-width: 1.4; stroke-dasharray: 6 4; }
.ch-target-lbl { fill: var(--red); font: 11px var(--type); }
.ch-line { fill: none; stroke: var(--c-d, var(--ink)); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.ch-area { fill: color-mix(in srgb, var(--c, var(--screen)) 45%, transparent); }
.ch-dot { fill: var(--card); stroke: var(--c-d, var(--ink)); stroke-width: 2; }
.ch-dot.is-end { fill: var(--red); stroke: var(--red); }
.stickers28 { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 4px; }
.stickers28 i { aspect-ratio: 1; border-radius: 50%; border: 1.5px dashed rgba(43,38,34,.25); }
.stickers28 i.l1 { background: color-mix(in srgb, var(--c) 70%, #fff); border: 0; }
.stickers28 i.l2 { background: var(--c); border: 0; box-shadow: 0 1px 1px rgba(0,0,0,.25); }
.stickers28 i.l3 { background: var(--c-d); border: 0; box-shadow: 0 1px 1px rgba(0,0,0,.3); }
.stickers28 i.now { outline: 2px solid var(--red); outline-offset: 1px; }
.stub { padding: 12px 14px 12px 16px; border-left: 3px dotted rgba(43,38,34,.3); }
.stub .days { font-size: 40px; font-weight: 700; line-height: 1; color: var(--c-d); }

/* clipboard (gym) */
.clipboard { background: #A9784A; padding: 34px 10px 12px; border-radius: 10px; position: relative; box-shadow: 0 10px 20px -8px rgba(0,0,0,.5); }
.clipboard::before { content: ""; position: absolute; top: 6px; left: 50%; width: 120px; height: 30px; transform: translateX(-50%); border-radius: 6px 6px 12px 12px; background: linear-gradient(#D9DCE0, #9AA0A8); box-shadow: 0 2px 3px rgba(0,0,0,.35); }
.clipboard .card { padding: 14px 12px; }
.sheet-t { width: 100%; border-collapse: collapse; }
.sheet-t th { font-family: var(--type); font-size: 12px; font-weight: 400; color: var(--ink-3); border-bottom: 1.5px solid var(--ink); padding: 4px 2px; }
.sheet-t td { border-bottom: 1px solid rgba(43,38,34,.15); padding: 4px 2px; text-align: center; }
.sheet-t td:first-child { text-align: left; }
.setrow { display: grid; grid-template-columns: 22px 1fr 1fr 46px; gap: 6px; align-items: center; min-height: 52px; border-bottom: 1px dashed rgba(43,38,34,.2); }
.setrow .n { font-family: var(--type); color: var(--ink-3); }
.adj { display: flex; align-items: center; justify-content: space-between; background: #F1EEE4; border-radius: 6px; height: 44px; }
.adj button { width: 34px; height: 42px; font-size: 18px; font-weight: 700; color: var(--ink-2); }
.adj output { font-family: var(--type); font-size: 14px; flex: 1; text-align: center; }
.tick { width: 46px; height: 44px; border: 2px solid var(--ink); border-radius: 4px; display: grid; place-items: center; transform: rotate(-2deg); }
.tick svg { width: 30px; height: 30px; opacity: 0; transform: scale(.4); transition: all .2s cubic-bezier(.3,1.6,.5,1); }
.tick.on svg { opacity: 1; transform: scale(1); }
.setrow.done .adj { opacity: .55; }
.week7 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.week7 > div { background: var(--card); min-height: 80px; padding: 4px 2px; display: grid; align-content: start; justify-items: center; gap: 3px; text-align: center; font-size: 11px; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.week7 > div:nth-child(odd) { transform: rotate(-1deg); } .week7 > div:nth-child(even) { transform: rotate(1deg); }
.week7 .d { font-family: var(--type); color: var(--ink-3); }
.week7 b { font-size: 16px; }
.week7 .g { background: var(--gym); padding: 1px 4px; border-radius: 2px; font-weight: 600; line-height: 1.15; }
.week7 .g.done { background: var(--gym-d); color: #fff; }
.week7 .s { color: var(--sports-d); font-weight: 600; line-height: 1.1; }
.week7 .now { outline: 2px solid var(--red); }
.restbar { position: fixed; z-index: 25; left: max(14px, env(safe-area-inset-left, 0px)); right: calc(100px + env(safe-area-inset-right, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); max-width: 440px; background: var(--screen); padding: 10px 12px; box-shadow: 0 8px 18px rgba(0,0,0,.35); transform: rotate(-1deg); display: flex; align-items: center; gap: 10px; }
.restbar b { font-size: 26px; font-weight: 700; }
.restbar .grow { flex: 1; font-family: var(--type); font-size: 13px; }
.restbar button { min-height: 40px; padding: 0 10px; background: var(--card); border-radius: 4px; font-size: 13px; box-shadow: 0 1px 2px rgba(0,0,0,.2); }

/* sleep: construction paper */
.navy { background: var(--navy); color: #EEF0FA; padding: 16px; box-shadow: 0 10px 20px -8px rgba(0,0,0,.6); position: relative; }
.navy .dim, .navy .mid { color: #B9C0DE; }
.navy .btn { background: #F5E27C; color: var(--ink); }
.navy .btn.paper { background: transparent; color: #EEF0FA; box-shadow: inset 0 0 0 1.5px #B9C0DE; }
.star-sticker { position: absolute; width: 18px; height: 18px; color: #F5D45A; }
.tpair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tpair > div { background: rgba(255,255,255,.08); padding: 10px; display: grid; justify-items: center; gap: 6px; }
.tpair .tv { font-size: 34px; font-weight: 700; }
.tpair .rw { display: flex; gap: 6px; }
.tpair button, .sbtn { min-width: 46px; min-height: 40px; border-radius: 6px; background: rgba(255,255,255,.14); color: #EEF0FA; font-size: 14px; font-weight: 600; }
.yarn text { font: 11px var(--type); fill: #B9C0DE; }
.yarn .d { fill: #EEF0FA; font-size: 12px; }
.switchp { width: 50px; height: 28px; border-radius: 99px; background: rgba(43,38,34,.2); position: relative; flex: none; }
.switchp::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .2s; }
.switchp.on { background: var(--sports-d); }
.switchp.on::after { transform: translateX(22px); }

/* road */
.trail { display: grid; gap: 10px; }
.trail .st { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.trail .pn { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.trail .done .pn { background: var(--coding-d); color: #fff; }
.trail .current .pn { background: var(--red); color: #fff; }
.trail .goal .pn { background: var(--gold); color: #fff; }

/* planner (calendar) */

  background-image: linear-gradient(to bottom, transparent 54px, #E59B9B 54px, #E59B9B 56px, transparent 56px), linear-gradient(to bottom, transparent 31px, #D8E4F0 32px); background-size: 100% 100%, 100% 32px; background-repeat: no-repeat, repeat; background-position: 0 0, 0 56px; }

@keyframes slam { from { transform: rotate(-8deg) scale(2.4); opacity: 0; } }

<script>
(() => {
'use strict';
const E = LT.esc, F = LT.fmt, D = LT.date, T = LT.TODAY;
const cv = id => id ? `--c: var(--${id}); --c-d: var(--${id}-d)` : '--c: var(--chess); --c-d: var(--ink-3)';
const PINS = ['#C3392B', '#2F6AA8', '#2F7D4D', '#C99A2E', '#6A4BB0', '#B03A55', '#2B2622', '#E07B27'];

/* ---------- paper fox ---------- */
const STAGE = ['Paper Cub', 'Paper Fox', 'Wanderfox', 'Patchwork Fox', 'Gold-leaf Fox'];
function fox(stage, o = {}) {
  const sh = 'filter="url(#paper)"', foil = stage >= 4;
  const orange = foil ? 'url(#foil)' : '#E8833A', dark = '#2B2622';
  const s = [0.8, 0.9, 0.95, 1, 1][stage];
  const cape = stage >= 3 ? `<path d="M64 120 L44 182 L156 182 L136 120 Z" fill="#6A8FC7" ${sh}/><path d="M50 160 L78 150 L74 182 L46 182Z" fill="#E7B4C2"/><path d="M122 150 L152 160 L154 182 L124 182Z" fill="#F5E27C"/><path d="M80 142 L120 142 L124 182 L76 182Z" fill="#9BCDA9"/><path d="M50 160 L78 150 M122 150 L152 160 M80 142 L76 182 M120 142 L124 182" stroke="#fff" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>` : '';
  const tail = `<path d="M134 166 C168 160 186 132 176 104 C170 128 156 140 136 146 Z" fill="${orange}" ${sh}/>${stage >= 1 ? '<path d="M176 104 C180 116 178 124 172 132 C168 122 170 112 176 104Z" fill="#FBFAF5"/>' : ''}`;
  const body = `<path d="M66 178 L72 122 L100 108 L128 122 L134 178 Z" fill="${orange}" ${sh}/><path d="M86 178 L90 130 L100 124 L110 130 L114 178 Z" fill="#FBFAF5"/>`;
  const head = `<path d="M58 98 L66 46 L86 70 L100 64 L114 70 L134 46 L142 98 L100 132 Z" fill="${orange}" ${sh}/>
    <path d="M68 56 L82 72 L72 78 Z M132 56 L118 72 L128 78Z" fill="${dark}" opacity=".75"/>
    <path d="M72 96 L100 130 L128 96 L114 92 L100 102 L86 92 Z" fill="#FBFAF5"/>
    ${o.happy ? `<path d="M80 88 q6 -6 12 0 M108 88 q6 -6 12 0" stroke="${dark}" stroke-width="3" fill="none" stroke-linecap="round"/>` : `<circle cx="86" cy="88" r="4.2" fill="${dark}"/><circle cx="114" cy="88" r="4.2" fill="${dark}"/><circle cx="87.4" cy="86.6" r="1.3" fill="#fff"/><circle cx="115.4" cy="86.6" r="1.3" fill="#fff"/>`}
    <path d="M94 112 L106 112 L100 120 Z" fill="${dark}"/>`;
  const scarf = stage >= 1 ? `<path d="M70 118 L130 118 L128 130 L72 130 Z" fill="#2F6AA8" ${sh}/><path d="M118 128 L132 158 L120 160 L110 130 Z" fill="#2F6AA8" ${sh}/><path d="M74 124 h52" stroke="#BCD6F2" stroke-width="2" stroke-dasharray="4 4"/>` : '';
  const satchel = stage >= 2 ? `<path d="M74 122 L120 170" stroke="#7A4E2A" stroke-width="4"/><rect x="112" y="156" width="26" height="20" rx="3" fill="#A9784A" ${sh}/><circle cx="86" cy="150" r="6" fill="#C3392B" stroke="#fff" stroke-width="1.5"/><circle cx="98" cy="160" r="5" fill="#F5E27C" stroke="#fff" stroke-width="1.5"/>` : '';
  const stars = stage >= 3 ? [[40, 60], [166, 60], [30, 120]].map(([x, y]) => `<path transform="translate(${x} ${y}) scale(.9)" d="M0 -9 L2.6 -2.8 L9 -2.8 L3.8 1.2 L5.8 7.6 L0 3.8 L-5.8 7.6 L-3.8 1.2 L-9 -2.8 L-2.6 -2.8 Z" fill="#F5D45A" stroke="#fff" stroke-width="1"/>`).join('') : '';
  const crown = foil ? `<path d="M76 52 L80 30 L92 44 L100 26 L108 44 L120 30 L124 52 Z" fill="url(#foil)" stroke="#8E6A14" stroke-width="1.2" ${sh}/>` : '';
  return `<svg viewBox="0 0 200 200" role="img" aria-label="${STAGE[stage]}, your character"><defs><linearGradient id="foil" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7E08A"/><stop offset=".45" stop-color="#D8A32E"/><stop offset=".7" stop-color="#FBEFB8"/><stop offset="1" stop-color="#B9861C"/></linearGradient>
    <filter id="paper" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="1.2" dy="2" stdDeviation=".6" flood-opacity=".28"/></filter></defs>
    <g class="${o.still ? '' : 'wobble'}"><g transform="translate(100 190) scale(${s}) translate(-100 -190)">${cape}${tail}${body}${satchel}${scarf}${head}${crown}</g>${stars}</g></svg>`;
}

/* ---------- helpers ---------- */
const stepper = (act, val, label, extra = '') => `<span class="stepper" role="group" aria-label="${label}"><button data-a="${act}" data-d="-1" ${extra} aria-label="Decrease ${label}">−</button><output>${val}</output><button data-a="${act}" data-d="1" ${extra} aria-label="Increase ${label}">+</button></span>`;
const label = (t, right = '') => `<div class="lrow"><span class="label">${t}</span>${right}</div>`;
const dark = id => id === 'sleep';
function folders(S) {
  const v = S.ui.view, cur = ['calendar', 'tasks', 'you'].includes(v) ? v : 'home';
  return `<nav class="folders" aria-label="Main">${[['home', 'Board'], ['calendar', 'Planner'], ['tasks', 'To-do'], ['you', 'Scrapbook']].map(([id, l]) => `<button class="folder ${cur === id ? 'on' : ''}" data-a="go" data-v="${id}" ${cur === id ? 'aria-current="page"' : ''}>${l}</button>`).join('')}</nav>`;
}
function top(S, id, kicker) {
  const s = LT.section(id), L = LT.level(id), st = LT.sectionStreak(id);
  return `${folders(S)}<div class="sec-top"><button class="back" data-a="home">← board</button><div class="jump" aria-label="Jump to section">${LT.SECTIONS.map(x => `<button class="${x.id === id ? 'on' : ''}" style="${cv(x.id)}" data-a="go" data-v="${x.id}" aria-label="${x.full}">${x.name.slice(0, 2)}</button>`).join('')}</div></div>
  <div class="note title-card r1" style="${cv(id)};--n:var(--${id})${dark(id) ? ';color:#EEF0FA' : ''}"><span class="pinhead" style="--p:${PINS[LT.SECTIONS.indexOf(s)]}"></span><span class="k" ${dark(id) ? 'style="color:#B9C0DE"' : ''}>${kicker}</span><h1>${s.full}</h1>
    <div class="meta"><span class="sticker ink">Level ${L.level}</span><span class="sticker" style="background:var(--card);color:var(--ink)">${L.into}/${L.need} XP</span>${st.n ? `<span class="sticker red">★ ${st.n} ${st.label}</span>` : ''}</div></div>`;
}
function todo(t) {
  const s = LT.section(t.section);
  return `<div class="todo ${t.done ? 'done' : ''}" style="${cv(t.section)}"><button class="bx" data-a="task" data-v="${t.id}" aria-label="${t.done ? 'Mark not done' : 'Complete'}: ${E(t.title)}"><i></i></button><div><span class="tt">${E(t.title)}</span><small><span class="dot" style="--c-d:var(--${t.section ? t.section + '-d' : 'ink-3'})"></span>${s ? s.name : 'General'}${t.due ? ` · <span style="${LT.tasks.overdue(t) ? 'color:var(--red)' : ''}">${F.rel(t.due)}</span>` : ''}</small></div><span class="pr ${t.priority}">${t.priority}</span></div>`;
}
const related = id => { const t = LT.tasks.list({ section: id, status: 'open' }); return t.length ? label('to-do here', `<button class="linkish" data-a="go" data-v="tasks" data-sec="${id}">whole list →</button>`) + `<div class="card r2">${t.map(todo).join('')}</div>` : ''; };

/* ---------- views ---------- */
const V = {};
V.home = S => {
  const O = LT.overall(), st = LT.streak(), td = LT.today(), ui = S.ui;
  const sn = (id, cls) => { const s = LT.section(id), L = LT.level(id), k = LT.sectionStreak(id); return `<button class="note snote ${cls} ${dark(id) ? 'dark' : ''}" style="${cv(id)}" data-a="open" data-v="${id}" aria-label="${s.full}, level ${L.level}"><span class="pinhead" style="--p:${PINS[LT.SECTIONS.indexOf(s)]}"></span><b>${id === 'screen' ? 'Screen time' : s.name}</b><small>Lv ${L.level}${k.n ? ' · ★' + k.n : ''}</small></button>`; };
  return `<div class="view">${folders(S)}
  <div class="homegrid"><div>
  <div class="board">
    ${sn('violin', 'r1')}${sn('coding', 'r2')}${sn('sports', 'r3')}${sn('gym', 'r4')}
    ${sn('study', 'r2')}
    <div class="polaroid ${ui.jig ? 'jig' : ''}"><span class="tape"></span><button class="photo" data-a="poke" aria-label="Talk to your fox">${fox(O.stage)}</button><span class="cap">${STAGE[O.stage]} · Lv ${O.level}</span>${ui.bubble ? `<span class="speech">${E(ui.bubble)}</span>` : ''}</div>

function yarn(nights) {
  const W = 320, rh = 26, top = 18, l = 46, r = 48, start = 21 * 60, span = 13 * 60, iw = W - l - r;
  const x = m => { const v = m < 720 ? m + 1440 : m; return l + (v - start) / span * iw; };
  const tapes = ['#F5E27C', '#F4BCC6', '#BCD6F2', '#BFE3CB', '#D9C9F1', '#F7C38E'];
  let s = '';
  ['21:00', '00:00', '03:00', '06:00', '09:00'].forEach(t => { const xx = x(D.toMin(t)); s += `<text x="${xx}" y="10" text-anchor="middle">${t}</text><line x1="${xx}" x2="${xx}" y1="14" y2="${top + nights.length * rh}" stroke="#ffffff22" stroke-dasharray="2 4"/>`; });
  nights.forEach((n, i) => {
    const y = top + i * rh, tg = LT.sleep.targetFor(n.date), inW = Math.abs(LT.sleep.delta(n)) <= 30;
    s += `<rect x="${x(D.toMin(tg.bed))}" y="${y + 4}" width="${x(D.toMin(tg.wake)) - x(D.toMin(tg.bed))}" height="${rh - 8}" fill="none" stroke="#ffffff44" stroke-dasharray="3 3"/>`;
    const x1 = x(D.toMin(n.bed)), x2 = x(D.toMin(n.wake));
    s += `<path d="M${x1} ${y + 7} L${x2} ${y + 6} L${x2 - 3} ${y + rh / 2} L${x2} ${y + rh - 6} L${x1} ${y + rh - 7} L${x1 + 3} ${y + rh / 2} Z" fill="${n.fresh ? '#F5D45A' : tapes[i % tapes.length]}" opacity="${inW ? .95 : .55}"><title>${F.date(n.date)}: ${n.bed}–${n.wake}</title></path>`;
    s += `<text class="d" x="0" y="${y + rh / 2 + 4}">${F.day(n.date)} ${D.parse(n.date).getDate()}</text><text class="d" x="${W}" y="${y + rh / 2 + 4}" text-anchor="end">${F.hm(LT.sleep.duration(n))}</text>`;
  });
  return `<svg class="yarn" viewBox="0 0 ${W} ${top + nights.length * rh + 2}" style="width:100%;height:auto;display:block" role="img" aria-label="Sleep timeline as tape strips">${s}</svg>`;
}

const SH = {};
SH.violin = S => {
  const f = S.sheet, Vn = LT.violin;

  let body, foot;
  if (f.step === 1) {
    const hint = { solo: 'just you', lesson: 'usually Thursday 16:00', orchestra: 'usually Thursday 17:15', trio: 'Elgar with the trio' };
    body = `<div class="opts">${Vn.TYPES.map(t => `<button class="opt ${f.typeId === t.id ? 'on' : ''}" data-a="vtype" data-v="${t.id}" style="--n:var(--violin)"><b>${t.name}</b><small>${hint[t.id]}</small></button>`).join('')}</div>`;
    foot = `<button class="btn paper block" data-a="close">Not now</button>`;
  } else if (f.step === 2) {
    body = (f.timer ? `<div style="text-align:center;display:grid;gap:8px"><b id="vtimer" class="big tnum">${S.clock(f.timerSec)}</b><div style="display:flex;gap:8px;justify-content:center"><button class="btn sm ${f.timerRunning ? 'paper' : 'c'}" data-a="vtimer">${f.timerRunning ? 'Pause' : f.timerSec ? 'Resume' : 'Start'}</button><button class="btn paper sm" data-a="vtimerdone" ${f.timerSec ? '' : 'disabled'}>Use this time</button></div></div>`
      : `<div class="bigmin"><button class="rnd" data-a="vmin" data-d="-5" aria-label="5 minutes less">−5</button><output class="tnum">${f.minutes}<small>minutes in total</small></output><button class="rnd" data-a="vmin" data-d="5" aria-label="5 minutes more">+5</button></div><div class="picks" style="justify-content:center">${[15, 20, 30, 45, 60, 90].map(m => `<button class="pk ${f.minutes === m ? 'on' : ''}" data-a="vset" data-v="${m}">${m}′</button>`).join('')}</div>`) +
      `<button class="tog" data-a="vtimermode"><span>Use a start/stop timer</span><span class="switchp ${f.timer ? 'on' : ''}"></span></button><p class="note-s">One total can cover several pieces.</p>`;
    foot = `<button class="btn paper" data-a="vback">Back</button><button class="btn c block" data-a="vnext">Next</button>`;
  } else {
    const alloc = Object.values(f.split).reduce((a, b) => a + b, 0);
    const pk = kind => Vn.pieces.filter(p => p.kind === kind).map(p => `<button class="pk ${f.items.includes(p.id) ? 'on' : ''}" data-a="vitem" data-v="${p.id}">${f.items.includes(p.id) ? '✓ ' : ''}${E(p.kind === 'piece' ? p.composer + ' · ' + p.title.split(' — ')[0].split(',')[0] : p.title)}</button>`).join('');
    body = `<p class="mid">${f.minutes} min of ${Vn.typeName(f.typeId).toLowerCase()}. What did you play?</p><div class="grp"><h4>pieces</h4><div class="picks">${pk('piece')}</div></div><div class="grp"><h4>scales</h4><div class="picks">${pk('scale')}</div></div>
      <button class="tog" data-a="vsplitmode" ${f.items.length > 1 ? '' : 'disabled style="opacity:.45"'}><span>Split time by piece <span class="dim">(optional)</span></span><span class="switchp ${f.splitOn ? 'on' : ''}"></span></button>
      ${f.splitOn && f.items.length > 1 ? `<div>${f.items.map(id => `<div class="kv"><span>${E(Vn.item(id).kind === 'piece' ? Vn.item(id).composer : Vn.item(id).title)}</span>${stepper('vsplit', (f.split[id] || 0) + ' min', 'minutes', `data-v="${id}"`)}</div>`).join('')}<p class="note-s ${alloc > f.minutes ? 'warn' : ''}" style="margin-top:6px">${alloc > f.minutes ? `${alloc - f.minutes} min more than the total.` : `${alloc} of ${f.minutes} min placed${alloc < f.minutes ? '; the rest stays unassigned' : ''}.`}</p></div>` : ''}
      ${f.noteOpen ? `<textarea id="vnote" data-in="notes" placeholder="A note for next time…">${E(f.notes)}</textarea>` : `<button class="pk" data-a="vnote" style="justify-self:start">+ add a note</button>`}`;
    foot = `<button class="btn paper" data-a="vback">Back</button><button class="btn c block" data-a="vsave" ${f.items.length && !(f.splitOn && alloc > f.minutes) ? '' : 'disabled'}>Stamp ${f.minutes} min</button>`;
  }
  return icard('Violin practice', `<div class="ic-b" data-sheet-body>${body}</div><div class="ic-f">${foot}</div>`, 'violin', steps);
};
SH.quick = S => icard('Log it', `<div class="ic-b" data-sheet-body><div class="opts">${[['violin', 'Violin', 'type · minutes · pieces'], ['gym', 'Gym', LT.state.gym.active ? 'carry on' : 'today’s sheet'], ['sleep', 'Last night', LT.sleep.lastNightLogged() ? 'pinned' : 'bed + wake'], ['screen', 'Screen time', LT.screen.todayLogged() ? 'pinned' : 'today’s total'], ['sports', 'Sport', 'run · ride · swim · court'], ['study', 'Study', 'subject + minutes'], ['chess', 'Chess', 'puzzles or study'], ['tasks', 'A to-do', 'for the list']].map(([id, t, s]) => `<button class="opt ${id === 'sleep' ? 'dark' : ''}" data-a="ql" data-v="${id}" style="--n:var(--${id === 'tasks' ? 'chess' : id})"><b>${t}</b><small>${s}</small></button>`).join('')}</div></div>`, 'screen');
SH.sport = S => {
  const f = S.sheet, K = LT.sports.kinds, end = ['running', 'cycling', 'swimming'].includes(f.sport);
  const metric = end ? (f.sport === 'running' ? F.pace(f.minutes, f.km) : f.sport === 'cycling' ? F.speed(f.minutes, f.km) : F.swim(f.minutes, f.km)) : '';
  return icard('Sport', `<div class="ic-b" data-sheet-body><div class="picks">${Object.keys(K).map(k => `<button class="pk ${f.sport === k ? 'on' : ''}" data-a="ssport" data-v="${k}">${K[k].name}</button>`).join('')}</div>
    <div class="kv"><span>Duration</span>${stepper('smin', F.dur(f.minutes), 'duration')}</div>
    ${end ? `<div class="kv"><span>Distance</span>${stepper('skm', f.km.toFixed(f.sport === 'swimming' ? 2 : 1) + ' km', 'distance')}</div><div class="kv"><span>${f.sport === 'cycling' ? 'Speed' : 'Pace'}, worked out</span><b class="type">${metric}</b></div>`
      : `<div class="kv"><span>Kind</span><span class="picks">${['Training', 'Match'].map(x => `<button class="pk ${f.kind === x ? 'on' : ''}" data-a="skind" data-v="${x}">${x}</button>`).join('')}</span></div>${f.kind === 'Match' ? `<input type="text" id="sscore" data-in="score" placeholder="score (optional)" value="${E(f.score)}">` : ''}`}
    <textarea id="snotes" data-in="notes" placeholder="${end ? 'route or notes (optional)' : 'skill notes (optional)'}">${E(f.notes)}</textarea></div>
    <div class="ic-f"><button class="btn paper" data-a="close">Cancel</button><button class="btn c block" data-a="ssave">Stamp it</button></div>`, 'sports');
};
SH.study = S => { const f = S.sheet; return icard('Study', `<div class="ic-b" data-sheet-body><div class="picks">${LT.study.subjects.map(s => `<button class="pk ${f.subject === s.id ? 'on' : ''}" data-a="stsub" data-v="${s.id}">${s.name}</button>`).join('')}</div><div class="kv"><span>Duration</span>${stepper('stmin', F.dur(f.minutes), 'duration')}</div><input type="text" id="sttopic" data-in="topic" placeholder="topic covered" value="${E(f.topic)}"></div><div class="ic-f"><button class="btn paper" data-a="close">Cancel</button><button class="btn c block" data-a="stsave">Stamp it</button></div>`, 'study'); };
SH.chess = S => { const f = S.sheet; return icard('Chess', `<div class="ic-b" data-sheet-body><div class="picks">${[['puzzles', 'Puzzles'], ['study', 'Study']].map(([k, l]) => `<button class="pk ${f.kind === k ? 'on' : ''}" data-a="chkind" data-v="${k}">${l}</button>`).join('')}</div><div class="kv"><span>Duration</span>${stepper('chmin', F.dur(f.minutes), 'duration')}</div>${f.kind === 'puzzles' ? `<div class="kv"><span>Solved</span>${stepper('chsolved', f.solved, 'puzzles solved')}</div>` : `<input type="text" id="chtopic" data-in="topic" placeholder="what you studied" value="${E(f.topic)}">`}<p class="note-s">Games would come from Chess.com; these are fictional samples.</p></div><div class="ic-f"><button class="btn paper" data-a="close">Cancel</button><button class="btn c block" data-a="chsave">Stamp it</button></div>`, 'chess'); };
SH.swap = S => { const e = LT.state.gym.active.exercises[S.sheet.ei]; return icard('Swap for today', `<div class="ic-b" data-sheet-body><p class="mid">Instead of ${E(e.name)}:</p><div class="lines">${e.alts.map(a => `<button class="ln" data-a="gswapto" data-v="${E(a)}" style="width:100%;text-align:left"><span>${E(a)}</span><span class="type" style="color:var(--red)">use →</span></button>`).join('')}</div></div>`, 'gym'); };
SH.finish = S => { const f = S.sheet; return icard('How did it feel?', `<div class="ic-b" data-sheet-body><p class="note-s">All optional. It helps plan around sport and recovery.</p>
  <div class="grp"><h4>effort out of 10</h4><div class="nums">${[5, 6, 7, 8, 9].map(v => `<button class="${f.effort === v ? 'on' : ''}" data-a="fin" data-f="effort" data-v="${v}">${v}</button>`).join('')}</div></div>
  <div class="grp"><h4>soreness 0–4</h4><div class="nums">${[0, 1, 2, 3, 4].map(v => `<button class="${f.soreness === v ? 'on' : ''}" data-a="fin" data-f="soreness" data-v="${v}">${v}</button>`).join('')}</div></div>
  <button class="tog" data-a="finpain"><span>Any pain? <span class="dim">e.g. shins</span></span><span class="switchp ${f.pain ? 'on' : ''}"></span></button>
  ${f.pain ? `<input type="text" id="painnote" data-in="painNote" placeholder="where, and what made it worse?" value="${E(f.painNote)}">` : ''}</div>
  <div class="ic-f"><button class="btn paper" data-a="close">Back</button><button class="btn c block" data-a="gdone">Stamp the sheet</button></div>`, 'gym'); };
SH.ev = S => {
  const f = S.sheet, o = f.occ, s = LT.section(o.section);
  return icard(o.title, `<div class="ic-b" data-sheet-body><p class="type small mid">${s ? s.name : 'General'} · ${F.date(o.date)}${o.start ? ' · ' + o.start + '–' + o.end : ''}${o.recurring ? ' · weekly' : ''}</p>
    ${o.conflict && !o.cancelled ? `<div class="alert" style="margin:0"><b>Clash</b> with ${E(o.conflictWith.join(', '))}. You choose what moves.</div>` : ''}
    ${o.status === 'done' ? `<p class="note-s">Done: ${E(o.logged.title)}</p>` : ''}
    ${o.cancelled ? `<button class="btn block" data-a="evrestore">Put it back</button>` : `
    <div class="kv"><span>Day</span>${stepper('evd', F.date(f.date), 'date')}</div>${o.start ? `<div class="kv"><span>Starts</span>${stepper('evt', f.start, 'start time')}</div>` : ''}
    ${o.recurring ? `<div class="grp"><h4>change</h4><div class="opts"><button class="opt ${f.scope === 'one' ? 'on' : ''}" data-a="evscope" data-v="one" style="--n:var(--card);min-height:64px"><b>Just this one</b><small>${F.date(o.origDate)}</small></button><button class="opt ${f.scope === 'future' ? 'on' : ''}" data-a="evscope" data-v="future" style="--n:var(--card);min-height:64px"><b>This and later</b><small>changes the series</small></button></div></div>` : ''}
    <div style="display:flex;gap:8px"><button class="btn paper" data-a="evcancel" style="color:var(--red)">Cancel ${o.recurring && f.scope === 'future' ? 'from here' : 'it'}</button><button class="btn c" data-a="evsave" style="flex:1">Save</button></div>`}
    <p class="sample">${E(LT.LABELS.google)}</p></div>`, o.section || 'chess');
};
SH.task = S => { const f = S.sheet; return icard('New to-do', `<div class="ic-b" data-sheet-body><input type="text" id="tasktitle" data-in="title" placeholder="what needs doing?" value="${E(f.title)}" aria-label="Task">
  <div class="grp"><h4>section</h4><div class="picks"><button class="pk ${!f.section ? 'on' : ''}" data-a="tsec" data-v="">none</button>${LT.SECTIONS.map(s => `<button class="pk ${f.section === s.id ? 'on' : ''}" data-a="tsec" data-v="${s.id}" style="${cv(s.id)}">${s.name}</button>`).join('')}</div></div>
  <div class="grp"><h4>priority</h4><div class="picks">${['high', 'medium', 'low'].map(p => `<button class="pk ${f.priority === p ? 'on' : ''}" data-a="tpri" data-v="${p}">${p}</button>`).join('')}</div></div>
  <div class="grp"><h4>due</h4><div class="picks">${[['', 'no date'], [T, 'today'], [D.addDays(T, 1), 'tomorrow'], [D.addDays(T, 7), 'next week']].map(([d, l]) => `<button class="pk ${f.due === d ? 'on' : ''}" data-a="tdue" data-v="${d}">${l}</button>`).join('')}</div></div></div>
  <div class="ic-f"><button class="btn paper" data-a="close">Cancel</button><button class="btn block" data-a="tsave">Add to the list</button></div>`, 'chess'); };
SH.addev = S => { const f = S.sheet; return icard('Add to planner', `<div class="ic-b" data-sheet-body><input type="text" id="evtitle" data-in="title" placeholder="what is it?" value="${E(f.title)}" aria-label="Event title"><div class="picks">${LT.SECTIONS.map(s => `<button class="pk ${f.section === s.id ? 'on' : ''}" data-a="aesec" data-v="${s.id}" style="${cv(s.id)}">${s.name}</button>`).join('')}</div><div class="kv"><span>Day</span>${stepper('aed', F.date(f.date), 'date')}</div><div class="kv"><span>Starts</span>${stepper('aet', f.start, 'start time')}</div></div><div class="ic-f"><button class="btn paper" data-a="close">Cancel</button><button class="btn block" data-a="aesave">Pin it</button></div>`, 'chess'); };

/* ---------- reward ---------- */
function reward(r) {
  const O = LT.overall();
  const conf = LT.reduced() ? '' : Array.from({ length: 22 }, (_, i) => `<span class="confetti" aria-hidden="true" style="left:${(i * 37) % 100}%;background:${['#F5E27C', '#F4BCC6', '#BCD6F2', '#BFE3CB', '#F7C38E', '#D9C9F1'][i % 6]};animation-delay:${(i % 7) * .08}s;transform:rotate(${i * 23}deg)"></span>`).join('');
  const evo = r.evolved ? `<div class="develop"><div class="ph">${fox(r.evolved.to, { still: true, happy: true })}</div></div><p class="msg">${STAGE[r.evolved.from]} → ${STAGE[r.evolved.to]}</p><span class="ribbon">Level ${r.overallUp.to} · new look</span><p class="note-s">A new photo for the scrapbook, earned over months.</p>` : '';
  return `<div class="reward" data-reward role="dialog" aria-modal="true" aria-label="Reward">${r.evolved || r.sectionUps.length || r.overallUp ? conf : ''}<div class="card">
    ${r.rest ? `<div style="width:110px;margin:0 auto">${fox(O.stage, { still: true, happy: true })}</div><p class="msg">Rest day pinned</p><p class="note-s">Streak kept: ${r.streak} days. Recovery counts.</p>` : `
    ${evo || `<div style="width:96px;margin:0 auto">${fox(O.stage, { still: true, happy: true })}</div>`}
    ${r.preview ? '<span class="sticker" style="justify-self:center;background:var(--screen)">preview only</span>' : `<div class="stamp tnum">+${r.total} XP</div><ul>${r.lines.map(l => `<li><span>${E(l.reason)}</span><b>+${l.xp}</b></li>`).join('')}</ul>`}`}
    ${r.sectionUps.map(u => `<span class="ribbon">${E(u.name)} → Level ${u.to}</span>`).join('')}
    ${r.overallUp && !r.evolved ? `<span class="ribbon">Level ${r.overallUp.to}</span>` : ''}
    ${(r.unlocked || []).map(a => `<p class="msg" style="font-size:18px">New badge: ${E(a.title)}</p><p class="note-s">${E(a.desc)}</p>`).join('')}
    ${r.pain ? '<p class="note-s warn" style="text-align:left">You noted pain. Consider resting or easing the next session, and talk to a coach or physio if it keeps happening.</p>' : ''}
    ${r.streakUp ? `<p class="note-s">★ ${r.streak} day streak</p>` : ''}
    <button class="btn block" data-a="rclose">Pin it to the board</button></div></div>`;
}

const shell = Shell({
  key: 'pinboard', views: V, sheets: SH, reward,
  restBar: (left, S) => `<div class="restbar" role="status"><span class="grow">rest</span><b class="tnum">${S.clock(left)}</b><button data-a="rest30">+30s</button><button data-a="restskip">skip</button></div>`,
  pokeLines: () => { const O = LT.overall(), st = LT.streak(); return [`${st.n} days in a row! Rest days count too.`, `${O.toNext} XP until Level ${O.level + 1}.`, `${LT.violin.weekTotal()} of ${LT.state.violin.target} violin minutes so far.`, 'Lower A at 10:00. Bag’s packed.']; },
  onPoke: S => { S.ui.jig = true; S.render(true); setTimeout(() => { S.ui.jig = false; }, 520); },
  afterRender: (S, keep) => { if (S.ui.view === 'calendar' && !keep) { const p = document.getElementById('planner'), t = document.getElementById('todaycol'); if (p && t) p.scrollLeft = t.offsetLeft - p.offsetLeft - 4; } },
});
})();
</script>
