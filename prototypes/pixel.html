<title>LifeTracker Pixel Isle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: a 1-bit island map. The hero stands in the centre of a 3×3 grid; the eight buildings around it are the sections.
   Mostly black and white with dithering; colour appears only as small accents (XP gold, streak red, window lights).
   A deliberate single look; the sleep section inverts to white-on-black. */
:root {
  --paper: #E4E1D6; --paper-2: #D3D0C4; --ink: #1D1C19; --ink-2: #4A4740; --ink-3: #7A766C;
  --gold: #E5A823; --red: #D2432F; --green: #4E9A4A; --blue: #3C6FC4;
  --violin: #D2862F; --coding: #3C6FC4; --sports: #4E9A4A; --gym: #D2432F; --study: #8A5BC4; --chess: #9B8A5A; --sleep: #5466B8; --screen: #C24E8E;
  --px: "Pixelify Sans", "Courier New", ui-monospace, monospace;
  --label: "Silkscreen", "Courier New", ui-monospace, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--px); -webkit-tap-highlight-color: transparent; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.tnum { font-variant-numeric: tabular-nums; }
.lbl { font-family: var(--label); font-size: 12px; letter-spacing: .02em; text-transform: uppercase; }
.dim { color: var(--ink-3); } .mid { color: var(--ink-2); } .sm { font-size: 15px; }
svg.px { shape-rendering: crispEdges; image-rendering: pixelated; display: block; }

.app { max-width: 520px; margin: 0 auto; min-height: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px calc(100px + env(safe-area-inset-bottom, 0px)); }
.view { animation: blink-in .22s steps(4); }
@keyframes blink-in { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }

/* pixel boxes */
.box { position: relative; border: 3px solid var(--ink); background: var(--paper); padding: 12px; clip-path: polygon(3px 0, calc(100% - 3px) 0, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 0 calc(100% - 3px), 0 3px); }
.box.dbl { box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 5px var(--ink); padding: 14px; }
.box.ink { background: var(--ink); color: var(--paper); }
.dither { background-image: radial-gradient(var(--ink) 0.9px, transparent 1.1px); background-size: 4px 4px; }
.title-strip { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 22px 0 8px; }
.title-strip h2 { font-family: var(--label); font-size: 15px; font-weight: 700; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.title-strip h2::before { content: ""; width: 10px; height: 10px; background: var(--ink); }
.title-strip button { font-family: var(--label); font-size: 12px; text-transform: uppercase; min-height: 36px; padding: 0 6px; text-decoration: underline; text-underline-offset: 3px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 16px; background: var(--ink); color: var(--paper); font-family: var(--label); font-size: 14px; text-transform: uppercase; letter-spacing: .02em; box-shadow: 0 4px 0 var(--ink-2); clip-path: polygon(3px 0, calc(100% - 3px) 0, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 0 calc(100% - 3px), 0 3px); transform: translateY(-2px); }
.btn:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--ink-2); }
.btn.light { background: var(--paper); color: var(--ink); border: 3px solid var(--ink); box-shadow: none; transform: none; }
.btn.gold { background: var(--gold); color: var(--ink); box-shadow: 0 4px 0 var(--ink); }
.btn.block { width: 100%; }
.btn.sm { min-height: 40px; font-size: 12px; padding: 0 10px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.sample { font-family: var(--label); font-size: 10.5px; color: var(--ink-3); text-transform: uppercase; display: inline-flex; gap: 6px; align-items: center; line-height: 1.3; }
.sample::before { content: "?"; display: inline-grid; place-items: center; width: 13px; height: 13px; background: var(--ink-3); color: var(--paper); font-size: 9px; flex: none; }

/* HUD */
.hud { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.hud .lv { font-family: var(--label); font-weight: 700; font-size: 20px; line-height: 1; }
.blocks { display: grid; grid-template-columns: repeat(var(--n, 10), 1fr); gap: 2px; height: 14px; border: 2px solid var(--ink); padding: 2px; background: var(--paper); }
.blocks i { background: transparent; }
.blocks i.on { background: var(--ink); }
.blocks i.gold { background: var(--gold); }
.streak { display: inline-flex; align-items: center; gap: 4px; font-family: var(--label); font-weight: 700; font-size: 18px; }
.hud-sub { display: flex; justify-content: space-between; margin-top: 4px; font-size: 13.5px; color: var(--ink-2); gap: 8px; }

/* island map */
.map { margin-top: 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: 108px 168px 108px; gap: 6px; padding: 8px; border: 3px solid var(--ink); position: relative;
  background-color: var(--paper); background-image: radial-gradient(var(--ink-3) 0.8px, transparent 1px); background-size: 8px 8px; background-position: 2px 2px; }
.tile { min-width: 0; min-height: 0; display: grid; grid-template-rows: 1fr auto; justify-items: center; align-items: end; padding: 4px 2px 6px; background: var(--paper); border: 2px solid var(--ink); position: relative; }
.tile:active { transform: translateY(2px); }
.tile svg { width: auto; height: 100%; max-width: 80%; min-height: 0; }
.tile > svg { align-self: center; }
.tile .nm { font-family: var(--label); font-size: 11px; font-weight: 700; line-height: 1; text-transform: uppercase; margin-top: 2px; }
.tile .lv { position: absolute; top: 3px; left: 4px; font-family: var(--label); font-size: 10px; color: var(--ink-2); }
.tile .gem { position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; background: var(--c); }
.tile.center { border-style: dashed; background: transparent; padding: 2px; display: block; overflow: visible; }
.tile.center .hero { display: grid; grid-template-rows: minmax(0, 1fr) auto; justify-items: center; width: 100%; height: 100%; }
.hero svg { height: 100%; width: auto; max-width: 100%; }
.bob { animation: bob 1s steps(2) infinite; }
@keyframes bob { 50% { transform: translateY(3%); } }
.hero.jump .bob { animation: jump .4s steps(4); }
@keyframes jump { 50% { transform: translateY(-14%); } }
.speech { position: absolute; z-index: 5; left: 50%; bottom: 96%; transform: translateX(-50%); width: 190px; background: var(--paper); border: 3px solid var(--ink); padding: 6px 8px; font-size: 14px; line-height: 1.3; text-align: left; animation: blink-in .2s steps(3); }
.speech::after { content: ""; position: absolute; left: 50%; top: 100%; width: 10px; height: 8px; background: var(--ink); clip-path: polygon(0 0, 100% 0, 50% 100%); transform: translateX(-50%); }
.stage-nm { font-family: var(--label); font-size: 10px; text-transform: uppercase; margin-top: 2px; }

/* quest log (today) */
.qlog { margin-top: 12px; }
.qlog .row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 8px; align-items: center; min-height: 40px; border-bottom: 2px dotted var(--ink-3); font-size: 15.5px; }
.qlog .row:last-child { border-bottom: 0; }
.qlog .t { font-family: var(--label); font-size: 11px; color: var(--ink-2); }
.qlog .ttl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sq { width: 26px; height: 26px; border: 3px solid var(--ink); display: grid; place-items: center; background: var(--paper); flex: none; }
.sq.on { background: var(--ink); }
.sq.on::after { content: ""; width: 10px; height: 6px; border-left: 3px solid var(--gold); border-bottom: 3px solid var(--gold); transform: rotate(-45deg) translate(1px, -1px); }
.chk-hit { min-width: 44px; min-height: 44px; display: grid; place-items: center; }

/* command bar */
.cmd { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--ink); color: var(--paper); padding: 8px max(10px, env(safe-area-inset-left, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-right, 0px)); }
.cmd .in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; gap: 4px; }
.cmd button { min-height: 54px; display: grid; justify-items: center; align-content: center; gap: 4px; font-family: var(--label); font-size: 10.5px; text-transform: uppercase; color: var(--paper-2); }
.cmd button svg { width: 24px; height: 24px; }
.cmd button.on { color: var(--gold); }
.cmd .a-btn { width: 58px; height: 58px; border-radius: 50%; background: var(--gold); color: var(--ink); justify-self: center; font-size: 22px; font-family: var(--label); font-weight: 700; box-shadow: inset -3px -4px 0 rgba(0,0,0,.25); }
.cmd .a-btn:active { box-shadow: inset 2px 2px 0 rgba(0,0,0,.25); }

/* section rooms */
.room-head { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 8px; margin-bottom: 10px; }
.back { width: 44px; height: 44px; display: grid; place-items: center; border: 3px solid var(--ink); font-family: var(--label); font-size: 18px; }
.room-head h1 { font-family: var(--label); font-size: 22px; font-weight: 700; text-transform: uppercase; line-height: 1; }
.room-head .sub { font-size: 13.5px; color: var(--ink-2); margin-top: 3px; }
.room-head svg { width: 48px; height: 48px; }
.statrow { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.pill { font-family: var(--label); font-size: 11px; text-transform: uppercase; border: 2px solid var(--ink); padding: 4px 7px; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.pill.inv { background: var(--ink); color: var(--paper); }
.pill.gold { background: var(--gold); border-color: var(--ink); }
.pill.red { color: var(--red); border-color: var(--red); }
.big { font-family: var(--label); font-weight: 700; font-size: 34px; line-height: 1; letter-spacing: -.02em; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kv { border: 3px solid var(--ink); padding: 8px 10px; display: grid; gap: 2px; }
.kv b { font-family: var(--label); font-size: 20px; line-height: 1.1; }
.kv span { font-size: 13.5px; color: var(--ink-2); line-height: 1.25; }
.list .it { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 9px 0; border-bottom: 2px solid var(--ink); min-height: 48px; }
.list .it:last-child { border-bottom: 0; }
.list .it small { display: block; font-size: 13.5px; color: var(--ink-2); line-height: 1.3; }
.list .it .r { font-family: var(--label); font-size: 13px; text-align: right; }
.list .it.fresh { animation: flash .9s steps(6); }
@keyframes flash { 0%, 33%, 66% { background: var(--gold); } 16%, 50%, 100% { background: transparent; } }
.cursor-list button { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 6px; align-items: center; min-height: 48px; width: 100%; padding: 4px 4px; border-bottom: 2px dotted var(--ink-3); text-align: left; }
.cursor-list button::before { content: ""; width: 0; height: 0; border-left: 8px solid transparent; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
.cursor-list button.on::before, .cursor-list button:hover::before { border-left-color: var(--ink); }
.cursor-list button.on { background: var(--ink); color: var(--paper); }
.cursor-list button.on::before { border-left-color: var(--gold); }
.cursor-list small { font-size: 13px; opacity: .75; }
.tabs { display: flex; gap: 0; overflow-x: auto; border: 3px solid var(--ink); scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: 1 0 auto; min-height: 42px; padding: 0 10px; font-family: var(--label); font-size: 11.5px; text-transform: uppercase; border-left: 2px solid var(--ink); white-space: nowrap; }
.tabs button:first-child { border-left: 0; }
.tabs button.on { background: var(--ink); color: var(--paper); }
.tabs.wrap { flex-wrap: wrap; }
.charts svg { width: 100%; height: auto; display: block; }
.pxc text { font-family: var(--label); font-size: 9px; fill: var(--ink-2); text-transform: uppercase; }
.pxc .hi { fill: var(--ink); }
.dots { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 3px; }
.dots i { aspect-ratio: 1; border: 2px solid var(--ink); }
.dots i.l1 { background-image: radial-gradient(var(--ink) 0.9px, transparent 1.1px); background-size: 3px 3px; }
.dots i.l2 { background: var(--ink-2); }
.dots i.l3 { background: var(--ink); }
.dots i.now { border-color: var(--gold); }

/* gym */
.set { display: grid; grid-template-columns: 24px 1fr 1fr 48px; gap: 6px; align-items: center; min-height: 52px; }
.set .n { font-family: var(--label); font-size: 13px; }
.adj { display: flex; align-items: center; justify-content: space-between; border: 2px solid var(--ink); height: 44px; }
.adj button { width: 34px; height: 40px; font-family: var(--label); font-size: 16px; }
.adj output { font-family: var(--label); font-size: 13px; text-align: center; flex: 1; }
.set.done .adj { background-image: radial-gradient(var(--ink-3) 0.8px, transparent 1px); background-size: 4px 4px; }
.done-sq { width: 48px; height: 44px; border: 3px solid var(--ink); display: grid; place-items: center; }
.done-sq.on { background: var(--ink); }
.done-sq.on::after { content: ""; width: 14px; height: 8px; border-left: 4px solid var(--gold); border-bottom: 4px solid var(--gold); transform: rotate(-45deg) translate(1px, -2px); }
.ex { margin-top: 10px; }
.ex-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
.ex-h b { font-family: var(--label); font-size: 14px; text-transform: uppercase; }
.week7 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 3px solid var(--ink); }
.week7 > div { min-height: 78px; border-left: 2px solid var(--ink); padding: 3px 2px; display: grid; align-content: start; justify-items: center; gap: 2px; text-align: center; font-size: 11px; line-height: 1.1; }
.week7 > div:first-child { border-left: 0; }
.week7 .d { font-family: var(--label); font-size: 10px; }
.week7 .g { background: var(--ink); color: var(--paper); font-family: var(--label); font-size: 9px; padding: 2px 3px; }
.week7 .g.done { background: var(--gold); color: var(--ink); }
.week7 .s { font-family: var(--label); font-size: 9px; border: 1px solid var(--ink); padding: 1px 2px; }
.week7 .now { background-image: radial-gradient(var(--ink-3) 0.7px, transparent 0.9px); background-size: 4px 4px; }
.restbar { position: fixed; z-index: 25; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); max-width: 488px; margin: 0 auto; background: var(--paper); border: 3px solid var(--ink); padding: 8px 10px; display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center; }
.restbar b { font-family: var(--label); font-size: 22px; }
.restbar .hg { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; height: 12px; border: 2px solid var(--ink); padding: 1px; }
.restbar .hg i.on { background: var(--ink); }

/* sleep (inverted) */
.night { background: var(--ink); color: var(--paper); margin: -12px calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0; padding: 12px max(16px, env(safe-area-inset-left, 0px)) 30px; min-height: calc(100vh - 80px); }
.night .back { border-color: var(--paper); }
.night .room-head .sub, .night .mid, .night .dim { color: var(--paper-2); }
.night .box { background: var(--ink); border-color: var(--paper); color: var(--paper); }
.night .pill { border-color: var(--paper); }
.night .kv { border-color: var(--paper); }
.night .kv span { color: var(--paper-2); }
.night .btn { background: var(--paper); color: var(--ink); box-shadow: 0 4px 0 var(--ink-3); }
.night .btn.light { background: var(--ink); color: var(--paper); border-color: var(--paper); }
.night .title-strip h2::before { background: var(--paper); }
.night .list .it { border-color: var(--paper-2); }
.night .list .it small { color: var(--paper-2); }
.night .adj { border-color: var(--paper); }
.night .sample { color: var(--paper-2); } .night .sample::before { background: var(--paper-2); color: var(--ink); }
.clock2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.clock2 > div { border: 3px solid var(--paper); padding: 8px; display: grid; justify-items: center; gap: 6px; }
.clock2 .tv { font-family: var(--label); font-size: 30px; font-weight: 700; }
.clock2 .r { display: flex; gap: 6px; }
.clock2 button, .nbtn { min-width: 46px; min-height: 40px; border: 2px solid var(--paper); font-family: var(--label); font-size: 12px; color: var(--paper); }
.tlx text { font-family: var(--label); font-size: 9px; fill: var(--paper-2); }
.tlx .d { fill: var(--paper); }
.switch { width: 54px; height: 30px; border: 3px solid currentColor; position: relative; flex: none; display: inline-block; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; background: currentColor; opacity: .35; }
.switch.on::after { left: 27px; opacity: 1; background: var(--gold); }

/* road */
.road { display: grid; gap: 0; }
.road .st { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 8px; align-items: center; min-height: 42px; position: relative; }
.road .st::before { content: ""; position: absolute; left: 13px; top: 0; bottom: 0; width: 4px; background-image: linear-gradient(var(--ink) 50%, transparent 50%); background-size: 4px 8px; }
.road .st:first-child::before { top: 50%; } .road .st:last-child::before { bottom: 50%; }
.road .nd { width: 30px; height: 30px; border: 3px solid var(--ink); background: var(--paper); z-index: 1; display: grid; place-items: center; font-family: var(--label); font-size: 13px; }
.road .done .nd { background: var(--ink); color: var(--gold); }
.road .current .nd { background: var(--gold); }
.road .goal .nd { background: var(--red); color: var(--paper); }
.road .next .t, .road .goal .t { color: var(--ink-2); }

/* calendar month */
.month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 3px solid var(--ink); }
.month .hd { font-family: var(--label); font-size: 10px; text-align: center; padding: 4px 0; background: var(--ink); color: var(--paper); }
.month .c { min-height: 54px; border-left: 2px solid var(--ink); border-top: 2px solid var(--ink); padding: 2px 3px; display: grid; align-content: start; gap: 2px; text-align: left; }
.month .c:nth-child(7n+1) { border-left: 0; }
.month .c b { font-family: var(--label); font-size: 11px; }
.month .c.out { color: var(--ink-3); background-image: radial-gradient(var(--paper-2) 1px, transparent 1.2px); background-size: 4px 4px; }
.month .c.sel { background: var(--ink); color: var(--paper); }
.month .c.today b { background: var(--gold); color: var(--ink); padding: 0 2px; }
.month .c .mk { display: flex; flex-wrap: wrap; gap: 2px; }
.month .c .mk i { width: 6px; height: 6px; background: currentColor; }
.month .c .mk i.p { background: transparent; border: 1.5px solid currentColor; }
.month .c .mk i.x { background: var(--red); }
.evr { display: grid; grid-template-columns: 50px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 0; min-height: 52px; border-bottom: 2px solid var(--ink); width: 100%; text-align: left; }
.evr .tm { font-family: var(--label); font-size: 12px; }
.evr .ti small { display: block; font-size: 13px; color: var(--ink-2); }
.evr .tag { font-family: var(--label); font-size: 10px; border: 2px solid var(--ink); padding: 2px 5px; white-space: nowrap; }
.evr.done .tag { background: var(--ink); color: var(--paper); }
.evr.planned .tag { border-style: dashed; }
.evr .tag.clash { border-color: var(--red); color: var(--red); border-style: solid; }
.evr.cancelled .ti { text-decoration: line-through; color: var(--ink-3); }
.warn { border: 3px solid var(--red); padding: 10px; color: var(--ink); display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 15px; margin: 10px 0; }
.warn::before { content: "!"; width: 22px; height: 22px; background: var(--red); color: var(--paper); font-family: var(--label); display: grid; place-items: center; font-weight: 700; }

/* tasks */
.quest { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 6px; align-items: center; min-height: 56px; border-bottom: 2px solid var(--ink); }
.quest.done .qt { text-decoration: line-through; color: var(--ink-3); }
.quest small { display: block; font-size: 13px; color: var(--ink-2); }
.prio { font-family: var(--label); font-weight: 700; font-size: 14px; }
.prio.high { color: var(--red); }

/* hero sheet */
.lineup { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; align-items: end; text-align: center; }
.lineup svg { width: 100%; height: auto; }
.lineup b { font-family: var(--label); font-size: 9.5px; display: block; text-transform: uppercase; }
.lineup small { font-size: 11px; color: var(--ink-2); display: block; line-height: 1.2; }
.lineup .cur b { color: var(--ink); background: var(--gold); }
.statline { display: grid; grid-template-columns: 74px minmax(0, 1fr) 44px; gap: 8px; align-items: center; min-height: 44px; width: 100%; text-align: left; }

<script>
(() => {
'use strict';
const E = LT.esc, F = LT.fmt, D = LT.date, T = LT.TODAY;

/* ---------- pixel renderer ----------
   K ink · W paper · D dither (checker of ink/paper) · G gold · R red · C section accent · . transparent */
const PAL = { K: 'var(--ink)', W: 'var(--paper)', G: 'var(--gold)', R: 'var(--red)', S: 'var(--ink-2)' };
function sprite(rows, opts = {}) {
  const h = rows.length, w = rows[0].length; let r = '';
  for (let y = 0; y < h; y++) {
    let x = 0;
    while (x < w) {
      let ch = rows[y][x];
      if (ch === 'D') ch = (x + y) % 2 ? 'W' : 'K';
      if (ch === '.') { x++; continue; }
      let x2 = x + 1;
      while (x2 < w) { let c2 = rows[y][x2]; if (c2 === 'D') c2 = (x2 + y) % 2 ? 'W' : 'K'; if (c2 !== ch) break; x2++; }
      const fill = ch === 'C' ? (opts.accent || 'var(--gold)') : PAL[ch] || 'var(--ink)';
      r += `<rect x="${x}" y="${y}" width="${x2 - x}" height="1" fill="${opts.invert && ch === 'K' ? 'var(--paper)' : opts.invert && ch === 'W' ? 'var(--ink)' : opts.silhouette && ch !== '.' ? 'var(--ink)' : fill}"/>`;
      x = x2;
    }
  }
  return `<svg class="px" viewBox="0 0 ${w} ${h}" ${opts.label ? `role="img" aria-label="${opts.label}"` : 'aria-hidden="true"'}>${opts.wrap ? `<g class="${opts.wrap}">${r}</g>` : r}</svg>`;
}
const layer = (base, ...overs) => base.map((row, y) => row.split('').map((c, x) => { let o = c; overs.forEach(ov => { const ch = ov[y] && ov[y][x]; if (ch && ch !== '.') o = ch; }); return o; }).join(''));

/* hero: 16×20 */
const BLANK = Array(20).fill('................');
const BASE = [
  '................', '................', '................',
  '.....KKKKKK.....', '....KWWWWWWK....', '...KWWWWWWWWK...', '...KWWWWWWWWK...', '...KWKWWWWKWK...', '...KWKWWWWKWK...', '...KWWWWWWWWK...', '....KWWKKWWK....', '.....KKKKKK.....',
  '....KDDDDDDK....', '...KWKDDDDKWK...', '...KWKDDDDKWK...', '....KKDDDDKK....', '.....KDDDDK.....', '.....KWKKWK.....', '.....KWKKWK.....', '....KKK..KKK....'];
const CAP = ['................', '................', '.....KKKKKK.....', '....KDDDDDDK....', '...KKKKKKKKKKK..'];
const SCARF = [...Array(11).fill('................'), '....KRRRRRRK....', '.......RR.......'];
const CAPE = [...Array(12).fill('................'), '..KK........KK..', '..KD........DK..', '..KD........DK..', '..KD........DK..', '..KDD......DDK..', '..KDD......DDK..', '..KKK......KKK..'];
const CAPE_R = CAPE.map(r => r.replace(/D/g, 'R'));
const STAFF = [...Array(5).fill('................'), '..............G.', '.............GKG', '..............G.', ...Array(12).fill('..............K.')];
const HELM = ['........RR......', '.......RR.......', '.....KKKKKK.....', '....KSSSSSSK....', '...KKKKKKKKKK...'];
const SHIELD = [...Array(12).fill('................'), 'KKKK............', 'KGGK............', 'KGGK............', '.KK.............'];
const CROWN = ['....G..G..G.....', '....GGGGGGG.....', '....GKGGGKG.....', '...KKKKKKKKKK...'];
const SPARK = ['G..............G', '................', '................', '................', '................', '................', '...............G', 'G...............'];
const HERO_STAGES = [
  layer(BASE),
  layer(BASE, CAP, SCARF),
  layer(BLANK, CAPE, BASE, CAP, SCARF, STAFF),
  layer(BLANK, CAPE, BASE, HELM, SCARF, STAFF, SHIELD),
  layer(BLANK, CAPE_R, BASE, CROWN, SCARF, STAFF, SHIELD, SPARK),
];
const STAGE = ['Novice', 'Wanderer', 'Ranger', 'Champion', 'Legend'];
const hero = (stage, o = {}) => sprite(HERO_STAGES[stage], { label: o.still ? undefined : `${STAGE[stage]}, your hero`, wrap: o.still ? '' : 'bob', silhouette: o.silhouette, invert: o.invert });

/* buildings: 14×14 with a 5×5 emblem */
const EMB = {
  violin: ['..KK.', '..K.K', '..K..', 'KKK..', 'KK...'],
  coding: ['K....', '.K...', '..K..', '.K...', 'K.KKK'],
  sports: ['.KKK.', 'K.K.K', 'KKKKK', 'K.K.K', '.KKK.'],
  gym: ['K...K', 'K...K', 'KKKKK', 'K...K', 'K...K'],
  study: ['KK.KK', 'K.K.K', 'K.K.K', 'K.K.K', 'KKKKK'],
  chess: ['K.K.K', 'KKKKK', '.KKK.', '.KKK.', 'KKKKK'],
  sleep: ['.KKK.', 'KK...', 'K....', 'KK...', '.KKK.'],
  screen: ['KKKKK', 'K...K', 'K...K', 'K...K', 'KKKKK'],
};
const ROOFS = {
  gable: ['......KK......', '.....KDDK.....', '....KDDDDK....', '...KDDDDDDK...', '..KDDDDDDDDK..', '.KKKKKKKKKKKK.'],
  tower: ['..K.K....K.K..', '..KKK....KKK..', '..KDK....KDK..', '..KDKKKKKKDK..', '..KDDDDDDDDK..', '.KKKKKKKKKKKK.'],
  dome: ['......CC......', '.....KKKK.....', '....KDDDDK....', '...KDDDDDDK...', '..KDDDDDDDDK..', '.KKKKKKKKKKKK.'],
  flat: ['..............', '..........KK..', '..........KK..', '.KKKKKKKKKKKK.', '.KDDDDDDDDDDK.', '.KKKKKKKKKKKK.'],
};
const BLD = { violin: 'gable', coding: 'tower', sports: 'flat', gym: 'flat', study: 'gable', chess: 'tower', sleep: 'gable', screen: 'dome' };
function building(id) {
  const roof = ROOFS[BLD[id]];
  const body = ['.KWWWWWWWWWWK.', '.KWWWWWWWWWWK.', '.KWWWWWWWWWWK.', '.KWWWWWWWWWWK.', '.KWWWWWWWWWWK.', '.KCWWWWWWWWCK.', '.KWWWWKKWWWWK.', '.KKKKKKKKKKKK.'];
  const rows = [...roof, ...body].map(r => r.split(''));
  EMB[id].forEach((er, y) => er.split('').forEach((c, x) => { if (c === 'K') rows[6 + y][4 + x + 1] = 'K'; }));
  return sprite(rows.map(r => r.join('')), { accent: `var(--${id})` });
}
const flame = (size = 18) => `<span style="width:${size}px;display:inline-block">${sprite(['...R....', '..RR....', '..RRR.R.', '.RRGRRR.', '.RGGGRR.', 'RRGGGGRR', '.RGGGGR.', '..RRRR..'])}</span>`;
const trophy = on => sprite(['.GGGGGG.', 'GGGGGGGG', 'G.GGGG.G', '.GGGGGG.', '..GGGG..', '...GG...', '..KKKK..', '.KKKKKK.'].map(r => on ? r : r.replace(/G/g, 'D')));

/* ---------- small builders ---------- */
const blocks = (pct, n = 10, cls = 'on') => `<span class="blocks" style="--n:${n}" role="progressbar" aria-valuenow="${Math.round(pct * 100)}" aria-valuemin="0" aria-valuemax="100">${Array.from({ length: n }, (_, i) => `<i class="${i < Math.round(pct * n) ? cls : ''}"></i>`).join('')}</span>`;
const stepper = (act, val, label, extra = '') => `<span class="stepper" role="group" aria-label="${label}"><button data-a="${act}" data-d="-1" ${extra} aria-label="Decrease ${label}">−</button><output>${val}</output><button data-a="${act}" data-d="1" ${extra} aria-label="Increase ${label}">+</button></span>`;
const strip = (t, right = '') => `<div class="title-strip"><h2>${t}</h2>${right}</div>`;
function room(id, sub) {
  const s = LT.section(id), L = LT.level(id), st = LT.sectionStreak(id);
  return `<div class="room-head"><button class="back" data-a="home" aria-label="Back to the map">◀</button><div><h1>${s.full}</h1><div class="sub">${sub}</div></div>${building(id)}</div>
  <div class="statrow"><span class="pill inv">LV ${L.level}</span><span class="pill">${L.into}/${L.need} XP</span>${st.n ? `<span class="pill">${flame(12)} ${st.n} ${st.label}</span>` : ''}</div>`;
}
// pixel block chart: one block = `per` units
function blockChart(values, labels, { per = 30, target = null, hi = [], unit = 'min', h = 10 } = {}) {
  const cols = values.length, cw = 10, gap = 3, W = cols * (cw + gap) + 26, rows = Math.max(h, Math.ceil(Math.max(...values, target || 0) / per));
  const H = rows * 5 + 14; let s = '';
  values.forEach((v, i) => {
    const n = Math.round(v / per), x = 24 + i * (cw + gap);
    for (let k = 0; k < n; k++) {
      const y = H - 12 - (k + 1) * 5;
      const fill = hi.includes(i) ? 'var(--gold)' : target && v >= target ? 'var(--ink)' : 'url(#dith)';
      s += `<rect x="${x}" y="${y}" width="${cw}" height="4" fill="${fill}" stroke="var(--ink)" stroke-width=".6"/>`;
    }
    s += `<text x="${x + cw / 2}" y="${H - 3}" text-anchor="middle" class="${hi.includes(i) ? 'hi' : ''}">${labels[i]}</text>`;
  });
  if (target) { const ty = H - 12 - (target / per) * 5; s += `<line x1="22" x2="${W}" y1="${ty}" y2="${ty}" stroke="var(--red)" stroke-width="1" stroke-dasharray="2 2"/><text x="0" y="${ty + 3}">${target}</text>`; }
  for (let k = 0; k <= rows; k += Math.max(1, Math.round(rows / 3))) s += `<text x="0" y="${H - 12 - k * 5 + 3}">${k * per}</text>`;
  return `<svg class="px pxc" viewBox="0 0 ${W} ${H}" role="img" aria-label="Chart, one block = ${per} ${unit}" style="width:100%;height:auto"><defs><pattern id="dith" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="var(--paper)"/><rect width="1" height="1" fill="var(--ink)"/><rect x="1" y="1" width="1" height="1" fill="var(--ink)"/></pattern></defs>${s}</svg>`;
}
function stepLine(values, labels, { every = 3 } = {}) {
  const W = 300, H = 120, l = 34, b = 16, t = 6, lo = Math.min(...values), hiV = Math.max(...values), span = hiV - lo || 1;
  const x = i => l + i * (W - l - 6) / (values.length - 1), y = v => t + (H - t - b) * (1 - (v - lo) / span);
  let d = `M${x(0)} ${y(values[0])}`; values.forEach((v, i) => { if (i) d += ` H${x(i)} V${y(v)}`; });
  let s = `<path d="${d}" fill="none" stroke="var(--ink)" stroke-width="3"/>`;
  values.forEach((v, i) => { s += `<rect x="${x(i) - 3}" y="${y(v) - 3}" width="6" height="6" fill="${i === values.length - 1 ? 'var(--gold)' : 'var(--paper)'}" stroke="var(--ink)" stroke-width="2"/>`; if (i % every === 0 || i === values.length - 1) s += `<text x="${x(i)}" y="${H - 3}" text-anchor="middle">${labels[i]}</text>`; });
  [lo, Math.round((lo + hiV) / 2), hiV].forEach(v => { s += `<text x="0" y="${y(v) + 3}">${v}</text><line x1="${l - 4}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--ink-3)" stroke-dasharray="1 3"/>`; });
  return `<svg class="px pxc" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend from ${values[0]} to ${values[values.length - 1]}" style="width:100%;height:auto">${s}</svg>`;
}
function quest(t) {
  const s = LT.section(t.section);
  return `<div class="quest ${t.done ? 'done' : ''}"><button class="chk-hit" data-a="task" data-v="${t.id}" aria-label="${t.done ? 'Mark not done' : 'Complete'}: ${E(t.title)}"><span class="sq ${t.done ? 'on' : ''}"></span></button>
    <div><span class="qt">${E(t.title)}</span><small>${s ? s.name : 'General'}${t.due ? ` · <span style="${LT.tasks.overdue(t) ? 'color:var(--red)' : ''}">${F.rel(t.due)}</span>` : ''}</small></div><span class="prio ${t.priority}" aria-label="${t.priority} priority">${t.priority === 'high' ? '!!!' : t.priority === 'medium' ? '!!' : '!'}</span></div>`;
}
const related = id => { const t = LT.tasks.list({ section: id, status: 'open' }); return t.length ? strip('Quests here', `<button data-a="go" data-v="tasks" data-sec="${id}">All tasks</button>`) + t.map(quest).join('') : ''; };

/* ---------- views ---------- */
const V = {};
V.home = S => {
  const O = LT.overall(), st = LT.streak(), td = LT.today(), ui = S.ui;
  const order = ['violin', 'coding', 'sports', 'gym', null, 'study', 'chess', 'sleep', 'screen'];
  return `<div class="view">
  <div class="homegrid"><div>
  <div class="hud"><span class="lv">LV ${O.level}</span>${blocks(O.pct, 12, 'gold')}<span class="streak" title="Overall streak">${flame()} ${st.n}</span></div>
  <div class="hud-sub"><span>${F.num(O.into)} / ${F.num(O.need)} XP · ${O.nextStage ? `evolves at LV ${O.nextStage.level}` : 'final form'}</span><span>${st.today ? (st.rest ? 'rest day ✓' : 'today ✓') : 'day ' + (st.n + 1) + '?'}</span></div>
  <div class="map" role="navigation" aria-label="Sections">
    ${order.map(id => id ? (() => { const s = LT.section(id); return `<button class="tile" data-a="open" data-v="${id}" style="--c: var(--${id})" aria-label="${s.full}, level ${LT.level(id).level}"><span class="lv">${LT.level(id).level}</span><span class="gem"></span>${building(id)}<span class="nm">${id === 'screen' ? 'Screen' : s.name}</span></button>`; })()
      : `<div class="tile center"><button class="hero ${ui.jump ? 'jump' : ''}" data-a="poke" aria-label="Talk to your hero" style="position:relative">${ui.bubble ? `<span class="speech">${E(ui.bubble)}</span>` : ''}${hero(O.stage)}<span class="stage-nm">${STAGE[O.stage]}</span></button></div>`).join('')}
  </div>
  </div><div>
  <div class="box dbl qlog">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><span class="lbl" style="font-weight:700">Today</span><button class="lbl" data-a="go" data-v="calendar" style="min-height:32px;text-decoration:underline">Calendar ▶</button></div>
    ${td.events.slice(0, 3).map(i => `<div class="row"><span class="t">${E(i.when.replace('Tomorrow ', 'TMRW '))}</span><span class="ttl">${E(i.title)}</span><span class="lbl dim">${i.type === 'reminder' ? 'zz' : ''}</span></div>`).join('')}
    ${td.tasks.slice(0, 2).map(i => `<div class="row"><span class="t" style="${i.when === 'Overdue' ? 'color:var(--red)' : ''}">${i.when === 'Due today' ? 'TODAY' : i.when === 'Overdue' ? 'LATE' : 'TMRW'}</span><span class="ttl">${E(i.title)}</span><button class="chk-hit" data-a="task" data-v="${i.task.id}" aria-label="Complete ${E(i.title)}"><span class="sq"></span></button></div>`).join('')}
  </div>
  </div></div>
  <p class="foot"><span class="sample">${E(LT.LABELS.sample)} · ${E(LT.LABELS.xp)}</span></p>
  </div>`;
};

function sleepTL(nights) {
  const W = 300, rh = 14, top = 14, l = 40, r = 38, start = 21 * 60, span = 13 * 60, iw = W - l - r;
  const x = m => { const v = m < 720 ? m + 1440 : m; return Math.round(l + (v - start) / span * iw); };
  let s = '';
  ['21', '00', '03', '06', '09'].forEach(t => { const xx = x(+t * 60); s += `<text x="${xx}" y="8" text-anchor="middle">${t}</text><line x1="${xx}" x2="${xx}" y1="11" y2="${top + nights.length * rh}" stroke="var(--ink-2)" stroke-dasharray="1 2"/>`; });
  nights.forEach((n, i) => {
    const y = top + i * rh, tg = LT.sleep.targetFor(n.date), inW = Math.abs(LT.sleep.delta(n)) <= 30;
    s += `<rect x="${x(D.toMin(tg.bed))}" y="${y + 2}" width="${x(D.toMin(tg.wake)) - x(D.toMin(tg.bed))}" height="${rh - 4}" fill="none" stroke="var(--ink-3)" stroke-dasharray="1 1"/>`;
    s += `<rect x="${x(D.toMin(n.bed))}" y="${y + 4}" width="${x(D.toMin(n.wake)) - x(D.toMin(n.bed))}" height="${rh - 8}" fill="${n.fresh ? 'var(--gold)' : inW ? 'var(--paper)' : 'url(#dithN)'}"><title>${F.date(n.date)} ${n.bed}–${n.wake}</title></rect>`;
    s += `<text class="d" x="0" y="${y + 10}">${F.day(n.date).toUpperCase()} ${D.parse(n.date).getDate()}</text><text class="d" x="${W}" y="${y + 10}" text-anchor="end">${F.hm(LT.sleep.duration(n)).replace(' ', '').replace('m', '')}</text>`;
  });
  return `<svg class="px tlx" viewBox="0 0 ${W} ${top + nights.length * rh + 2}" style="width:100%;height:auto" role="img" aria-label="Sleep timeline"><defs><pattern id="dithN" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="var(--ink)"/><rect width="1" height="1" fill="var(--paper)"/><rect x="1" y="1" width="1" height="1" fill="var(--paper)"/></pattern></defs>${s}</svg>`;
}

V.calendar = S => {
  const ui = S.ui, sel = ui.calSel, first = sel.slice(0, 8) + '01', firstD = D.parse(first);
  const gridStart = D.weekStart(first), end = D.addDays(gridStart, 41);
  const occ = LT.cal.occurrences(gridStart, end, { sections: ui.calFilter });
  const conf = LT.cal.conflicts(gridStart, end);
  const dayList = occ.filter(o => o.date === sel);
  const monthShift = n => { const d = new Date(firstD); d.setMonth(d.getMonth() + n); return D.toISO(d); };
  return `<div class="view">
  <div class="room-head"><button class="back" data-a="home" aria-label="Back to the map">◀</button><div><h1>Calendar</h1><div class="sub">All sections in one place</div></div><button class="btn light sm" data-a="cald" data-v="${T}">Today</button></div>
  <div class="tabs" style="margin-bottom:8px"><button class="${!ui.calFilter.length ? 'on' : ''}" data-a="calfclear">All</button>${LT.SECTIONS.map(s => `<button class="${ui.calFilter.includes(s.id) ? 'on' : ''}" data-a="calf" data-v="${s.id}">${s.id === 'screen' ? 'Screen' : s.name}</button>`).join('')}</div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin:6px 0"><button class="back" data-a="cald" data-v="${monthShift(-1)}" aria-label="Previous month">◀</button><b class="lbl" style="font-size:15px">${D.MONTHS_LONG[firstD.getMonth()]} ${firstD.getFullYear()}</b><button class="back" data-a="cald" data-v="${monthShift(1)}" aria-label="Next month">▶</button></div>
  <div class="month">${['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(d => `<span class="hd">${d}</span>`).join('')}
    ${Array.from({ length: 42 }, (_, i) => { const d = D.addDays(gridStart, i), o = occ.filter(x => x.date === d && !x.cancelled); const out = d.slice(5, 7) !== first.slice(5, 7); return `<button class="c ${out ? 'out' : ''} ${d === sel ? 'sel' : ''} ${d === T ? 'today' : ''}" data-a="cald" data-v="${d}" aria-label="${F.long(d)}, ${o.length} items"><b>${D.parse(d).getDate()}</b><span class="mk">${o.slice(0, 6).map(x => `<i class="${x.conflict ? 'x' : x.status === 'done' ? '' : 'p'}"></i>`).join('')}</span></button>`; }).join('')}
  </div>
  <p class="notice" style="margin-top:6px">■ done · □ planned · <span style="color:var(--red)">■</span> clash</p>
  ${conf.length ? `<div class="warn"><span>${[...new Set(conf.map(c => F.date(c.date)))].join(', ')}: ${E(conf[0].title)} overlaps ${E(conf[0].conflictWith.join(', '))}. Nothing is moved automatically.</span></div>` : ''}
  ${strip(F.long(sel))}
  <div>${dayList.length ? dayList.map(o => { const tap = o.kind !== 'log' && o.kind !== 'task'; const tag = o.cancelled ? 'OFF' : o.conflict ? 'CLASH' : o.status === 'done' ? 'DONE' : o.status === 'unlogged' ? 'NOT LOGGED' : o.kind === 'task' ? 'TASK' : o.kind === 'exam' ? 'EXAM' : o.kind === 'performance' ? 'CONCERT' : o.kind === 'competition' ? 'MATCH' : 'PLAN';
    return `<${tap ? 'button' : 'div'} class="evr ${o.status === 'done' ? 'done' : 'planned'} ${o.cancelled ? 'cancelled' : ''}" ${tap ? `data-a="ev" data-v="${o.id}"` : ''}><span class="tm">${o.start || '--:--'}</span><span class="ti">${E(o.title)}<small>${LT.section(o.section) ? LT.section(o.section).name : 'General'}${o.recurring ? ' · weekly' : ''}${o.changed ? ' · moved' : ''}${o.note ? ' · ' + E(o.note) : ''}</small></span><span class="tag ${o.conflict && !o.cancelled ? 'clash' : ''}">${tag}</span></${tap ? 'button' : 'div'}>`; }).join('') : '<p class="notice">Nothing on this day.</p>'}</div>
  <div class="foot"><span class="sample">${E(LT.LABELS.google)}</span><span class="sample">${E(LT.LABELS.school)}</span><button class="linkbtn" data-a="addev">+ Add event</button></div>

};

/* ---------- dialogs ---------- */
const dlg = (title, inner, steps = '') => `<div class="scrim" data-a="close"></div><div class="dlg" role="dialog" aria-modal="true" aria-label="${E(title)}"><div class="dlg-h"><h2>${E(title)}</h2><button class="x" data-a="close" aria-label="Close">✕</button></div>${steps}${inner}</div>`;
const SH = {};
SH.violin = S => {
  const f = S.sheet, Vn = LT.violin, steps = `<div class="dlg-steps">${[1, 2, 3].map(i => `<i class="${f.step >= i ? 'on' : ''}"></i>`).join('')}</div>`;
  let body, foot;
  if (f.step === 1) {
    const hint = { solo: 'On your own', lesson: 'Thu 16:00', orchestra: 'Thu 17:15', trio: 'Elgar trio' };
    body = `<p class="say">What kind of session?</p><div class="cursor-list">${Vn.TYPES.map(t => `<button class="${f.typeId === t.id ? 'on' : ''}" data-a="vtype" data-v="${t.id}"><span>${t.name}</span><small>${hint[t.id]}</small></button>`).join('')}</div>`;
    foot = `<button class="btn light block" data-a="close">Cancel</button>`;
  } else if (f.step === 2) {
    body = `<p class="say">How long, in total?</p>` + (f.timer ? `<div style="text-align:center;display:grid;gap:8px"><b id="vtimer" class="big tnum" style="font-size:52px">${S.clock(f.timerSec)}</b><div style="display:flex;gap:8px;justify-content:center"><button class="btn sm ${f.timerRunning ? 'light' : 'gold'}" data-a="vtimer">${f.timerRunning ? 'Pause' : f.timerSec ? 'Resume' : 'Start'}</button><button class="btn sm light" data-a="vtimerdone" ${f.timerSec ? '' : 'disabled'}>Use time</button></div></div>`
      : `<div class="minpick"><button class="sqbtn" data-a="vmin" data-d="-5" aria-label="5 minutes less">-5</button><output class="tnum">${f.minutes}<small>MINUTES</small></output><button class="sqbtn" data-a="vmin" data-d="5" aria-label="5 minutes more">+5</button></div><div class="chips" style="justify-content:center">${[15, 20, 30, 45, 60, 90].map(m => `<button class="chip ${f.minutes === m ? 'on' : ''}" data-a="vset" data-v="${m}">${m}</button>`).join('')}</div>`) +
      `<button class="togrow" data-a="vtimermode"><span>Start/stop timer instead</span><span class="switch ${f.timer ? 'on' : ''}"></span></button><p class="notice">One total can cover several pieces.</p>`;
    foot = `<button class="btn light" data-a="vback">◀</button><button class="btn gold block" data-a="vnext">Next ▶</button>`;
  } else {
    const alloc = Object.values(f.split).reduce((a, b) => a + b, 0);
    const pk = kind => Vn.pieces.filter(p => p.kind === kind).map(p => `<button class="chip ${f.items.includes(p.id) ? 'on' : ''}" data-a="vitem" data-v="${p.id}">${E(p.kind === 'piece' ? p.composer + ' · ' + p.title.split(' — ')[0].split(',')[0] : p.title)}</button>`).join('');
    body = `<p class="say">${f.minutes} min of ${Vn.typeName(f.typeId).toLowerCase()}. Which pieces?</p><div><span class="lbl dim">Pieces</span><div class="chips" style="margin-top:4px">${pk('piece')}</div></div><div><span class="lbl dim">Scales</span><div class="chips" style="margin-top:4px">${pk('scale')}</div></div>
      <button class="togrow" data-a="vsplitmode" ${f.items.length > 1 ? '' : 'disabled style="opacity:.45"'}><span>Split time by piece <span class="dim">(optional)</span></span><span class="switch ${f.splitOn ? 'on' : ''}"></span></button>
      ${f.splitOn && f.items.length > 1 ? `<div>${f.items.map(id => `<div class="kvrow"><span>${E(Vn.item(id).kind === 'piece' ? Vn.item(id).composer : Vn.item(id).title)}</span>${stepper('vsplit', (f.split[id] || 0) + 'M', 'minutes', `data-v="${id}"`)}</div>`).join('')}<p class="notice ${alloc > f.minutes ? 'red' : ''}" style="margin-top:6px">${alloc > f.minutes ? `${alloc - f.minutes} min over the total.` : `${alloc}/${f.minutes} min assigned${alloc < f.minutes ? ', rest unassigned' : ''}.`}</p></div>` : ''}
      ${f.noteOpen ? `<textarea id="vnote" data-in="notes" placeholder="Note (optional)">${E(f.notes)}</textarea>` : `<button class="linkbtn" data-a="vnote">+ Add note</button>`}`;
    foot = `<button class="btn light" data-a="vback">◀</button><button class="btn gold block" data-a="vsave" ${f.items.length && !(f.splitOn && alloc > f.minutes) ? '' : 'disabled'}>Save ${f.minutes} min</button>`;
  }
  return dlg('Violin', `<div class="dlg-b" data-sheet-body>${body}</div><div class="dlg-f">${foot}</div>`, steps);
};
SH.quick = S => dlg('Log what?', `<div class="dlg-b" data-sheet-body><div class="cursor-list">${[['violin', 'Violin practice', 'type · min · pieces'], ['gym', 'Gym session', LT.state.gym.active ? 'resume' : 'follow plan'], ['sleep', 'Last night', LT.sleep.lastNightLogged() ? 'saved' : 'bed · wake'], ['screen', 'Screen time', LT.screen.todayLogged() ? 'saved' : 'today total'], ['sports', 'Sport', 'run · ride · swim · court'], ['study', 'Study', 'subject · min'], ['chess', 'Chess', 'puzzles · study'], ['tasks', 'New task', 'quest log']].map(([id, t, s], i) => `<button class="${i === 0 ? 'on' : ''}" data-a="ql" data-v="${id}"><span>${t}</span><small>${s}</small></button>`).join('')}</div></div>`);
SH.sport = S => {

      : `<div class="kvrow"><span>Type</span><span class="chips">${['Training', 'Match'].map(x => `<button class="chip ${f.kind === x ? 'on' : ''}" data-a="skind" data-v="${x}">${x}</button>`).join('')}</span></div>${f.kind === 'Match' ? `<input type="text" id="sscore" data-in="score" placeholder="Score (optional)" value="${E(f.score)}">` : ''}`}
    <textarea id="snotes" data-in="notes" placeholder="${end ? 'Route or notes (optional)' : 'Skill notes (optional)'}">${E(f.notes)}</textarea></div>
    <div class="dlg-f"><button class="btn light" data-a="close">✕</button><button class="btn gold block" data-a="ssave">Save</button></div>`);
};
SH.study = S => { const f = S.sheet; return dlg('Study', `<div class="dlg-b" data-sheet-body><div class="chips">${LT.study.subjects.map(s => `<button class="chip ${f.subject === s.id ? 'on' : ''}" data-a="stsub" data-v="${s.id}">${s.name}</button>`).join('')}</div><div class="kvrow"><span>Duration</span>${stepper('stmin', F.dur(f.minutes), 'duration')}</div><input type="text" id="sttopic" data-in="topic" placeholder="Topic covered" value="${E(f.topic)}"></div><div class="dlg-f"><button class="btn light" data-a="close">✕</button><button class="btn gold block" data-a="stsave">Save</button></div>`); };
SH.chess = S => { const f = S.sheet; return dlg('Chess', `<div class="dlg-b" data-sheet-body><div class="chips">${[['puzzles', 'Puzzles'], ['study', 'Study']].map(([k, l]) => `<button class="chip ${f.kind === k ? 'on' : ''}" data-a="chkind" data-v="${k}">${l}</button>`).join('')}</div><div class="kvrow"><span>Duration</span>${stepper('chmin', F.dur(f.minutes), 'duration')}</div>${f.kind === 'puzzles' ? `<div class="kvrow"><span>Solved</span>${stepper('chsolved', f.solved, 'solved')}</div>` : `<input type="text" id="chtopic" data-in="topic" placeholder="What did you study?" value="${E(f.topic)}">`}<p class="notice">Games would come from Chess.com. These are fictional samples.</p></div><div class="dlg-f"><button class="btn light" data-a="close">✕</button><button class="btn gold block" data-a="chsave">Save</button></div>`); };
SH.swap = S => { const e = LT.state.gym.active.exercises[S.sheet.ei]; return dlg('Swap', `<div class="dlg-b" data-sheet-body><p class="say">Replace ${E(e.name)} today with…</p><div class="cursor-list">${e.alts.map(a => `<button data-a="gswapto" data-v="${E(a)}"><span>${E(a)}</span><small></small></button>`).join('')}</div></div>`); };
SH.finish = S => { const f = S.sheet; return dlg('Check-in', `<div class="dlg-b" data-sheet-body><p class="say">How did it go? All optional.</p>
  <div><span class="lbl dim">Effort /10</span><div class="nums5" style="margin-top:4px">${[5, 6, 7, 8, 9].map(v => `<button class="${f.effort === v ? 'on' : ''}" data-a="fin" data-f="effort" data-v="${v}">${v}</button>`).join('')}</div></div>
  <div><span class="lbl dim">Soreness 0–4</span><div class="nums5" style="margin-top:4px">${[0, 1, 2, 3, 4].map(v => `<button class="${f.soreness === v ? 'on' : ''}" data-a="fin" data-f="soreness" data-v="${v}">${v}</button>`).join('')}</div></div>
  <button class="togrow" data-a="finpain"><span>Any pain? <span class="dim">(e.g. shins)</span></span><span class="switch ${f.pain ? 'on' : ''}"></span></button>
  ${f.pain ? `<input type="text" id="painnote" data-in="painNote" placeholder="Where? What made it worse?" value="${E(f.painNote)}">` : ''}</div>
  <div class="dlg-f"><button class="btn light" data-a="close">◀</button><button class="btn gold block" data-a="gdone">Save session</button></div>`); };
SH.ev = S => {
  const f = S.sheet, o = f.occ, s = LT.section(o.section);
  return dlg(o.title, `<div class="dlg-b" data-sheet-body><p class="sm mid">${s ? s.name : 'General'} · ${F.date(o.date)}${o.start ? ' · ' + o.start + '–' + o.end : ''}${o.recurring ? ' · weekly' : ''}</p>
    ${o.conflict && !o.cancelled ? `<div class="warn" style="margin:0"><span>Overlaps ${E(o.conflictWith.join(', '))}. You decide what moves.</span></div>` : ''}
    ${o.status === 'done' ? `<p class="notice">Done: ${E(o.logged.title)}</p>` : ''}
    ${o.cancelled ? `<button class="btn block" data-a="evrestore">Restore</button>` : `
    <div class="kvrow"><span>Date</span>${stepper('evd', F.date(f.date), 'date')}</div>${o.start ? `<div class="kvrow"><span>Start</span>${stepper('evt', f.start, 'start time')}</div>` : ''}
    ${o.recurring ? `<div class="cursor-list"><button class="${f.scope === 'one' ? 'on' : ''}" data-a="evscope" data-v="one"><span>This one only</span><small>${F.date(o.origDate)}</small></button><button class="${f.scope === 'future' ? 'on' : ''}" data-a="evscope" data-v="future"><span>This and later</span><small>series</small></button></div>` : ''}
    <div style="display:flex;gap:8px"><button class="btn light" data-a="evcancel" style="color:var(--red);border-color:var(--red)">Cancel ${o.recurring && f.scope === 'future' ? 'series' : 'event'}</button><button class="btn gold" data-a="evsave" style="flex:1">Save</button></div>`}
    <p class="sample">${E(LT.LABELS.google)}</p></div>`);
};
SH.task = S => { const f = S.sheet; return dlg('New task', `<div class="dlg-b" data-sheet-body><input type="text" id="tasktitle" data-in="title" placeholder="Quest name" value="${E(f.title)}" aria-label="Task">
  <div><span class="lbl dim">Section</span><div class="chips" style="margin-top:4px"><button class="chip ${!f.section ? 'on' : ''}" data-a="tsec" data-v="">None</button>${LT.SECTIONS.map(s => `<button class="chip ${f.section === s.id ? 'on' : ''}" data-a="tsec" data-v="${s.id}">${s.name}</button>`).join('')}</div></div>
  <div><span class="lbl dim">Priority</span><div class="chips" style="margin-top:4px">${['high', 'medium', 'low'].map(p => `<button class="chip ${f.priority === p ? 'on' : ''}" data-a="tpri" data-v="${p}">${p === 'high' ? '!!! High' : p === 'medium' ? '!! Medium' : '! Low'}</button>`).join('')}</div></div>
  <div><span class="lbl dim">Due</span><div class="chips" style="margin-top:4px">${[['', 'None'], [T, 'Today'], [D.addDays(T, 1), 'Tomorrow'], [D.addDays(T, 7), 'Next week']].map(([d, l]) => `<button class="chip ${f.due === d ? 'on' : ''}" data-a="tdue" data-v="${d}">${l}</button>`).join('')}</div></div></div>
  <div class="dlg-f"><button class="btn light" data-a="close">✕</button><button class="btn gold block" data-a="tsave">Add quest</button></div>`); };
SH.addev = S => { const f = S.sheet; return dlg('Add event', `<div class="dlg-b" data-sheet-body><input type="text" id="evtitle" data-in="title" placeholder="Event name" value="${E(f.title)}" aria-label="Event title"><div class="chips">${LT.SECTIONS.map(s => `<button class="chip ${f.section === s.id ? 'on' : ''}" data-a="aesec" data-v="${s.id}">${s.name}</button>`).join('')}</div><div class="kvrow"><span>Date</span>${stepper('aed', F.date(f.date), 'date')}</div><div class="kvrow"><span>Start</span>${stepper('aet', f.start, 'start time')}</div></div><div class="dlg-f"><button class="btn light" data-a="close">✕</button><button class="btn gold block" data-a="aesave">Add</button></div>`); };

/* ---------- reward ---------- */
function reward(r) {
  const O = LT.overall();
  const evo = r.evolved ? `<div class="ban">What?<br>${STAGE[r.evolved.from]} is evolving!</div><div class="evo"><div class="a">${hero(r.evolved.from, { still: true })}</div><div class="b">${hero(r.evolved.to, { still: true })}</div></div><div class="up">${STAGE[r.evolved.from]} became ${STAGE[r.evolved.to]}! · LV ${r.overallUp.to}</div>` : '';
  return `<div class="reward" data-reward role="dialog" aria-modal="true" aria-label="Reward"><div class="card">
    ${r.rest ? `<div style="width:90px;margin:0 auto">${hero(O.stage)}</div><div class="ban">Rest day</div><p class="sm">Streak safe: ${r.streak} days. Recovery is training too.</p>` : `
    ${evo || `<div style="width:84px;margin:0 auto">${hero(O.stage)}</div>`}
    ${r.preview ? '<span class="pill gold" style="justify-self:center">Preview only</span>' : `<div class="coins"><span class="coin"></span><span class="tnum">+${r.total} XP</span></div><ul>${r.lines.map(l => `<li><span>${E(l.reason)}</span><b>+${l.xp}</b></li>`).join('')}</ul>`}`}
    ${r.sectionUps.map(u => `<div class="up">${E(u.name)} level up! LV ${u.from} → ${u.to}</div>`).join('')}
    ${r.overallUp && !r.evolved ? `<div class="up">Level up! LV ${r.overallUp.to}</div>` : ''}
    ${(r.unlocked || []).map(a => `<div class="ach"><b>Trophy: ${E(a.title)}</b>${E(a.desc)}</div>`).join('')}
    ${r.pain ? '<p class="notice red" style="text-align:left">You noted pain. Consider resting or easing the next session, and talk to a coach or physio if it keeps happening.</p>' : ''}
    ${r.streakUp ? `<p class="sm">${flame(12)} Streak ${r.streak} days</p>` : ''}
    <button class="btn gold block" data-a="rclose">▶ Continue</button></div></div>`;
}

Shell({
  key: 'pixel', navId: 'nav', views: V, sheets: SH, reward, nav,
  restBar: (left, S) => { const tot = S.rest.total || 90, n = Math.round(10 * left / tot); return `<div class="restbar" role="status"><span class="lbl">Rest</span><span class="hg">${Array.from({ length: 10 }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</span><b class="tnum">${S.clock(left)}</b><span style="display:flex;gap:4px"><button class="btn light sm" data-a="rest30">+30</button><button class="btn light sm" data-a="restskip">Skip</button></span></div>`; },
  pokeLines: () => { const O = LT.overall(), st = LT.streak(); return [`Streak: ${st.n} days! Rest days count too.`, `${O.toNext} XP to LV ${O.level + 1}.`, `Violin: ${LT.violin.weekTotal()}/${LT.state.violin.target} min this week.`, 'Quest: Lower A at 10:00.']; },
  onPoke: S => { S.ui.jump = true; S.render(true); setTimeout(() => { S.ui.jump = false; }, 450); },
});
})();
</script>
