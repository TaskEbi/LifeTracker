<title>LifeTracker Inkwell</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: a bound journal. Pages scroll on the left; a thumb index of fabric tabs sits on the right edge of every page.
   Deliberately a single paper look; the sleep page turns to night paper on its own. */
:root {
  --paper: #E9ECE5; --paper-2: #DEE2DA; --slip: #F6F7F2; --ink: #1E2A44; --ink-2: #4A5570; --ink-3: #737D91; --rule: #C3CDD6; --margin: #D69A94; --red: #A8372B; --gold: #A27A1E;
  --violin: #B5733A; --coding: #3D6888; --sports: #4C8758; --gym: #9A4A3B; --study: #6A5A93; --chess: #5D5D4F; --sleep: #2E3D69; --screen: #8A4C70; --diary: #2C3A57; --todo: #6F6A4A; --home: #1E2A44;
  --night: #19213B; --night-2: #232D4D; --chalk: #E7E9F4; --chalk-2: #A9B0CF;
  --serif: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.5 var(--serif); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
:focus-visible { outline: 2px dashed var(--red); outline-offset: 3px; }
h1, h2, h3, p { margin: 0; text-wrap: balance; }
.tnum { font-variant-numeric: tabular-nums lining-nums; }
.hand { font-family: var(--hand); font-weight: 600; }

.book { display: grid; grid-template-columns: minmax(0, 1fr) 60px; max-width: 820px; margin: 0 auto; min-height: 100%; }
.pagewrap { min-width: 0; position: relative; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 14px; padding-block: 14px 110px;
  background-image: linear-gradient(to bottom, transparent 31px, color-mix(in srgb, var(--rule) 55%, transparent) 32px); background-size: 100% 32px; }
.pagewrap::before { content: ""; position: absolute; top: 0; bottom: 0; left: max(8px, calc(env(safe-area-inset-left, 0px) - 6px)); width: 1.5px; background: var(--margin); opacity: .5; }
.view { animation: turn .28s cubic-bezier(.2,.75,.25,1); transform-origin: left center; }
.view.back { animation-name: turnBack; }
@keyframes turn { from { opacity: 0; transform: perspective(900px) rotateY(-9deg) translateX(14px); } }
@keyframes turnBack { from { opacity: 0; transform: perspective(900px) rotateY(6deg) translateX(-10px); } }

/* thumb index */
.index { position: sticky; top: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; justify-content: center; gap: 3px; padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px)); padding-right: env(safe-area-inset-right, 0px); }
.tab { flex: 1 1 0; max-height: 64px; min-height: 42px; border-radius: 12px 0 0 12px; background: color-mix(in srgb, var(--c) 30%, var(--paper-2)); color: var(--ink); font: 600 12.5px/1.1 var(--serif); display: grid; place-items: center; text-align: center; padding: 2px 4px; box-shadow: inset 3px 0 0 color-mix(in srgb, var(--c) 70%, transparent), -1px 1px 2px rgba(30,42,68,.12); transition: transform .18s ease, background .18s; position: relative; }
.tab span { display: block; font-size: 10.5px; font-weight: 500; color: var(--ink-2); font-family: var(--hand); font-size: 14px; line-height: .9; }
.tab.on { background: var(--c); color: #F6F4EC; transform: translateX(-6px); box-shadow: -2px 2px 6px rgba(30,42,68,.25); }
.tab.on span { color: #F6F4EC; opacity: .85; }
.tab.util { --c: var(--diary); }
.tab.sep { margin-top: 8px; }

/* header */
.dayhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; min-height: 64px; }
.dayhead .d { font-family: var(--hand); font-size: 40px; line-height: .95; font-weight: 700; }
.dayhead .sub { color: var(--ink-3); font-size: 14px; font-style: italic; }
.tally { display: grid; justify-items: end; gap: 2px; text-align: right; }
.tally svg { height: 26px; width: auto; }
.tally small { font-size: 13px; color: var(--ink-2); font-style: italic; }
.wren-wrap { margin: 2px auto 0; width: min(270px, 92%); position: relative; }
.wren-btn { display: block; width: 100%; }
.wren-btn svg { width: 100%; height: auto; display: block; overflow: visible; }
.sway { transform-origin: 50% 90%; animation: sway 5s ease-in-out infinite; }
@keyframes sway { 50% { transform: rotate(-1.2deg); } }
.hop .sway { animation: hopw .5s ease; }
@keyframes hopw { 40% { transform: translateY(-8px) rotate(2deg); } }
.margin-note { position: absolute; font-family: var(--hand); font-size: 20px; color: var(--red); line-height: 1; max-width: 170px; transform: rotate(-4deg); right: -4px; top: 6px; background: color-mix(in srgb, var(--paper) 80%, transparent); padding: 4px 6px; border-radius: 6px; }
.caption { text-align: center; font-style: italic; color: var(--ink-2); font-size: 15px; margin-top: -4px; }
.levelline { margin: 12px 0 0; display: grid; gap: 4px; }
.levelline .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.levelline b { font-size: 26px; font-weight: 600; letter-spacing: -.01em; }
.levelline svg { width: 100%; height: 16px; display: block; }
.muted { color: var(--ink-2); } .faint { color: var(--ink-3); } .small { font-size: 14px; }
.it { font-style: italic; }

/* ruled list (today, journals) */
.section-label { font-family: var(--hand); font-size: 26px; font-weight: 700; margin: 26px 0 4px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; line-height: 1.1; }
.section-label button, .linkish { font-family: var(--serif); font-size: 14px; font-style: italic; color: var(--red); text-decoration: underline; text-underline-offset: 3px; min-height: 36px; }
.lines { display: grid; }
.line { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; min-height: 44px; padding: 8px 0 6px; border-bottom: 1px solid color-mix(in srgb, var(--rule) 70%, transparent); }
.line .m { font-family: var(--hand); font-size: 19px; color: var(--ink-2); line-height: 1; }
.line .t { min-width: 0; }
.line .t b { font-weight: 600; }
.line .t small { display: block; color: var(--ink-3); font-size: 14px; font-style: italic; }
.line .r { font-variant-numeric: tabular-nums; font-weight: 600; }
.line.fresh { animation: inkin 1.4s ease; }
@keyframes inkin { from { background: color-mix(in srgb, var(--gold) 22%, transparent); } }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50% 40% 55% 45%; background: var(--c); margin-right: 6px; vertical-align: 1px; opacity: .85; }
.box { width: 26px; height: 26px; display: inline-grid; place-items: center; flex: none; }
.box svg { width: 26px; height: 26px; overflow: visible; }
.box .tick { stroke: var(--red); stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-dasharray: 30; stroke-dashoffset: 30; transition: stroke-dashoffset .25s ease; }
.box.on .tick { stroke-dashoffset: 0; }
.box rect { fill: none; stroke: var(--ink); stroke-width: 1.4; }

/* section header */
.sechead { display: grid; gap: 2px; margin-bottom: 8px; }
.sechead .kicker { font-family: var(--hand); font-size: 20px; color: var(--c); line-height: 1; }
.sechead h1 { font-size: 34px; font-weight: 600; letter-spacing: -.015em; line-height: 1.05; }
.sechead .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; color: var(--ink-2); font-style: italic; }
.sechead .meta b { font-style: normal; color: var(--ink); font-weight: 600; }
.wash { position: relative; padding: 14px 14px 12px; border-radius: 4px 14px 6px 12px; background: color-mix(in srgb, var(--c) 13%, var(--slip)); box-shadow: 0 1px 0 rgba(30,42,68,.08); }
.slip { background: var(--slip); padding: 14px; border-radius: 3px; box-shadow: 0 1px 2px rgba(30,42,68,.1), 0 6px 14px rgba(30,42,68,.06); position: relative; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 16px; border-radius: 10px 12px 9px 13px; font-weight: 600; font-size: 16px; border: 1.5px solid var(--ink); background: transparent; }
.btn.ink { background: var(--ink); color: var(--slip); }
.btn.c { background: var(--c); border-color: var(--c); color: #F7F5EE; }
.btn.block { width: 100%; }
.btn.sm { min-height: 38px; font-size: 14.5px; padding: 0 12px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; }
.sample { font-size: 13px; font-style: italic; color: var(--ink-3); display: inline-flex; gap: 6px; align-items: baseline; }
.sample::before { content: "※"; font-style: normal; }
.stamp { display: inline-block; font: 700 12px/1 var(--serif); letter-spacing: .08em; text-transform: uppercase; padding: 4px 7px; border: 1.6px solid currentColor; border-radius: 4px; transform: rotate(-3deg); color: var(--c, var(--ink-2)); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fig { display: grid; gap: 0; }
.fig b { font-size: 26px; font-weight: 600; line-height: 1.1; letter-spacing: -.01em; }
.fig span { font-size: 13.5px; color: var(--ink-2); font-style: italic; line-height: 1.3; }

/* charts in ink */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.ch-grid { stroke: var(--rule); stroke-width: 1; }
.ch-axis, .ch-lbl { fill: var(--ink-3); font: italic 500 11px var(--serif); }
.ch-lbl.is-hi { fill: var(--ink); font-weight: 700; }
.ch-bar { fill: color-mix(in srgb, var(--c, var(--ink)) 28%, transparent); stroke: var(--ink); stroke-width: 1.2; filter: url(#wobble); }
.ch-bar.is-met { fill: color-mix(in srgb, var(--c, var(--ink)) 55%, transparent); }
.ch-bar.is-hi { fill: var(--c, var(--ink)); }
.ch-target { stroke: var(--red); stroke-width: 1.4; stroke-dasharray: 5 4; }
.ch-target-lbl { fill: var(--red); font: 600 16px var(--hand); }
.ch-line { fill: none; stroke: var(--c, var(--ink)); stroke-width: 2; filter: url(#wobble); stroke-linejoin: round; }
.ch-area { fill: color-mix(in srgb, var(--c, var(--ink)) 14%, transparent); }
.ch-dot { fill: var(--slip); stroke: var(--ink); stroke-width: 1.4; }
.ch-dot.is-end { fill: var(--c, var(--ink)); }

/* violin journal */
.perfs { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, 78%); gap: 12px; overflow-x: auto; padding: 4px 2px 10px; scroll-snap-type: x mandatory; scrollbar-width: none; }
.perfs::-webkit-scrollbar { display: none; }
.ticket { scroll-snap-align: start; position: relative; background: var(--slip); padding: 12px 14px 12px 18px; border-radius: 4px; box-shadow: 0 1px 2px rgba(30,42,68,.12); display: grid; gap: 4px; border-left: 2px dashed color-mix(in srgb, var(--c) 60%, transparent); }
.ticket .days { font-family: var(--hand); font-size: 44px; line-height: .8; color: var(--c); font-weight: 700; }
.entry { padding: 10px 0 10px; border-bottom: 1px solid color-mix(in srgb, var(--rule) 70%, transparent); display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 10px; }
.entry .date { font-family: var(--hand); font-size: 20px; line-height: 1; color: var(--ink-2); }
.entry .date small { display: block; font-size: 15px; color: var(--ink-3); }
.entry .what b { font-weight: 600; }
.entry .what .pieces { font-size: 14.5px; color: var(--ink-2); }
.entry .what .note { font-family: var(--hand); font-size: 19px; color: var(--ink); line-height: 1.15; margin-top: 2px; }
.entry .min { font-family: var(--hand); font-size: 24px; font-weight: 700; line-height: 1; }
.entry.fresh { animation: inkin 1.6s ease; }
.rep { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid color-mix(in srgb, var(--rule) 70%, transparent); }
.rep small { display: block; font-size: 13.5px; color: var(--ink-3); font-style: italic; }
.dots28 { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 5px; }
.dots28 i { aspect-ratio: 1; border-radius: 50%; border: 1.2px solid var(--ink-3); }
.dots28 i.l1 { background: color-mix(in srgb, var(--c) 35%, transparent); border-color: var(--c); }
.dots28 i.l2 { background: color-mix(in srgb, var(--c) 70%, transparent); border-color: var(--c); }
.dots28 i.l3 { background: var(--c); border-color: var(--ink); }
.dots28 i.now { outline: 1.5px solid var(--red); outline-offset: 2px; }

/* gym sheet */
.sheet-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.sheet-table th { font: italic 500 12.5px var(--serif); color: var(--ink-3); text-align: center; padding: 4px 2px; border-bottom: 1.5px solid var(--ink); }
.sheet-table th:first-child { text-align: left; }
.sheet-table td { border-bottom: 1px solid var(--rule); padding: 4px 2px; text-align: center; height: 50px; }
.sheet-table td:first-child { text-align: left; font-family: var(--hand); font-size: 20px; width: 28px; }
.sheet-table tr.is-done td { color: var(--ink-3); }
.adj { display: inline-flex; align-items: center; gap: 0; }
.adj button { width: 34px; height: 42px; font-size: 18px; color: var(--ink-2); font-weight: 600; }
.adj output { min-width: 44px; font-weight: 600; font-size: 16px; }
.adj output small { font-size: 11px; color: var(--ink-3); font-weight: 500; }
.ex-block { padding: 12px 0 6px; border-bottom: 2px solid var(--ink); }
.ex-block h3 { font-size: 20px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ex-block h3 small { font-family: var(--hand); font-size: 17px; color: var(--ink-3); font-weight: 600; }
.week7 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1.5px solid var(--ink); border-radius: 4px; background: var(--slip); }
.week7 > div { min-height: 76px; padding: 4px 3px; border-left: 1px solid var(--rule); display: grid; align-content: start; gap: 2px; font-size: 12px; text-align: center; }
.week7 > div:first-child { border-left: 0; }
.week7 b { font-family: var(--hand); font-size: 18px; font-weight: 700; line-height: 1; }
.week7 .g { font-weight: 700; color: var(--gym); line-height: 1.1; }
.week7 .g.done { text-decoration: underline wavy var(--gym); }
.week7 .s { color: var(--sports); font-style: italic; line-height: 1.1; }
.week7 .now { background: color-mix(in srgb, var(--gold) 14%, transparent); }
.restbar { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); right: calc(76px + env(safe-area-inset-right, 0px)); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 25; background: var(--ink); color: var(--slip); border-radius: 12px 14px 10px 13px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; box-shadow: 0 8px 20px rgba(30,42,68,.25); max-width: 560px; }
.restbar .grow { flex: 1; font-style: italic; }
.restbar b { font-family: var(--hand); font-size: 28px; font-style: normal; line-height: 1; }
.restbar button { color: var(--slip); border: 1px solid color-mix(in srgb, var(--slip) 40%, transparent); border-radius: 9px; padding: 0 10px; min-height: 38px; font-size: 14px; }

/* sleep night page */
.nightpage { background: var(--night); color: var(--chalk); margin: -14px -14px 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 18px 14px 26px max(16px, env(safe-area-inset-left, 0px)); position: relative; overflow: hidden; }
.nightpage .faint { color: var(--chalk-2); }
.nightpage .muted { color: var(--chalk-2); }
.nightpage .sechead .kicker { color: var(--chalk-2); }
.nightpage .sechead .meta { color: var(--chalk-2); }
.nightpage .sechead .meta b { color: var(--chalk); }
.nightpage .btn { border-color: var(--chalk-2); color: var(--chalk); }
.nightpage .btn.ink { background: var(--chalk); color: var(--night); border-color: var(--chalk); }
.nightpage .stars { position: absolute; inset: 0; pointer-events: none; }
.nightslip { background: var(--night-2); border-radius: 6px 14px 8px 12px; padding: 14px; display: grid; gap: 12px; position: relative; }
.clockpair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.clockpair > div { display: grid; justify-items: center; gap: 6px; padding: 8px 4px; }
.clockpair .tv { font-family: var(--hand); font-size: 48px; line-height: .9; font-weight: 700; color: var(--chalk); }
.clockpair .row { display: flex; gap: 6px; }
.clockpair button, .nightslip .sbtn { min-width: 46px; min-height: 40px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--chalk) 35%, transparent); color: var(--chalk); font-size: 14px; padding: 0 8px; }
.tl text { font: italic 500 11px var(--serif); fill: var(--chalk-2); }
.tl .d { font: 600 16px var(--hand); fill: var(--chalk); }
.tl .dur { font: 600 16px var(--hand); fill: var(--chalk); }
.tl .grid { stroke: color-mix(in srgb, var(--chalk) 14%, transparent); }
.tl .win { fill: color-mix(in srgb, var(--chalk) 9%, transparent); }
.tl .bar { stroke: var(--chalk); stroke-width: 5; stroke-linecap: round; }
.tl .bar.out { stroke: var(--chalk-2); stroke-dasharray: 2 5; stroke-width: 4; }
.tl .bar.fresh { stroke: #E6C36A; }
.nightlist .line { border-color: color-mix(in srgb, var(--chalk) 14%, transparent); }
.nightlist .line .m { color: var(--chalk-2); }
.nightlist .line .t small { color: var(--chalk-2); }
.nightpage .section-label button { color: #E6C36A; }
.toggle-ink { display: inline-flex; width: 50px; height: 30px; border-radius: 99px; border: 1.5px solid currentColor; position: relative; flex: none; }
.toggle-ink::after { content: ""; position: absolute; top: 4px; left: 4px; width: 19px; height: 19px; border-radius: 50%; background: currentColor; transition: transform .2s; opacity: .45; }
.toggle-ink.on::after { transform: translateX(20px); opacity: 1; }

/* road to IOI map */
.map { width: 100%; height: auto; display: block; }
.map .path { fill: none; stroke: var(--ink-3); stroke-width: 2; stroke-dasharray: 2 7; stroke-linecap: round; }
.map .path.walked { stroke: var(--coding); stroke-dasharray: none; stroke-width: 2.6; filter: url(#wobble); }
.map text { font: 600 12.5px var(--serif); fill: var(--ink); }
.map .when { font: italic 500 11px var(--serif); fill: var(--ink-3); }
.map .goal { font: 700 22px var(--hand); fill: var(--red); }

/* calendar diary */
.dayrow { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; padding: 8px 0 10px; border-bottom: 1px solid var(--rule); }
.dayrow .dn { font-family: var(--hand); line-height: .95; }
.dayrow .dn b { display: block; font-size: 30px; font-weight: 700; }
.dayrow .dn span { font-size: 18px; color: var(--ink-3); }
.dayrow.is-today .dn b { color: var(--red); }
.evl { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 6px 0; min-height: 40px; width: 100%; text-align: left; }
.evl .tm { font-size: 13.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.evl .ti { min-width: 0; }
.evl.planned .ti b { font-weight: 500; color: var(--ink-2); text-decoration: underline dashed color-mix(in srgb, var(--c) 70%, transparent); text-underline-offset: 4px; }
.evl.done .ti b { font-weight: 600; text-decoration: underline solid var(--c); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.evl.cancelled .ti b { text-decoration: line-through; color: var(--ink-3); }
.evl .ti small { display: block; font-size: 13px; font-style: italic; color: var(--ink-3); }
.evl .mk { font-family: var(--hand); font-size: 17px; white-space: nowrap; color: var(--ink-3); }
.evl .mk.ok { color: var(--sports); }
.evl .mk.clash { color: var(--red); font-weight: 700; }
.clash-note { font-family: var(--hand); font-size: 20px; color: var(--red); line-height: 1.15; padding: 8px 12px; border: 1.5px solid var(--red); border-radius: 50% 46% 48% 52% / 18% 22% 20% 18%; margin: 10px 0; transform: rotate(-.6deg); }
.filters { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 8px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.fchip { flex: none; min-height: 36px; padding: 0 12px; border-radius: 8px 10px 7px 11px; border: 1.3px solid color-mix(in srgb, var(--c, var(--ink)) 60%, transparent); font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.fchip.on { background: var(--c, var(--ink)); color: #F7F5EE; border-color: var(--c, var(--ink)); }
.weeknav { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 4px 0; }
.weeknav b { font-family: var(--hand); font-size: 24px; }
.weeknav button { min-width: 44px; min-height: 44px; font-size: 22px; }

/* tasks */
.todo { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 8px; align-items: start; padding: 8px 0; border-bottom: 1px solid color-mix(in srgb, var(--rule) 70%, transparent); min-height: 52px; }
.todo .box { margin-top: 2px; width: 34px; height: 34px; }
.todo b { font-weight: 500; font-size: 17px; }
.todo.done b { text-decoration: line-through; text-decoration-color: var(--red); color: var(--ink-3); }
.todo small { display: block; font-size: 13.5px; color: var(--ink-3); font-style: italic; }
.todo .pr { font-family: var(--hand); font-size: 17px; font-style: normal; }

/* progress */
.sketches { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; align-items: end; }
.sketches > div { display: grid; justify-items: center; text-align: center; gap: 0; }
.sketches svg { width: 100%; height: auto; overflow: visible; }
.sketches .future svg { opacity: .3; filter: grayscale(1); }
.sketches b { font-family: var(--hand); font-size: 17px; font-weight: 700; line-height: 1; }

.chap { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px dotted var(--ink-3); width: 100%; text-align: left; }
.chap .no { font-family: var(--hand); font-size: 24px; color: var(--c); font-weight: 700; text-align: center; }
.chap .bar { height: 5px; background: color-mix(in srgb, var(--c) 18%, transparent); border-radius: 3px; margin-top: 4px; overflow: hidden; }

.seal .w { width: 54px; height: 54px; border-radius: 47% 53% 49% 51%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #C35A4C, #8E2A20); color: #F6D9CF; font: 700 20px var(--hand); box-shadow: inset 0 -2px 4px rgba(0,0,0,.25); }

.seal b { font-size: 13.5px; font-weight: 600; line-height: 1.15; }
.seal small { font-size: 11.5px; color: var(--ink-3); font-style: italic; line-height: 1.2; }

/* pen button */
.pen { position: fixed; z-index: 22; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); height: 56px; padding: 0 20px 0 16px; border-radius: 16px 18px 15px 19px; background: var(--ink); color: var(--slip); display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 17px; box-shadow: 0 6px 18px rgba(30,42,68,.3); }
.pen svg { width: 22px; height: 22px; }
@media (min-width: 900px) { .pen { left: calc(50% - 410px + 16px); } .restbar { right: auto; width: 560px; left: calc(50% - 410px + 16px); } }

/* slips (sheets) */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(30,42,68,.35); animation: fade .2s ease; }
@keyframes fade { from { opacity: 0; } }
.card-sheet { position: fixed; z-index: 41; left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); max-width: 560px; margin: 0 auto; max-height: calc(100% - 40px); display: flex; flex-direction: column; background: var(--slip); border-radius: 4px; box-shadow: 0 18px 50px rgba(30,42,68,.35); animation: slipin .28s cubic-bezier(.2,.8,.2,1);
  background-image: linear-gradient(to bottom, transparent 33px, color-mix(in srgb, var(--rule) 45%, transparent) 34px); background-size: 100% 34px; }
.card-sheet::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--c, var(--red)); opacity: .8; }
@keyframes slipin { from { transform: translateY(30px) rotate(1.5deg); opacity: 0; } }
.clip { position: absolute; top: -14px; right: 26px; width: 22px; height: 44px; border: 2.5px solid #8A93A6; border-radius: 11px; border-bottom-color: transparent; transform: rotate(8deg); }
.cs-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 16px 16px 6px; }
.cs-head h2 { font-family: var(--hand); font-size: 30px; font-weight: 700; line-height: 1; }
.cs-head .x { min-width: 44px; min-height: 44px; font-size: 26px; line-height: 1; color: var(--ink-2); }
.cs-steps { padding: 0 16px; font-style: italic; color: var(--ink-3); font-size: 14px; }
.cs-steps b { color: var(--c); font-style: normal; }
.cs-body { overflow-y: auto; padding: 8px 16px 14px; display: grid; gap: 14px; align-content: start; }
.cs-foot { padding: 10px 16px 14px; display: flex; gap: 10px; border-top: 1.5px solid var(--ink); }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opt { min-height: 72px; padding: 10px 12px; border: 1.4px solid color-mix(in srgb, var(--ink) 35%, transparent); border-radius: 8px 12px 9px 11px; display: grid; align-content: space-between; text-align: left; gap: 4px; background: var(--slip); }
.opt b { font-size: 17px; font-weight: 600; }
.opt small { font-size: 13px; color: var(--ink-3); font-style: italic; line-height: 1.25; }
.opt.on { border-color: var(--c, var(--ink)); background: color-mix(in srgb, var(--c, var(--ink)) 10%, var(--slip)); box-shadow: inset 0 0 0 1px var(--c, var(--ink)); }
.bigmin { display: grid; grid-template-columns: 56px 1fr 56px; align-items: center; gap: 8px; }
.bigmin output { text-align: center; font-family: var(--hand); font-size: 72px; line-height: .85; font-weight: 700; }
.bigmin output small { display: block; font: italic 500 14px var(--serif); color: var(--ink-3); }
.circ { width: 56px; height: 56px; border-radius: 50%; border: 1.5px solid var(--ink); font-size: 18px; font-weight: 600; display: grid; place-items: center; }
.picks { display: flex; flex-wrap: wrap; gap: 6px; }
.pk { min-height: 40px; padding: 6px 12px; border-radius: 7px 10px 8px 11px; border: 1.2px solid color-mix(in srgb, var(--ink) 30%, transparent); font-size: 15px; text-align: left; display: inline-flex; gap: 6px; align-items: center; background: var(--slip); }
.pk.on { border-color: var(--c, var(--ink)); background: color-mix(in srgb, var(--c, var(--ink)) 14%, var(--slip)); box-shadow: inset 0 0 0 1px var(--c, var(--ink)); }
.pk .tk { font-family: var(--hand); font-size: 20px; color: var(--red); line-height: .5; }
.lbl { font-family: var(--hand); font-size: 21px; font-weight: 700; color: var(--ink-2); line-height: 1; margin-bottom: 6px; }
.rowsplit { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px dotted var(--ink-3); }
.stepper { display: inline-flex; align-items: center; border: 1.3px solid color-mix(in srgb, var(--ink) 40%, transparent); border-radius: 9px; }
.stepper button { width: 40px; height: 40px; font-size: 18px; font-weight: 600; }
.stepper output { min-width: 66px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.switchline { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 46px; width: 100%; text-align: left; }
textarea, input[type=text] { width: 100%; min-height: 46px; border: 0; border-bottom: 1.5px solid var(--ink); background: transparent; padding: 8px 2px; font-family: var(--hand); font-size: 22px; border-radius: 0; }
textarea { min-height: 80px; resize: vertical; }
input::placeholder, textarea::placeholder { color: var(--ink-3); }
.scale5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.scale5 button { min-height: 44px; border: 1.3px solid color-mix(in srgb, var(--ink) 35%, transparent); border-radius: 50%; font-family: var(--hand); font-size: 22px; font-weight: 700; aspect-ratio: 1; max-width: 52px; justify-self: center; width: 100%; }
.scale5 button.on { border: 2px solid var(--red); color: var(--red); }
.note { font-size: 14.5px; font-style: italic; color: var(--ink-2); }
.note.warn { color: var(--red); }

/* reward */
.reward { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 20px max(18px, env(safe-area-inset-left, 0px)); background: rgba(30,42,68,.45); animation: fade .2s ease; }
.reward .card { width: min(360px, 100%); background: var(--slip); border-radius: 4px; padding: 20px 18px 16px; display: grid; gap: 10px; text-align: center; box-shadow: 0 24px 60px rgba(0,0,0,.3); position: relative; animation: slipin .3s ease; }
.reward .xpstamp { justify-self: center; font-family: var(--serif); font-weight: 700; font-size: 34px; color: var(--red); border: 3px double var(--red); border-radius: 6px; padding: 4px 14px; transform: rotate(-6deg); animation: stamp .45s cubic-bezier(.3,1.7,.5,1) .15s both; letter-spacing: .02em; }
@keyframes stamp { from { transform: rotate(-6deg) scale(2.2); opacity: 0; } }
.reward ul { list-style: none; margin: 0; padding: 0; text-align: left; display: grid; gap: 2px; }
.reward li { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; border-bottom: 1px dotted var(--ink-3); padding: 3px 0; }
.reward li b { font-family: var(--hand); font-size: 20px; line-height: 1; }
.reward .hl { font-family: var(--hand); font-size: 26px; font-weight: 700; color: var(--ink); line-height: 1.1; }
.reward .sketch { width: 160px; margin: 0 auto; position: relative; aspect-ratio: 1; }
.reward .sketch > div { position: absolute; inset: 0; }
.reward .sketch svg { width: 100%; height: 100%; overflow: visible; }
.reward .sketch .old { animation: fadeout 1.2s ease forwards; }
.reward .sketch .new { opacity: 0; animation: inkup 1.4s .5s ease forwards; }
@keyframes fadeout { 60% { opacity: .6; filter: blur(1px); } to { opacity: 0; filter: blur(3px); } }
@keyframes inkup { from { opacity: 0; clip-path: circle(0% at 50% 60%); } to { opacity: 1; clip-path: circle(75% at 50% 60%); } }
.toast { position: fixed; z-index: 70; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) rotate(-1deg); background: var(--slip); color: var(--ink); padding: 8px 16px; border-radius: 4px; box-shadow: 0 6px 18px rgba(30,42,68,.25); font-family: var(--hand); font-size: 21px; max-width: calc(100% - 100px); animation: fade .2s ease; }
.foot { margin-top: 28px; display: grid; gap: 6px; }

@media (min-width: 900px) {
  .pagewrap { padding-left: 40px; padding-right: 32px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; align-items: start; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; animation-delay: 0s !important; }
  .reward .sketch .old { opacity: 0; } .reward .sketch .new { opacity: 1; clip-path: none; }
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="2.6"/></filter>
  <filter id="washf"><feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" seed="2"/><feDisplacementMap in="SourceGraphic" scale="7"/></filter>
</svg>
<div class="book">
  <main class="pagewrap" id="app"></main>
  <nav class="index" id="nav" aria-label="Journal sections"></nav>
</div>
<div id="layer"></div>
<button class="pen" data-a="quick" aria-label="Write an entry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l3.5-1 11-11a2.1 2.1 0 0 0-3-3l-11 11z"/><path d="M14 6.5l3 3"/></svg>Write</button>

<script src="core.js"></script>
<script src="shell.js"></script>
<script>
(() => {
'use strict';
const E = LT.esc, F = LT.fmt, D = LT.date, T = LT.TODAY;
const cv = id => `--c: var(--${id || 'ink'})`;

/* ---------- the wren (ink + watercolour) ---------- */
const STAGE = ['Egg', 'Fledgling', 'Wren', 'Songbird', 'Gilded Wren'];
function wren(stage, o = {}) {
  const ink = 'stroke="var(--ink)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#wobble)"';
  const wash = (d, c, op = .55) => `<path d="${d}" fill="${c}" opacity="${op}" filter="url(#washf)"/>`;
  const nest = `${wash('M44 150 Q100 190 156 150 Q150 168 100 172 Q52 168 44 150Z', '#8A6A3E', .5)}
    <path d="M42 150 Q100 192 158 150" ${ink}/><path d="M48 156 Q100 182 152 156 M52 162 Q100 178 148 160 M60 150 l14 14 M86 154 l18 12 M120 152 l-16 14 M140 152 l-12 12" stroke="var(--ink)" stroke-width="1.1" fill="none" opacity=".6" filter="url(#wobble)"/>`;
  const twig = `<path d="M30 168 Q100 160 176 166" stroke="#5B4026" stroke-width="3.2" fill="none" stroke-linecap="round" filter="url(#wobble)"/><path d="M150 165 q8 -10 18 -12" stroke="#5B4026" stroke-width="2" fill="none" filter="url(#wobble)"/>`;
  const body = (open) => `
    ${wash('M58 116 C56 88 84 72 114 76 C138 66 162 76 160 100 C158 128 136 150 104 150 C78 150 60 138 58 116Z', '#9A6B3F', .6)}
    ${wash('M70 128 C84 144 120 148 140 132 C128 146 96 150 76 140Z', '#E7D2B0', .7)}
    ${wash('M62 112 L36 64 L52 60 L74 104Z', '#7E5631', .65)}
    <path d="M58 116 C56 88 84 72 114 76 C122 70 132 68 140 70 C156 74 164 88 160 102 C156 128 136 150 104 150 C78 150 60 138 58 116Z" ${ink}/>
    <path d="M62 110 L36 64 L52 60 L72 102" ${ink}/>
    <path d="M42 72 l9 -2 M45 80 l9 -2 M49 88 l9 -2 M53 96 l8 -2" stroke="var(--ink)" stroke-width="1.2" opacity=".7" filter="url(#wobble)"/>
    <path d="M86 110 C102 98 126 102 134 120 C118 130 98 128 86 110Z" ${ink}/>
    <path d="M96 112 l8 6 M106 108 l8 8 M116 108 l8 9" stroke="var(--ink)" stroke-width="1.1" opacity=".65" filter="url(#wobble)"/>
    <path d="M128 82 Q142 78 156 84" stroke="#F3EAD8" stroke-width="3" fill="none" stroke-linecap="round"/>
    ${open ? '<path d="M158 90 L178 84 M158 94 L176 100" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"/>' : '<path d="M158 90 L178 95 L158 98" stroke="var(--ink)" stroke-width="2" fill="#5B4026" stroke-linejoin="round"/>'}
    <circle cx="146" cy="91" r="3.4" fill="var(--ink)"/><circle cx="147.2" cy="89.8" r="1" fill="#fff"/>
    <path d="M96 150 L92 166 M110 150 L112 166 M88 166 h8 M108 166 h8" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round"/>`;
  let art = '';
  if (stage === 0) {
    art = `${nest}${wash('M100 110 C120 110 128 132 126 146 C124 160 112 166 100 166 C88 166 76 160 74 146 C72 132 80 110 100 110Z', '#D7DEE4', .9)}
      <path d="M100 110 C120 110 128 132 126 146 C124 160 112 166 100 166 C88 166 76 160 74 146 C72 132 80 110 100 110Z" ${ink}/>
      ${[[90, 128], [106, 122], [112, 140], [92, 148], [100, 136]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2" fill="#7E5631" opacity=".7"/>`).join('')}`;
  } else if (stage === 1) {
    art = `${wash('M68 140 C66 112 84 96 104 96 C126 96 138 112 136 136 C134 156 120 164 100 164 C82 164 70 156 68 140Z', '#A88A63', .6)}
      <path d="M68 140 C66 112 84 96 104 96 C126 96 138 112 136 136 C134 156 120 164 100 164 C82 164 70 156 68 140Z" ${ink}/>
      <path d="M94 98 q2 -12 8 -14 M102 96 q4 -10 10 -10 M88 100 q-4 -8 -2 -14" ${ink}/>
      <path d="M134 118 L148 122 L134 128" stroke="var(--ink)" stroke-width="2" fill="#E2B04A" stroke-linejoin="round"/>
      <circle cx="122" cy="116" r="4" fill="var(--ink)"/><circle cx="123.4" cy="114.6" r="1.2" fill="#fff"/>
      <path d="M80 132 q10 10 24 6" ${ink}/>${nest}`;
  } else {
    const leaves = stage >= 3 ? `${[[44, 158, -30], [70, 170, 20], [150, 156, 35], [172, 152, -20]].map(([x, y, r]) => `<g transform="translate(${x} ${y}) rotate(${r})">${wash('M0 0 C6 -10 18 -10 24 0 C18 8 6 8 0 0Z', '#5E8B55', .7)}<path d="M0 0 C6 -10 18 -10 24 0 C18 8 6 8 0 0Z M0 0 H22" stroke="var(--ink)" stroke-width="1.2" fill="none" filter="url(#wobble)"/></g>`).join('')}
      <g transform="translate(160 150)">${[0, 72, 144, 216, 288].map(a => `<ellipse rx="4" ry="7" transform="rotate(${a}) translate(0 -7)" fill="#E8B4B8" opacity=".9"/>`).join('')}<circle r="3" fill="#E2B04A"/></g>` : '';
    const notes = stage >= 3 ? `<g fill="var(--ink)" filter="url(#wobble)"><path d="M178 60 v-18 l10 -3 v16" stroke="var(--ink)" stroke-width="1.6" fill="none"/><ellipse cx="175" cy="61" rx="4" ry="3"/><ellipse cx="185" cy="56" rx="4" ry="3"/><path d="M186 34 v-14" stroke="var(--ink)" stroke-width="1.6"/><ellipse cx="183" cy="35" rx="4" ry="3"/></g>` : '';
    const gilt = stage >= 4 ? `<circle cx="110" cy="104" r="78" fill="none" stroke="var(--gold)" stroke-width="1.4" stroke-dasharray="1 6" opacity=".9"/><path d="M128 66 l6 -14 l6 10 l6 -12 l6 12 l6 -10 l4 16" fill="#E2B04A" stroke="var(--gold)" stroke-width="1.4" filter="url(#wobble)"/>` : '';
    art = `${gilt}${twig}${leaves}${body(stage >= 3)}${notes}`;
  }
  return `<svg viewBox="0 0 200 200" role="img" aria-label="${STAGE[stage]}, your character"><g class="${o.still ? '' : 'sway'}">${art}</g></svg>`;
}

/* ---------- small helpers ---------- */
const box = (on) => `<span class="box ${on ? 'on' : ''}"><svg viewBox="0 0 26 26"><rect x="3" y="4" width="19" height="18" rx="2" transform="rotate(-2 13 13)" filter="url(#wobble)"/><path class="tick" d="M6 13 l5 6 l11 -16"/></svg></span>`;
const stepper = (act, val, label, extra = '') => `<span class="stepper" role="group" aria-label="${label}"><button data-a="${act}" data-d="-1" ${extra} aria-label="Decrease ${label}">−</button><output>${val}</output><button data-a="${act}" data-d="1" ${extra} aria-label="Increase ${label}">+</button></span>`;
function tallySvg(n) {
  const groups = Math.floor(Math.min(n, 30) / 5), rest = Math.min(n, 30) % 5; let x = 2, s = '';
  for (let g = 0; g < groups; g++) { for (let i = 0; i < 4; i++) s += `<path d="M${x + i * 5} 4 L${x + i * 5 - 1} 24"/>`; s += `<path d="M${x - 3} 20 L${x + 19} 7"/>`; x += 27; }
  for (let i = 0; i < rest; i++) s += `<path d="M${x + i * 5} 4 L${x + i * 5 - 1} 24"/>`;
  const w = x + rest * 5 + 4;
  return `<svg viewBox="0 0 ${w} 28" style="width:${w}px" aria-hidden="true"><g stroke="var(--ink)" stroke-width="2" stroke-linecap="round" filter="url(#wobble)">${s}</g></svg>`;
}
function inkLine(pct) {
  const w = 300, x = 4 + (w - 8) * pct;
  return `<svg viewBox="0 0 ${w} 16" preserveAspectRatio="none" aria-hidden="true"><path d="M4 9 Q80 6 150 9 T296 8" stroke="var(--rule)" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M4 9 Q80 6 150 9 T296 8" stroke="var(--ink)" stroke-width="6" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="${(pct * 100).toFixed(1)} 200" filter="url(#wobble)"/></svg>`;
}
const head = (id, kicker) => {
  const s = LT.section(id), L = LT.level(id), st = LT.sectionStreak(id);
  return `<header class="sechead" style="${cv(id)}"><span class="kicker">${kicker}</span><h1>${s.full}</h1>
    <div class="meta"><span>Level <b>${L.level}</b></span><span><b class="tnum">${L.into}</b>/${L.need} XP</span>${st.n ? `<span><b>${st.n}</b> ${st.label}</span>` : ''}</div></header>`;
};
const label = (t, right = '') => `<h2 class="section-label"><span>${t}</span>${right}</h2>`;
function taskLine(t) {
  const s = LT.section(t.section);
  return `<div class="todo ${t.done ? 'done' : ''}" style="${cv(t.section)}"><button data-a="task" data-v="${t.id}" aria-label="${t.done ? 'Mark not done' : 'Complete'}: ${E(t.title)}" style="display:contents">${box(t.done)}</button>
    <div><b>${E(t.title)}</b><small><span class="pr ${t.priority}">${t.priority === 'high' ? '!! ' : t.priority === 'medium' ? '! ' : ''}${t.priority}</span>${t.due ? ` · <span class="${LT.tasks.overdue(t) ? 'over' : ''}">${F.rel(t.due).toLowerCase()}</span>` : ''}${s ? ` · <span class="swatch"></span>${s.name}` : ''}</small></div></div>`;
}
const related = id => { const t = LT.tasks.list({ section: id, status: 'open' }); return t.length ? label('To do here', `<button data-a="go" data-v="tasks" data-sec="${id}">whole list</button>`) + `<div>${t.map(taskLine).join('')}</div>` : ''; };

/* ---------- views ---------- */
const V = {};
V.home = S => {
  const O = LT.overall(), st = LT.streak(), td = LT.today(), ui = S.ui;
  const day = F.dayLong(T), dt = D.parse(T);
  return `<div class="view ${ui.dir === 'back' ? 'back' : ''}">
  <div class="dayhead"><div><div class="d">${day}</div><div class="sub">${dt.getDate()} ${D.MONTHS_LONG[dt.getMonth()]} ${dt.getFullYear()}</div></div>
    <div class="tally" title="Overall streak">${tallySvg(st.n)}<small><b class="tnum" style="font-style:normal">${st.n}</b> days unbroken</small></div></div>
  <div class="two"><div>
  <div class="wren-wrap">
    <button class="wren-btn" data-a="poke" aria-label="Talk to your wren">${wren(O.stage)}</button>
    ${ui.bubble ? `<span class="margin-note">${E(ui.bubble)}</span>` : ''}
  </div>
  <p class="caption">${STAGE[O.stage]}, since ${LT.STAGES[O.stage].since}. Tap the bird.</p>
  <button class="levelline" data-a="go" data-v="you" style="width:100%">

function timeline(nights) {
  const W = 330, rowH = 26, top = 22, left = 50, right = 50, start = 21 * 60, span = 13 * 60, iw = W - left - right;
  const x = m => { const v = m < 720 ? m + 1440 : m; return left + (v - start) / span * iw; };
  let s = '';
  ['21:00', '00:00', '03:00', '06:00', '09:00'].forEach(t => { const xx = x(D.toMin(t)); s += `<line class="grid" x1="${xx}" x2="${xx}" y1="16" y2="${top + nights.length * rowH}"/><text x="${xx}" y="11" text-anchor="middle">${t}</text>`; });
  nights.forEach((n, i) => {
    const y = top + i * rowH + rowH / 2, tg = LT.sleep.targetFor(n.date), inW = Math.abs(LT.sleep.delta(n)) <= 30;
    s += `<rect class="win" x="${x(D.toMin(tg.bed))}" y="${y - 8}" width="${x(D.toMin(tg.wake)) - x(D.toMin(tg.bed))}" height="16" rx="8"/>`;
    s += `<line class="bar ${inW ? '' : 'out'} ${n.fresh ? 'fresh' : ''}" x1="${x(D.toMin(n.bed))}" x2="${x(D.toMin(n.wake))}" y1="${y}" y2="${y}"><title>${F.date(n.date)}: ${n.bed}–${n.wake}</title></line>`;
    s += `<text class="d" x="0" y="${y + 5}">${F.day(n.date).toLowerCase()} ${D.parse(n.date).getDate()}</text><text class="dur" x="${W}" y="${y + 5}" text-anchor="end">${F.hm(LT.sleep.duration(n)).replace(' ', '')}</text>`;
  });
  return `<svg class="tl" viewBox="0 0 ${W} ${top + nights.length * rowH + 2}" style="width:100%;height:auto;display:block" role="img" aria-label="Nightly sleep timeline">${s}</svg>`;
}

const SH = {};
SH.violin = S => {
  const f = S.sheet, Vn = LT.violin, steps = `<p class="cs-steps">${['type', 'minutes', 'pieces'].map((s, i) => i + 1 === f.step ? `<b>${s}</b>` : s).join(' → ')} → saved</p>`;
  let body = '', foot = '';
  if (f.step === 1) {
    const hint = { solo: 'just you and the stand', lesson: 'usually Thursday, 16:00', orchestra: 'usually Thursday, 17:15', trio: 'Elgar with the trio' };
    body = `<div class="opts">${Vn.TYPES.map(t => `<button class="opt ${f.typeId === t.id ? 'on' : ''}" data-a="vtype" data-v="${t.id}"><b>${t.name}</b><small>${hint[t.id]}</small></button>`).join('')}</div>`;
    foot = `<button class="btn block" data-a="close">Not now</button>`;
  } else if (f.step === 2) {
    body = f.timer ? `<div style="text-align:center;display:grid;gap:8px"><span class="it faint">timer</span><b id="vtimer" class="hand tnum" style="font-size:64px;line-height:.9">${S.clock(f.timerSec)}</b><div style="display:flex;gap:8px;justify-content:center"><button class="btn sm ${f.timerRunning ? '' : 'c'}" data-a="vtimer">${f.timerRunning ? 'Pause' : f.timerSec ? 'Resume' : 'Start'}</button><button class="btn sm" data-a="vtimerdone" ${f.timerSec ? '' : 'disabled'}>Use this time</button></div></div>`
      : `<div class="bigmin"><button class="circ" data-a="vmin" data-d="-5" aria-label="5 minutes less">−5</button><output class="tnum">${f.minutes}<small>minutes in total</small></output><button class="circ" data-a="vmin" data-d="5" aria-label="5 minutes more">+5</button></div>
      <div class="picks" style="justify-content:center">${[15, 20, 30, 45, 60, 90].map(m => `<button class="pk ${f.minutes === m ? 'on' : ''}" data-a="vset" data-v="${m}">${m}′</button>`).join('')}</div>`;
    body += `<button class="switchline" data-a="vtimermode"><span>Use a start/stop timer instead</span><span class="toggle-ink ${f.timer ? 'on' : ''}"></span></button><p class="note">One total can cover several pieces.</p>`;
    foot = `<button class="btn" data-a="vback">Back</button><button class="btn c block" data-a="vnext">Next: pieces</button>`;
  } else {
    const alloc = Object.values(f.split).reduce((a, b) => a + b, 0);
    const pk = kind => Vn.pieces.filter(p => p.kind === kind).map(p => `<button class="pk ${f.items.includes(p.id) ? 'on' : ''}" data-a="vitem" data-v="${p.id}">${f.items.includes(p.id) ? '<span class="tk">✓</span>' : ''}${E(p.kind === 'piece' ? p.composer + ', ' + p.title.split(' — ')[0].split(',')[0] : p.title)}</button>`).join('');
    body = `<p class="it muted">${f.minutes} minutes of ${Vn.typeName(f.typeId).toLowerCase()}. What was on the stand?</p>
      <div><div class="lbl">pieces</div><div class="picks">${pk('piece')}</div></div><div><div class="lbl">scales</div><div class="picks">${pk('scale')}</div></div>
      <button class="switchline" data-a="vsplitmode" ${f.items.length > 1 ? '' : 'disabled style="opacity:.45"'}><span>Split the time by piece <i class="faint">(optional)</i></span><span class="toggle-ink ${f.splitOn ? 'on' : ''}"></span></button>
      ${f.splitOn && f.items.length > 1 ? `<div>${f.items.map(id => `<div class="rowsplit"><span>${E(Vn.item(id).kind === 'piece' ? Vn.item(id).composer : Vn.item(id).title)}</span>${stepper('vsplit', (f.split[id] || 0) + '′', 'minutes', `data-v="${id}"`)}</div>`).join('')}<p class="note ${alloc > f.minutes ? 'warn' : ''}" style="margin-top:6px">${alloc > f.minutes ? `${alloc - f.minutes} minutes more than the total. Take some off.` : `${alloc} of ${f.minutes} minutes placed${alloc < f.minutes ? '; the rest stays unassigned' : ''}.`}</p></div>` : ''}
      ${f.noteOpen ? `<div><div class="lbl">note</div><textarea id="vnote" data-in="notes" placeholder="What to fix next time…">${E(f.notes)}</textarea></div>` : `<button class="linkish" data-a="vnote" style="justify-self:start">add a note</button>`}`;
    foot = `<button class="btn" data-a="vback">Back</button><button class="btn c block" data-a="vsave" ${f.items.length && !(f.splitOn && alloc > f.minutes) ? '' : 'disabled'}>Save ${f.minutes}′</button>`;
  }
  return slip('Violin practice', `<div class="cs-body" data-sheet-body>${body}</div><div class="cs-foot">${foot}</div>`, 'violin', steps);
};
SH.quick = S => slip('Write an entry', `<div class="cs-body" data-sheet-body><div class="opts">${[['violin', 'Violin', 'type, minutes, pieces'], ['gym', 'Gym', LT.state.gym.active ? 'carry on' : 'today’s sheet'], ['sleep', 'Last night', LT.sleep.lastNightLogged() ? 'written' : 'bed and wake'], ['screen', 'Screen time', LT.screen.todayLogged() ? 'written' : 'today’s total'], ['sports', 'Sport', 'run, ride, swim, court'], ['study', 'Study', 'subject and minutes'], ['chess', 'Chess', 'puzzles or study'], ['tasks', 'A task', 'for the list']].map(([id, t, s]) => `<button class="opt" data-a="ql" data-v="${id}" style="${cv(id === 'tasks' ? 'todo' : id)}"><b><span class="swatch"></span>${t}</b><small>${s}</small></button>`).join('')}</div></div>`, 'ink');
SH.sport = S => {
  const f = S.sheet, K = LT.sports.kinds, end = ['running', 'cycling', 'swimming'].includes(f.sport);
  const metric = end ? (f.sport === 'running' ? F.pace(f.minutes, f.km) : f.sport === 'cycling' ? F.speed(f.minutes, f.km) : F.swim(f.minutes, f.km)) : '';
  return slip('Sport', `<div class="cs-body" data-sheet-body>
    <div class="picks">${Object.keys(K).map(k => `<button class="pk ${f.sport === k ? 'on' : ''}" data-a="ssport" data-v="${k}">${K[k].name}</button>`).join('')}</div>
    <div class="rowsplit"><span>Duration</span>${stepper('smin', F.dur(f.minutes), 'duration')}</div>
    ${end ? `<div class="rowsplit"><span>Distance</span>${stepper('skm', f.km.toFixed(f.sport === 'swimming' ? 2 : 1) + ' km', 'distance')}</div><div class="rowsplit"><span class="it">${f.sport === 'cycling' ? 'speed' : 'pace'}, worked out</span><b class="hand" style="font-size:24px">${metric}</b></div>`
      : `<div class="rowsplit"><span>Kind</span><span class="picks">${['Training', 'Match'].map(x => `<button class="pk ${f.kind === x ? 'on' : ''}" data-a="skind" data-v="${x}">${x}</button>`).join('')}</span></div>${f.kind === 'Match' ? `<input type="text" id="sscore" data-in="score" placeholder="score (optional)" value="${E(f.score)}">` : ''}`}
    <textarea id="snotes" data-in="notes" placeholder="${end ? 'route, how it felt…' : 'skill notes…'}">${E(f.notes)}</textarea>
  </div><div class="cs-foot"><button class="btn" data-a="close">Cancel</button><button class="btn c block" data-a="ssave">Save</button></div>`, 'sports');
};
SH.study = S => { const f = S.sheet; return slip('Study', `<div class="cs-body" data-sheet-body><div class="picks">${LT.study.subjects.map(s => `<button class="pk ${f.subject === s.id ? 'on' : ''}" data-a="stsub" data-v="${s.id}">${s.name}</button>`).join('')}</div><div class="rowsplit"><span>Duration</span>${stepper('stmin', F.dur(f.minutes), 'duration')}</div><input type="text" id="sttopic" data-in="topic" placeholder="topic covered" value="${E(f.topic)}"></div><div class="cs-foot"><button class="btn" data-a="close">Cancel</button><button class="btn c block" data-a="stsave">Save</button></div>`, 'study'); };
SH.chess = S => { const f = S.sheet; return slip('Chess', `<div class="cs-body" data-sheet-body><div class="picks">${[['puzzles', 'Puzzles'], ['study', 'Study']].map(([k, l]) => `<button class="pk ${f.kind === k ? 'on' : ''}" data-a="chkind" data-v="${k}">${l}</button>`).join('')}</div><div class="rowsplit"><span>Duration</span>${stepper('chmin', F.dur(f.minutes), 'duration')}</div>${f.kind === 'puzzles' ? `<div class="rowsplit"><span>Solved</span>${stepper('chsolved', f.solved, 'puzzles solved')}</div>` : `<input type="text" id="chtopic" data-in="topic" placeholder="what you studied" value="${E(f.topic)}">`}<p class="note">Games would come from Chess.com; here they are fictional samples.</p></div><div class="cs-foot"><button class="btn" data-a="close">Cancel</button><button class="btn c block" data-a="chsave">Save</button></div>`, 'chess'); };
SH.swap = S => { const e = LT.state.gym.active.exercises[S.sheet.ei]; return slip('Swap for today', `<div class="cs-body" data-sheet-body><p class="it muted">Instead of ${E(e.name)}:</p>${e.alts.map(a => `<button class="line" data-a="gswapto" data-v="${E(a)}" style="width:100%;text-align:left;grid-template-columns:1fr auto"><span class="t"><b>${E(a)}</b></span><span class="linkish" style="min-height:0">use</span></button>`).join('')}</div>`, 'gym'); };
SH.finish = S => { const f = S.sheet; return slip('How did it feel?', `<div class="cs-body" data-sheet-body><p class="note">Optional. It helps plan the next sessions around sport and recovery.</p>
  <div><div class="lbl">effort, out of 10</div><div class="scale5">${[5, 6, 7, 8, 9].map(v => `<button class="${f.effort === v ? 'on' : ''}" data-a="fin" data-f="effort" data-v="${v}">${v}</button>`).join('')}</div></div>
  <div><div class="lbl">soreness, 0 to 4</div><div class="scale5">${[0, 1, 2, 3, 4].map(v => `<button class="${f.soreness === v ? 'on' : ''}" data-a="fin" data-f="soreness" data-v="${v}">${v}</button>`).join('')}</div></div>
  <button class="switchline" data-a="finpain"><span>Any pain? <i class="faint">shins, joints…</i></span><span class="toggle-ink ${f.pain ? 'on' : ''}"></span></button>
  ${f.pain ? `<input type="text" id="painnote" data-in="painNote" placeholder="where, and what made it worse" value="${E(f.painNote)}">` : ''}</div>
  <div class="cs-foot"><button class="btn" data-a="close">Back</button><button class="btn c block" data-a="gdone">Save the sheet</button></div>`, 'gym'); };
SH.ev = S => {
  const f = S.sheet, o = f.occ, s = LT.section(o.section);
  return slip(o.title, `<div class="cs-body" data-sheet-body>
    <p class="it muted">${s ? s.name : 'General'} · ${F.long(o.date)}${o.start ? ', ' + o.start + '–' + o.end : ''}${o.recurring ? ' · repeats weekly' : ''}</p>
    ${o.conflict && !o.cancelled ? `<p class="clash-note" style="font-size:18px">Overlaps ${E(o.conflictWith.join(', '))}. You choose what moves.</p>` : ''}
    ${o.status === 'done' ? `<p class="note">Done: ${E(o.logged.title)}.</p>` : ''}
    ${o.cancelled ? `<button class="btn block" data-a="evrestore">Restore it</button>` : `
    <div class="rowsplit"><span>Day</span>${stepper('evd', F.date(f.date), 'date')}</div>
    ${o.start ? `<div class="rowsplit"><span>Starts</span>${stepper('evt', f.start, 'start time')}</div>` : ''}
    ${o.recurring ? `<div><div class="lbl">change</div><div class="opts"><button class="opt ${f.scope === 'one' ? 'on' : ''}" data-a="evscope" data-v="one"><b>Just this one</b><small>${F.date(o.origDate)}</small></button><button class="opt ${f.scope === 'future' ? 'on' : ''}" data-a="evscope" data-v="future"><b>This and after</b><small>rewrites the series</small></button></div></div>` : ''}
    <div style="display:flex;gap:8px"><button class="btn" data-a="evcancel" style="color:var(--red);border-color:var(--red)">Cancel ${o.recurring && f.scope === 'future' ? 'from here' : 'it'}</button><button class="btn c" data-a="evsave" style="flex:1">Save</button></div>`}
    <p class="note">${E(LT.LABELS.google)}.</p></div>`, o.section || 'diary');
};
SH.task = S => { const f = S.sheet; return slip('A task', `<div class="cs-body" data-sheet-body><input type="text" id="tasktitle" data-in="title" placeholder="what needs doing?" value="${E(f.title)}" aria-label="Task">
  <div><div class="lbl">section</div><div class="picks"><button class="pk ${!f.section ? 'on' : ''}" data-a="tsec" data-v="">none</button>${LT.SECTIONS.map(s => `<button class="pk ${f.section === s.id ? 'on' : ''}" data-a="tsec" data-v="${s.id}" style="${cv(s.id)}">${s.name}</button>`).join('')}</div></div>
  <div><div class="lbl">priority</div><div class="picks">${['high', 'medium', 'low'].map(p => `<button class="pk ${f.priority === p ? 'on' : ''}" data-a="tpri" data-v="${p}">${p}</button>`).join('')}</div></div>
  <div><div class="lbl">due</div><div class="picks">${[['', 'no date'], [T, 'today'], [D.addDays(T, 1), 'tomorrow'], [D.addDays(T, 7), 'next week']].map(([d, l]) => `<button class="pk ${f.due === d ? 'on' : ''}" data-a="tdue" data-v="${d}">${l}</button>`).join('')}</div></div></div>
  <div class="cs-foot"><button class="btn" data-a="close">Cancel</button><button class="btn c block" data-a="tsave">Add to the list</button></div>`, 'todo'); };
SH.addev = S => { const f = S.sheet; return slip('Add to the diary', `<div class="cs-body" data-sheet-body><input type="text" id="evtitle" data-in="title" placeholder="what is it?" value="${E(f.title)}" aria-label="Event title">
  <div class="picks">${LT.SECTIONS.map(s => `<button class="pk ${f.section === s.id ? 'on' : ''}" data-a="aesec" data-v="${s.id}" style="${cv(s.id)}">${s.name}</button>`).join('')}</div>
  <div class="rowsplit"><span>Day</span>${stepper('aed', F.date(f.date), 'date')}</div><div class="rowsplit"><span>Starts</span>${stepper('aet', f.start, 'start time')}</div></div>
  <div class="cs-foot"><button class="btn" data-a="close">Cancel</button><button class="btn c block" data-a="aesave">Add</button></div>`, 'diary'); };

/* ---------- reward ---------- */
function reward(r) {
  const O = LT.overall();
  const evo = r.evolved ? `<div class="sketch"><div class="old">${wren(r.evolved.from, { still: true })}</div><div class="new">${wren(r.evolved.to, { still: true })}</div></div><p class="hl">The ${STAGE[r.evolved.from].toLowerCase()} is now a ${STAGE[r.evolved.to].toLowerCase()}</p><p class="note">Level ${r.overallUp.to}. A new sketch for the book, earned over months.</p>` : '';
  return `<div class="reward" data-reward role="dialog" aria-modal="true" aria-label="Reward"><div class="card">
    ${r.rest ? `<div style="width:120px;margin:0 auto">${wren(O.stage, { still: true })}</div><p class="hl">Rest day written down</p><p class="note">The streak carries on: ${r.streak} days. Resting is part of getting better.</p>` : `
    ${evo || `<div style="width:110px;margin:0 auto">${wren(O.stage, { still: true })}</div>`}
    ${r.preview ? '<span class="stamp" style="justify-self:center;color:var(--red)">preview only</span>' : `<div class="xpstamp tnum">+${r.total} XP</div><ul>${r.lines.map(l => `<li><span>${E(l.reason)}</span><b>+${l.xp}</b></li>`).join('')}</ul>`}`}
    ${r.sectionUps.map(u => `<p class="hl" style="font-size:22px">${E(u.name)} turns a page: Level ${u.to}</p>`).join('')}
    ${r.overallUp && !r.evolved ? `<p class="hl" style="font-size:22px">Overall Level ${r.overallUp.to}</p>` : ''}
    ${(r.unlocked || []).map(a => `<p class="hl" style="font-size:21px;color:var(--red)">New seal: ${E(a.title)}</p><p class="note">${E(a.desc)}</p>`).join('')}
    ${r.pain ? '<p class="note warn" style="text-align:left">You noted pain. Consider resting or easing the next session, and talk to a coach or physio if it keeps coming back.</p>' : ''}
    ${r.streakUp ? `<p class="note">Streak: ${r.streak} days unbroken.</p>` : ''}
    <button class="btn ink block" data-a="rclose">Close the book</button></div></div>`;
}

Shell({
  key: 'inkwell', navId: 'nav', views: V, sheets: SH, reward, nav,
  toastClass: 'toast',
  restBar: (left, S) => `<div class="restbar" role="status"><span class="grow">rest</span><b class="tnum">${S.clock(left)}</b><button data-a="rest30">+30s</button><button data-a="restskip">skip</button></div>`,
  pokeLines: S => { const O = LT.overall(), st = LT.streak(); return [`${st.n} days, unbroken. Rest days count.`, `${O.toNext} XP to Level ${O.level + 1}.`, `${LT.violin.weekTotal()} of ${LT.state.violin.target} violin minutes so far.`, 'Lower A at ten, then a quiet afternoon.']; },
  onPoke: () => { const b = document.querySelector('.wren-btn'); if (b) { b.classList.remove('hop'); void b.offsetWidth; b.classList.add('hop'); } },
});
})();
</script>
